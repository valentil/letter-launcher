                    // ---- state advancers -------------------------------------
                    'LAUNCH|IGNITE|BLAST|LIFTOFF': () => {
                        if (st.phase !== 'pad' && st.phase !== 'landed') { gameMsg('We are already off the pad.'); return; }
                        if (st.fuel < 0.25) { gameMsg('Tanks nearly dry — FUEL up first.'); return; }
                        st.phase = 'ascent'; st.fuel -= 0.25;
                        if (!gameMode.won) { st.lap = 0; st.lapDone = false; }
                        beeps([[90, 1.2, 0, 'sawtooth', 0.3], [140, 1.0, 300, 'sawtooth', 0.2]]);
                        puffBurst(st.rocket.position.clone(), 0xdddddd, 20, 1.5, { decay: 0.02 });
                        gameMsg('IGNITION. The little ship climbs away from the pad…');
                    },
                    'STAGE|SEPARATE|JETTISON': () => {
                        if (st.staged) { gameMsg('The booster is already tumbling below.'); return; }
                        if (st.phase === 'pad') { gameMsg('Staging on the pad would just be littering.'); return; }
                        st.staged = true;
                        st.booster.visible = false;
                        const chunk = st.booster.clone();
                        chunk.visible = true;
                        const from = st.rocket.position.clone();
                        flyby(chunk, from, CENTER.clone().addScaledVector(padDir(st.th - 0.5), MOON_R + 0.4), 2600, {
                            spin: true, onDone: () => puffBurst(chunk.position.clone(), 0xaaaaaa, 10, 1, { decay: 0.03 })
                        });
                        gameBeep(300, 0.3, 'square', 0.15);
                        gameMsg('Booster away! The ship feels light enough to circle now.');
                    },
                    'ORBIT|CIRCLE': () => {
                        if (st.phase !== 'coast' && st.phase !== 'ascent') { gameMsg(st.phase === 'orbit' ? 'Already orbiting.' : 'Get off the pad first (LAUNCH).'); return; }
                        if (!st.staged) { gameMsg('The spent booster is dead weight — the ship cannot circle yet. (STAGE)'); return; }
                        if (st.alt < 5) { gameMsg('Too low to orbit — keep climbing.'); return; }
                        st.phase = 'orbit';
                        gameBeep(660, 0.4, 'triangle', 0.15);
                        gameMsg('Orbit achieved! One full lap around the moon, pilot.');
                    },
                    'BOOST|BURN': () => {
                        if (st.phase !== 'orbit' && st.phase !== 'coast') { gameMsg('Nothing to boost right now.'); return; }
                        if (st.fuel < 0.15) { gameMsg('Not enough fuel for a burn.'); return; }
                        st.fuel -= 0.15;
                        st.alt = Math.min(11, st.alt + 2);
                        for (let i = 0; i < 8; i++) setTimeout(() => flame(0.14), i * 60);
                        gameMsg('Prograde burn — orbit raised.');
                    },
                    'RETRO|BRAKE|SLOW': () => {
                        if (st.phase !== 'orbit') { gameMsg('A retro-burn needs an orbit to slow down from.'); return; }
                        st.phase = 'deorbit';
                        st.orbitRing.visible = false;
                        for (let i = 0; i < 8; i++) setTimeout(() => flame(0.14), i * 60);
                        gameMsg('Retro-burn… descending. LAND when the pad passes below.');
                    },
                    'LAND|TOUCHDOWN': () => {
                        if (st.phase === 'pad' || st.phase === 'landed') { gameMsg('We are on the ground, flight.'); return; }
                        if (st.phase === 'orbit') { gameMsg('Too fast to land from orbit — RETRO first.'); return; }
                        if (Math.abs(angDiff(st.th, st.padTh)) > 0.38) { gameMsg('Not above the pad! Wait for it to come around.'); return; }
                        st.phase = 'landing';
                        gameMsg('Gear out… easing down to the pad…');
                    },
                    'ABORT': () => {
                        if (st.phase === 'pad' || st.phase === 'landed') { gameMsg('Nothing to abort.'); return; }
                        st.phase = 'landing'; st.th = st.padTh;
                        gameMsg('ABORT — auto-return spirals the ship straight home.');
                        gameBeep(220, 0.6, 'square', 0.2);
                    },
                    'FUEL|REFUEL|TANK': () => {
                        if (st.phase !== 'pad' && st.phase !== 'landed') { gameMsg('No fuel trucks in space, sadly.'); return; }
                        st.fuel = 1;
                        puffBurst(st.rocket.position.clone(), 0xa8e6ff, 10, 1, { decay: 0.025 });
                        gameMsg('Tanks topped off.');
                    },
                    'FLIP|REVERSE': () => {
                        st.dir *= -1;
                        gameMsg('Flipping the orbit — now circling the other way.');
                    },
                    'SCAN|RADAR|MAP': () => {
                        st.padBeacon.visible = !st.padBeacon.visible;
                        st.orbitRing.visible = st.padBeacon.visible;
                        gameBeep(1200, 0.15, 'sine', 0.1);
                        gameMsg(st.padBeacon.visible ? 'Scanner ON — pad beacon and orbit guide lit.' : 'Scanner off.');
                    },
                    // ---- doodads ---------------------------------------------
                    'STARS|STAR|TWINKLE': () => {
                        tween(2400, k => { st.starMat.size = 0.5 + Math.abs(Math.sin(k * Math.PI * 3)) * 0.7; });
                        gameMsg('The starfield shimmers.');
                    },
                    'COMET|REX': () => {
                        const comet = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 0),
                            new THREE.MeshBasicMaterial({ color: 0xaaffee }));
                        flyby(comet, new THREE.Vector3(-70, 40, -30), new THREE.Vector3(70, -10, -20), 4200, { spin: true });
                        const trail = setInterval(() => {
                            if (!gameMode || !comet.parent) { clearInterval(trail); return; }
                            fwParticle(comet.position.clone(), new THREE.Vector3(0, 0, 0),
                                new THREE.Color(0x88ffee), { gravity: 0, decay: 0.02, size: 0.12 });
                        }, 50);
                        setTimeout(() => clearInterval(trail), 4400);
                        gameMsg('Rex the comet streaks past, showing off as usual.');
                    },
                    'METEOR|METEORS|SHOWER': () => {
                        for (let i = 0; i < 3; i++) setTimeout(() => {
                            const a = Math.random() * Math.PI * 2;
                            const hit = CENTER.clone().addScaledVector(padDir(a), MOON_R);
                            const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 0),
                                new THREE.MeshBasicMaterial({ color: 0xffaa66 }));
                            flyby(m, hit.clone().addScaledVector(padDir(a), 30).add(new THREE.Vector3(14, 10, 0)), hit, 900,
                                { onDone: () => { puffBurst(hit, 0xbbbbbb, 14, 1, { decay: 0.03 }); gameBeep(90, 0.3, 'sawtooth', 0.15); } });
                        }, i * 500);
                        gameMsg('Meteorites pepper the far side.');
                    },
                    'EARTH|PLANET|HOME': () => {
                        tween(2000, k => st.planet.scale.setScalar(1 + Math.sin(k * Math.PI) * 0.15));
                        gameMsg('The blue planet glows — everyone you know lives there.');
                    },
                    'SUN|FLARE': () => {
                        tween(1600, k => { st.sun.scale.setScalar(1 + Math.sin(k * Math.PI) * 0.6); st.light.intensity = 1.6 + Math.sin(k * Math.PI) * 1.4; });
                        gameMsg('A solar flare ripples past. Sunglasses on.');
                    },
                    'NEBULA': () => {
                        const h = Math.random();
                        tween(3000, k => st.nebulaMat.color.setHSL(h, 0.7, 0.12 + Math.sin(k * Math.PI) * 0.08));
                        gameMsg('The nebula blushes a new color.');
                    },
                    'ALIEN': () => {
                        const blob = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6),
                            new THREE.MeshPhongMaterial({ color: 0x77dd77, emissive: 0x1a4a1a }));
                        const a = st.padTh + 2.2;
                        const from = CENTER.clone().addScaledVector(padDir(a), MOON_R - 0.6);
                        flyby(blob, from, from.clone().addScaledVector(padDir(a), 1.4), 800, {
                            onDone: () => setTimeout(() => { if (scene) flyby(blob.clone(), blob.position.clone(), from, 800); }, 900)
                        });
                        beeps([[1600, 0.08, 0, 'square', 0.08], [1900, 0.08, 120, 'square', 0.08]]);
                        gameMsg('Something green peeked out of a crater. It waved?');
                    },
                    'UFO|SAUCER': () => {
                        const ufo = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 1.6, 0.5, 12),
                            new THREE.MeshStandardMaterial({ color: 0xc0c8d4, metalness: 0.9, roughness: 0.1 }));
                        flyby(ufo, new THREE.Vector3(60, 25, -10), new THREE.Vector3(-60, 18, -6), 1500, { spin: true });
                        beeps([[1400, 0.1, 0, 'square', 0.08], [900, 0.12, 130, 'square', 0.08]]);
                        gameMsg('A saucer buzzes the pattern. Rude.');
                    },
                    'FLAG': () => {
                        if (st.flagPlanted) { gameMsg('The flag already stands proud.'); return; }
                        st.flagPlanted = true;
                        const fg = new THREE.Group();
                        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.6, 6),
                            new THREE.MeshPhongMaterial({ color: 0xcccccc }));
                        pole.position.y = 0.8; fg.add(pole);
                        const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.5),
                            new THREE.MeshBasicMaterial({ color: 0xff4466, side: THREE.DoubleSide }));
                        cloth.position.set(0.48, 1.3, 0); fg.add(cloth);
                        const base = CENTER.clone().addScaledVector(padDir(st.padTh + 0.28), MOON_R + 0.05);
                        fg.position.copy(base);
                        fg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), padDir(st.padTh + 0.28));
                        scene.add(fg);
                        gameMsg('Flag planted beside the pad. History!');
                    },
                    'MOON|WOBBLE': () => {
                        tween(1600, k => {
                            const s = 1 + Math.sin(k * Math.PI * 2) * 0.05 * (1 - k);
                            st.moon.scale.set(s, 2 - s, s);
                        }, () => st.moon.scale.setScalar(1));
                        gameMsg('The moon jiggles like it is made of mochi.');
                    },
                    'CRATER|GEYSER': () => {
                        const a = Math.random() * Math.PI * 2;
                        puffBurst(CENTER.clone().addScaledVector(padDir(a), MOON_R + 0.3),
                            0xd0d0d0, 18, 0.6, { gravity: 0.0012, decay: 0.015, size: 0.09 });
                        gameMsg('A dust geyser vents from an old crater.');
                    },
                    'DUST': () => {
                        puffBurst(st.rocket.position.clone(), 0xbfbfbf, 16, 1.4, { decay: 0.02 });
                        gameMsg('Moon dust swirls around the ship.');
                    },
                    'SATELLITE': () => {
                        const sat = new THREE.Group();
                        const bus = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
                            new THREE.MeshStandardMaterial({ color: 0xccb84a, metalness: 0.6 }));
                        sat.add(bus);
                        [-0.9, 0.9].forEach(x => {
                            const panel = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.5),
                                new THREE.MeshPhongMaterial({ color: 0x2244aa }));
                            panel.position.x = x; sat.add(panel);
                        });
                        flyby(sat, new THREE.Vector3(-55, 14, -12), new THREE.Vector3(55, 20, -12), 9000, { spin: true });
                        beeps([[2000, 0.05, 0, 'sine', 0.06], [2000, 0.05, 600, 'sine', 0.06], [2000, 0.05, 1200, 'sine', 0.06]]);
                        gameMsg('A satellite blinks past overhead.');
                    },
                    'ROVER': () => {
                        const rover = new THREE.Group();
                        const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.5),
                            new THREE.MeshStandardMaterial({ color: 0xd0d4da, metalness: 0.5 }));
                        chassis.position.y = 0.25; rover.add(chassis);
                        for (let i = 0; i < 4; i++) {
                            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.1, 8),
                                new THREE.MeshPhongMaterial({ color: 0x222222 }));
                            wheel.rotation.x = Math.PI / 2;
                            wheel.position.set((i % 2) * 0.6 - 0.3, 0.14, (i < 2 ? 0.3 : -0.3));
                            rover.add(wheel);
                        }
                        const a0 = st.padTh - 0.9, a1 = st.padTh - 2.2;
                        const from = CENTER.clone().addScaledVector(padDir(a0), MOON_R + 0.15);
                        const to = CENTER.clone().addScaledVector(padDir(a1), MOON_R + 0.15);
                        rover.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), padDir(a0));
                        flyby(rover, from, to, 8000, { arc: 1.2 });
                        gameMsg('The old rover trundles between craters.');
                    },
                    'WAVE|HELLO': () => {
                        tween(1400, k => { st.rocket.rotation.z += Math.sin(k * Math.PI * 4) * 0.02; });
                        gameMsg('The ship waggles a friendly hello.');
                    },
                    'LIGHTS|BEACON|STROBE': () => {
                        st.strobeOn = !st.strobeOn;
                        gameMsg(st.strobeOn ? 'Nav strobe blinking.' : 'Strobe off.');
                    },
                    'MUSIC|SONG': () => {
                        beeps([[523, 0.18, 0, 'triangle', 0.14], [659, 0.18, 200, 'triangle', 0.14],
                               [784, 0.18, 400, 'triangle', 0.14], [659, 0.18, 600, 'triangle', 0.14],
                               [880, 0.4, 800, 'triangle', 0.16]]);
                        gameMsg('Mission control hums a little space waltz.');
                    },
                    'ECLIPSE': () => {
                        tween(3200, k => { st.light.intensity = 1.6 - Math.sin(k * Math.PI) * 1.3; });
                        gameMsg('The planet slides across the sun — brief, beautiful dark.');
                    },
                    'AURORA': () => {
                        for (let i = 0; i < 24; i++) fwParticle(
                            new THREE.Vector3(-30 + i * 2.5, -14 + Math.sin(i * 0.5) * 3, -30),
                            new THREE.Vector3(0, 0.05, 0),
                            new THREE.Color().setHSL(0.35 + Math.random() * 0.15, 0.9, 0.55),
                            { gravity: -0.0002, decay: 0.008, size: 0.16 });
                        gameMsg('An aurora curtain ripples along the horizon.');
                    },
                    'ASTEROID|ROCK': () => {
                        const ast = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 0),
                            new THREE.MeshPhongMaterial({ color: 0x8a8378, flatShading: true }));
                        flyby(ast, new THREE.Vector3(65, -5, -25), new THREE.Vector3(-65, 12, -25), 6000, { spin: true });
                        gameMsg('A lumpy asteroid tumbles by, minding its business.');
                    },
                    'GALAXY|SPIRAL': () => {
                        for (let i = 0; i < 40; i++) {
                            const a = i * 0.5, r = 1 + i * 0.35;
                            fwParticle(new THREE.Vector3(30 + Math.cos(a) * r, 20 + Math.sin(a) * r * 0.5, -40),
                                new THREE.Vector3(-Math.sin(a) * 0.02, Math.cos(a) * 0.01, 0),
                                new THREE.Color().setHSL(0.65 + Math.random() * 0.1, 0.8, 0.7),
                                { gravity: 0, decay: 0.008, size: 0.1 });
                        }
                        gameMsg('A toy galaxy pinwheels into view.');
                    },
                    'DINO|DINOSAUR': () => {
                        const dino = new THREE.Group();
                        const dBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.7),
                            new THREE.MeshPhongMaterial({ color: 0x3f9b4f }));
                        dBody.position.y = 0.8; dino.add(dBody);
                        const dHead = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.5),
                            new THREE.MeshPhongMaterial({ color: 0x3f9b4f }));
                        dHead.position.set(0.9, 1.4, 0); dino.add(dHead);
                        const dTail = new THREE.Mesh(new THREE.ConeGeometry(0.25, 1.2, 5),
                            new THREE.MeshPhongMaterial({ color: 0x3f9b4f }));
                        dTail.rotation.z = Math.PI / 2; dTail.position.set(-1.2, 0.9, 0); dino.add(dTail);
                        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.45, 8, 6),
                            new THREE.MeshPhongMaterial({ color: 0xaaddff, transparent: true, opacity: 0.4 }));
                        helmet.position.set(0.9, 1.4, 0); dino.add(helmet);
                        const a0 = st.padTh + 1.1;
                        const from = CENTER.clone().addScaledVector(padDir(a0), MOON_R + 0.4);
                        const to = CENTER.clone().addScaledVector(padDir(a0 - 1.6), MOON_R + 0.4);
                        dino.scale.setScalar(0.8);
                        flyby(dino, from, to, 7000, { bob: true });
                        gameBeep(120, 0.6, 'sawtooth', 0.2);
                        gameMsg('A space dinosaur bounds across the regolith. Sure, why not.');
                    },
                    'SIGNAL|PING': () => {
                        for (let i = 0; i < 3; i++) setTimeout(() => {
                            const ringM = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.05, 6, 24),
                                new THREE.MeshBasicMaterial({ color: 0x66ffcc, transparent: true, opacity: 0.7 }));
                            ringM.position.copy(st.rocket.position);
                            scene.add(ringM);
                            tween(1200, k => { ringM.scale.setScalar(1 + k * 6); ringM.material.opacity = 0.7 * (1 - k); },
                                () => scene.remove(ringM));
                            gameBeep(1500 - i * 200, 0.12, 'sine', 0.08);
                        }, i * 300);
                        gameMsg('Ping… ping… mission control sends its love.');
                    }
                }),
                update: () => {
                    // Phase physics (angle + altitude around the moon)
                    if (st.phase === 'ascent') {
                        st.alt += 0.055 * timeScale;
                        flame(0.11);
                        if (st.alt >= 3 && !st.hint1) { st.hint1 = true; gameMsg('The spent booster is dragging us down… (something to SHED?)'); }
                        if (st.alt >= 7) { st.phase = 'coast'; gameMsg('Engine cutoff at altitude. Now make the path a circle…'); }
                    } else if (st.phase === 'coast') {
                        st.th += 0.0012 * st.dir * timeScale;
                        st.alt -= 0.006 * timeScale;
                        if (st.alt <= 2) { st.phase = 'ascent'; gameMsg('Falling back! Boosting to hold altitude…'); }
                    } else if (st.phase === 'orbit') {
                        const w = 0.011 * st.dir * timeScale;
                        st.th += w;
                        st.lap += Math.abs(w);
                        if (Math.random() < 0.4) fwParticle(st.rocket.position.clone(),
                            new THREE.Vector3(0, 0, 0), new THREE.Color(0x88ccff),
                            { gravity: 0, decay: 0.012, size: 0.07 });
                        if (st.lap >= Math.PI * 2 && !st.lapDone) {
                            st.lapDone = true;
                            gameMsg('FULL ORBIT COMPLETE! Now slow down and get back to the pad…', 6000);
                            gameBeep(880, 0.5, 'triangle', 0.2);
                        }
                    } else if (st.phase === 'deorbit') {
                        st.th += 0.006 * st.dir * timeScale;
                        st.alt += (2.5 - st.alt) * 0.01 * timeScale;
                        if (!st.hint2 && st.lapDone) { st.hint2 = true; }
                    } else if (st.phase === 'landing') {
                        st.th += angDiff(st.padTh, st.th) * 0.04 * timeScale;
                        st.alt = Math.max(0, st.alt - 0.045 * timeScale);
                        flame(0.08);
                        if (st.alt <= 0.01 && Math.abs(angDiff(st.th, st.padTh)) < 0.05) {
                            st.th = st.padTh; st.alt = 0; st.phase = 'landed';
                            puffBurst(st.rocket.position.clone(), 0xcccccc, 16, 1.2, { decay: 0.03 });
                            gameBeep(220, 0.5, 'sine', 0.2);
                            if (st.lapDone) gameWin('ONE SMALL LAP FOR ROCKETKIND');
                            else gameMsg('Down safe — but the moon was not circled. LAUNCH again!');
                        }
                    }

                    // Rocket transform: radial on/near the ground, tangent in orbit
                    st.rocket.position.copy(surfPos(st.th, st.alt));
                    const rad = radial();
                    const tan = new THREE.Vector3(-rad.y * st.dir, rad.x * st.dir, 0);
                    const upTarget = (st.phase === 'orbit' || st.phase === 'deorbit') ? tan : rad;
                    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), upTarget);
                    st.rocket.quaternion.slerp(q, 0.08 * timeScale);
                    if (st.strobeOn) st.strobe.material.color.setHex(
                        (Math.floor(Date.now() / 250) % 2) ? 0xff2222 : 0x330000);

                    // Fixed wide view of the whole moon + orbit
                    targetCameraPos.set(0, 4, 44);
                    targetCameraLookAt.copy(CENTER);

                    gameStatus(st.phase.toUpperCase() + ' · alt ' + st.alt.toFixed(1) +
                        ' · lap ' + Math.min(100, Math.round(st.lap / (Math.PI * 2) * 100)) + '%' +
                        ' · fuel ' + Math.round(st.fuel * 100) + '%' + (st.lapDone ? ' · ORBIT LOGGED' : ''));
                }
            });
            setObjective('MOON ROCKET',
                'Fly one full orbit around the moon, then land back on the pad. ' +
                'The ship answers to launch-day words — though something heavy may hold it back…');
        }

        // ==================================================================
        // ==== LEVEL 4: WATERWORKS (buckets, pipes, valves, leaks) =========
        // Route water from the tank through the valve into three buckets.
        // Fill all three to the line without overflowing — and patch any
        // joints that spring a leak along the way.
        // ==================================================================
        function createWaterworksScene() {
            currentScene = 'waterworks';
            scene.background = new THREE.Color(0xb8d4e0);
            scene.fog = new THREE.FogExp2(0xb8d4e0, 0.004);
            const F = -5.1;
            const st = {};

            // Yard: ground, back fence, one season-able tree
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300),
                new THREE.MeshPhongMaterial({ color: 0xa8b08e }));
            ground.rotation.x = -Math.PI / 2; ground.position.y = F; scene.add(ground);
            for (let i = -8; i <= 8; i++) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.6, 0.2),
                    new THREE.MeshPhongMaterial({ color: 0x9a7b52 }));
                post.position.set(i * 2.6, F + 1.3, -14);
                scene.add(post);
            }
            st.season = 1;
            makeGameTree(new THREE.Vector3(-14, F, -8), 0x2e8b57, st);
            makeGameTree(new THREE.Vector3(14, F, -9), 0x2e8b57, st);

            // Water tank on legs, main pipe, junction + valve wheel
            const pipeMat = new THREE.MeshStandardMaterial({ color: 0x51616e, metalness: 0.6, roughness: 0.4 });
            st.pipeMat = pipeMat;
            const tank = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 3, 14),
                new THREE.MeshStandardMaterial({ color: 0x6e8291, metalness: 0.5, roughness: 0.5 }));
            tank.position.set(0, 7.5, -6); scene.add(tank);
            st.tank = tank;
            [[-1.8, -1.2], [1.8, -1.2], [-1.8, 1.2], [1.8, 1.2]].forEach(lp => {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 11, 6), pipeMat);
                leg.position.set(lp[0], F + 5.55, -6 + lp[1]); scene.add(leg);
            });
            // ---- The pipe MAZE -------------------------------------------
            // TANK → main rotary valve (VALVE / LEFT / RIGHT) → two mains →
            // rotating ELBOWS that multiplex the stream: DOWN into an outer
            // bucket, or ACROSS the diagonal cross-pipes into the center one.
            const Z = -6;
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0xb03a2e, metalness: 0.4, roughness: 0.5 });
            function pipeBetween(ax, ay, bx, by, r) {
                const len = Math.hypot(bx - ax, by - ay);
                const p = new THREE.Mesh(new THREE.CylinderGeometry(r || 0.28, r || 0.28, len, 8), pipeMat);
                p.position.set((ax + bx) / 2, (ay + by) / 2, Z);
                p.rotation.z = -Math.atan2(bx - ax, by - ay);
                scene.add(p);
                return p;
            }
            // Tank stem + main valve housing with the BIG red wheel
            pipeBetween(0, 6.1, 0, 5.5, 0.32);
            const v1Box = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), pipeMat);
            v1Box.position.set(0, 5, Z); scene.add(v1Box);
            st.v1Box = v1Box;
            const mainWheel = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.11, 8, 18), wheelMat);
            mainWheel.position.set(0, 5, Z + 0.85); scene.add(mainWheel);
            [0, Math.PI / 2].forEach(a => {
                const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5, 6), wheelMat);
                spoke.rotation.z = a; spoke.position.set(0, 5, Z + 0.85);
                mainWheel.attach ? mainWheel.attach(spoke) : scene.add(spoke);
            });
            st.mainWheel = mainWheel;
            // Left/right mains
            pipeBetween(-0.65, 5, -7.35, 5, 0.26);
            pipeBetween(0.65, 5, 7.35, 5, 0.26);
            // Fixed cross-pipes (diagonals into the shared center drop)
            pipeBetween(-6.8, 4.3, -0.5, 3.55, 0.2);
            pipeBetween(6.8, 4.3, 0.5, 3.55, 0.2);
            pipeBetween(0, 3.5, 0, 2.1, 0.24);
            // Outer down-drops below the elbows
            pipeBetween(-8, 3.25, -8, 2.1, 0.24);
            pipeBetween(8, 3.25, 8, 2.1, 0.24);
            // Rotating elbows: a visible pipe ARM swings between DOWN and
            // ACROSS, each with its own little wheel.
            function makeElbow(x, crossSign) {
                const housing = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), pipeMat);
                housing.position.set(x, 5, Z); scene.add(housing);
                const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.08, 8, 14), wheelMat);
                wheel.position.set(x, 5, Z + 0.72); scene.add(wheel);
                const arm = new THREE.Group();
                const armPipe = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 1.7, 8), pipeMat);
                armPipe.position.y = -0.85; arm.add(armPipe);
                arm.position.set(x, 5, Z);
                scene.add(arm);
                return { arm, wheel, crossAngle: crossSign * 1.21, housing };
            }
            st.E1 = makeElbow(-8, 1);
            st.E2 = makeElbow(8, -1);

            // Three branch pipes ending in downspouts over the buckets
            st.buckets = [];
            st.spouts = [];
            const bucketX = [-8, 0, 8];
            bucketX.forEach((bx, i) => {
                const mouth = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.26, 0.35, 8), pipeMat);
                mouth.position.set(bx, 1.95, -6);
                scene.add(mouth);
                st.spouts.push(new THREE.Vector3(bx, 1.8, -6));

                const bucket = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.25, 2.6, 16, 1, true),
                    new THREE.MeshStandardMaterial({ color: 0x8d99a6, metalness: 0.7, roughness: 0.35, side: THREE.DoubleSide }));
                bucket.position.set(bx, F + 1.3, -6);
                scene.add(bucket);
                const bottom = new THREE.Mesh(new THREE.CircleGeometry(1.25, 16),
                    new THREE.MeshStandardMaterial({ color: 0x7d8994, side: THREE.DoubleSide }));
                bottom.rotation.x = -Math.PI / 2;
                bottom.position.set(bx, F + 0.02, -6);
                scene.add(bottom);
                const fillLine = new THREE.Mesh(new THREE.TorusGeometry(1.56, 0.045, 6, 24),
                    new THREE.MeshBasicMaterial({ color: 0xffffff }));
                fillLine.rotation.x = Math.PI / 2;
                fillLine.position.set(bx, F + 2.47, -6);
                scene.add(fillLine);
                const waterMat = new THREE.MeshPhongMaterial({ color: 0x3d9be9, transparent: true, opacity: 0.85, emissive: 0x000000 });
                const water = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.2, 1, 16), waterMat);
                water.position.set(bx, F + 0.05, -6);
                water.scale.y = 0.02;
                scene.add(water);
                st.buckets.push({ x: bx, water, waterMat, mesh: bucket });
            });
            st.leakJoints = [
                new THREE.Vector3(0, 5, -6),    // main valve
                new THREE.Vector3(-8, 5, -6),   // left elbow
                new THREE.Vector3(8, 5, -6)     // right elbow
            ];

            // Sim state: main valve (L/R) + two elbow multiplexers (down/cross)
            st.flowing = false; st.rate = 1;
            st.pressure = false; st.fills = [0, 0, 0];
            st.leak = -1; st.duck = null;
            st.main = 'L'; st.e1 = 'down'; st.e2 = 'down';
            // The route the water CURRENTLY takes: waypoints in the pipe plane
            // plus the bucket it will end in. Drops snapshot this when they
            // spawn, so in-flight water keeps flowing the old way after you
            // turn a valve — properly "flowy".
            function currentPath() {
                const pts = [[0, 6], [0, 5]];
                if (st.main === 'L') {
                    pts.push([-8, 5]);
                    if (st.e1 === 'down') { pts.push([-8, 1.9]); return { pts, bucket: 0 }; }
                    pts.push([-4, 3.7], [0, 3.5], [0, 1.9]); return { pts, bucket: 1 };
                }
                pts.push([8, 5]);
                if (st.e2 === 'down') { pts.push([8, 1.9]); return { pts, bucket: 2 }; }
                pts.push([4, 3.7], [0, 3.5], [0, 1.9]); return { pts, bucket: 1 };
            }
            const routeName = () =>
                'TANK→' + (st.main === 'L' ? 'LEFT' : 'RIGHT') + '→' +
                ((st.main === 'L' ? st.e1 : st.e2) === 'down' ? 'DOWN' : 'ACROSS') +
                '→' + ['L', 'M', 'R'][currentPath().bucket] + ' bucket';
            function clankBeep() {
                beeps([[420, 0.1, 0, 'square', 0.12], [380, 0.12, 120, 'square', 0.12]]);
            }
            function setMain(side) {
                st.main = side;
                tween(700, k => { st.mainWheel.rotation.z += 0.09; });
                clankBeep();
                gameMsg('The big wheel groans — main flow to the ' + (side === 'L' ? 'LEFT' : 'RIGHT') + '. Route: ' + routeName());
            }
            function toggleElbow(E, key) {
                st[key] = st[key] === 'down' ? 'cross' : 'down';
                const to = st[key] === 'down' ? 0 : E.crossAngle;
                const from = E.arm.rotation.z;
                tween(700, k => {
                    E.arm.rotation.z = from + (to - from) * k;
                    E.wheel.rotation.z += 0.12;
                });
                clankBeep();
                gameMsg('The elbow swings ' + (st[key] === 'down' ? 'DOWN' : 'ACROSS') + '. Route: ' + routeName());
            }
            // Path-following particle water (pooled droplet meshes)
            st.dropPool = [];
            st.spawnAcc = 0;
            const dropGeo = new THREE.SphereGeometry(0.1, 6, 5);
            const dropMat = new THREE.MeshBasicMaterial({ color: 0x59b7ff, transparent: true, opacity: 0.9 });
            function spawnDrop() {
                let d = st.dropPool.find(d2 => !d2.active);
                if (!d) {
                    if (st.dropPool.length >= 140) return;
                    d = { mesh: new THREE.Mesh(dropGeo, dropMat), active: false };
                    scene.add(d.mesh);
                    st.dropPool.push(d);
                }
                const route = currentPath();
                d.active = true; d.mesh.visible = true;
                d.pts = route.pts; d.bucket = route.bucket;
                d.seg = 0; d.t = 0; d.fall = false; d.vy = 0;
                d.x = route.pts[0][0] + (Math.random() - 0.5) * 0.18;
                d.y = route.pts[0][1];
            }
            function splash(bx, big) {
                puffBurst(new THREE.Vector3(bx, F + 2.6, -6), 0x66bbff, big ? 26 : 12, 1.6,
                    { gravity: 0.003, decay: 0.03, size: 0.08 });
                gameBeep(big ? 200 : 600, 0.3, 'sine', big ? 0.2 : 0.1);
            }

            setGameMode({
                name: 'WATERWORKS',
                words: expandWords({
                    // ---- state advancers -------------------------------------
                    'WATER|FLOW|POUR|OPEN': () => {
                        if (st.flowing) { gameMsg('The water already runs.'); return; }
                        st.flowing = true;
                        gameBeep(500, 0.4, 'sine', 0.12);
                        gameMsg('Water rushes into the maze! Route: ' + routeName());
                    },
                    'STOP|OFF|SHUT|CLOSE': () => {
                        st.flowing = false;
                        gameBeep(300, 0.3, 'sine', 0.1);
                        gameMsg('The flow gurgles to a stop.');
                    },
                    'VALVE|TURN': () => setMain(st.main === 'L' ? 'R' : 'L'),
                    'LEFT': () => setMain('L'),
                    'RIGHT': () => setMain('R'),
                    'ROTATE|ELBOW|SPIN': () => toggleElbow(st.E1, 'e1'),
                    'CRANK|WHEEL': () => toggleElbow(st.E2, 'e2'),
                    'MIDDLE|CENTER|CENTRE': () => {
                        gameMsg('No direct line feeds the middle bucket — an elbow must send water ACROSS.');
                    },
                    'PUMP|FAST|MORE': () => { st.rate = 2; gameMsg('Pump engaged — double flow!'); },
                    'SLOW|TRICKLE|GENTLE|LESS': () => { st.rate = 0.5; gameMsg('Down to a careful trickle.'); },
                    'NORMAL|STEADY': () => { st.rate = 1; st.pressure = false; gameMsg('Steady, ordinary flow.'); },
                    'PRESSURE|BLAST|SURGE': () => {
                        st.pressure = !st.pressure;
                        gameMsg(st.pressure ? 'PRESSURE OVERDRIVE — fast, but the old joints groan…' : 'Pressure released. The pipes sigh with relief.');
                        gameBeep(st.pressure ? 750 : 350, 0.3, 'square', 0.14);
                    },
                    'DRAIN|EMPTY|DUMP': () => {
                        const bi = currentPath().bucket;
                        st.fills[bi] = 0;
                        splash(st.buckets[bi].x, false);
                        gameMsg('The ' + ['LEFT', 'MIDDLE', 'RIGHT'][bi] + ' bucket (current route) drains out.');
                    },
                    'FIX|PATCH|WRENCH|REPAIR': () => {
                        if (st.leak < 0) { gameMsg('Nothing is leaking. The plumber nods, satisfied.'); return; }
                        puffBurst(st.leakJoints[st.leak], 0xffd166, 10, 0.5, { decay: 0.03 });
                        st.leak = -1;
                        beeps([[500, 0.08, 0, 'square', 0.15], [500, 0.08, 130, 'square', 0.15], [700, 0.15, 260, 'square', 0.15]]);
                        gameMsg('Clang, clang — the joint is patched tight!');
                    },
                    // ---- doodads ---------------------------------------------
                    'BUBBLE|BUBBLES': () => {
                        st.buckets.forEach(b => {
                            if (st.fills[st.buckets.indexOf(b)] > 0.1)
                                puffBurst(new THREE.Vector3(b.x, F + 0.5 + st.fills[st.buckets.indexOf(b)] * 2.4, -6),
                                    0xd7f0ff, 8, 0.8, { gravity: -0.001, decay: 0.02, size: 0.07 });
                        });
                        gameMsg('Blub blub blub.');
                    },
                    'SPLASH': () => { st.buckets.forEach(b => splash(b.x, false)); gameMsg('Splish splash!'); },
                    'DUCK': () => {
                        if (st.duck) { tween(800, k => st.duck.rotation.y = k * Math.PI * 2); gameMsg('The duck spins happily.'); return; }
                        let bi = 0; st.fills.forEach((f2, i) => { if (f2 > st.fills[bi]) bi = i; });
                        const duck = new THREE.Group();
                        const dBody = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6),
                            new THREE.MeshPhongMaterial({ color: 0xffd21e }));
                        duck.add(dBody);
                        const dHead = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6),
                            new THREE.MeshPhongMaterial({ color: 0xffd21e }));
                        dHead.position.set(0.3, 0.35, 0); duck.add(dHead);
                        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 6),
                            new THREE.MeshPhongMaterial({ color: 0xff8833 }));
                        beak.rotation.z = -Math.PI / 2; beak.position.set(0.55, 0.32, 0); duck.add(beak);
                        duck.position.set(st.buckets[bi].x, F + 3.6, -6);
                        scene.add(duck);
                        st.duck = duck; st.duckBucket = bi;
                        beeps([[900, 0.1, 0, 'square', 0.12], [700, 0.12, 140, 'square', 0.12]]);
                        gameMsg('A rubber duck plops into the fullest bucket!');
                    },
                    'FISH': () => {
                        const fish = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.7, 6),
                            new THREE.MeshPhongMaterial({ color: 0xff8844 }));
                        fish.rotation.z = Math.PI / 2;
                        const a = st.buckets[0], b = st.buckets[2];
                        flyby(fish, new THREE.Vector3(a.x, F + 2.4, -6), new THREE.Vector3(b.x, F + 2.4, -6), 1400, { arc: 3 });
                        splash(a.x, false); setTimeout(() => splash(b.x, false), 1300);
                        gameMsg('A fish?! It arcs from bucket to bucket.');
                    },
                    'STEAM': () => {
                        st.buckets.forEach(b => puffBurst(new THREE.Vector3(b.x, F + 2.8, -6),
                            0xffffff, 6, 0.8, { gravity: -0.0009, decay: 0.012, size: 0.09 }));
                        gameMsg('The water steams gently. Bath temperature.');
                    },
                    'ICE|FREEZE|COLD': () => {
                        st.buckets.forEach(b => b.waterMat.color.setHex(0xa8e0f5));
                        gameMsg('Brrr — the water turns glacier blue.');
                    },
                    'WARM|HOT': () => {
                        st.buckets.forEach(b => b.waterMat.color.setHex(0x3d9be9));
                        gameMsg('The water warms back to friendly blue.');
                    },
                    'GLOW|NEON': () => {
                        st.buckets.forEach(b => b.waterMat.emissive.setHex(
                            b.waterMat.emissive.getHex() ? 0x000000 : 0x1a86d4));
                        gameMsg('The water glows like something from a lagoon.');
                    },
                    'RAIN': () => { setWeather('rain'); skyTo(0x8fa8b8, 0x8fa8b8); gameMsg('Rain — free water, wrong buckets.'); },
                    'SNOW': () => { setWeather('snow'); skyTo(0xe4ecf2, 0xe4ecf2); gameMsg('Snowflakes settle on the pipes.'); },
                    'SUN|CLEAR': () => { setWeather(null); skyTo(0xb8d4e0, 0xb8d4e0); gameMsg('Sunshine glitters on the water.'); },
                    'NIGHT': () => { skyTo(0x1c2636, 0x1c2636); gameMsg('Night shift at the waterworks.'); },
                    'DAY': () => { skyTo(0xb8d4e0, 0xb8d4e0); gameMsg('Morning at the waterworks.'); },
                    'RUST|OLD': () => { st.pipeMat.color.setHex(0x8a5a3a); gameMsg('The pipes look suddenly… antique.'); },
                    'PAINT|NEW': () => {
                        st.pipeMat.color.setHSL(Math.random(), 0.6, 0.5);
                        gameMsg('Fresh coat of paint! Regulation? Unclear.');
                    },
                    'WAVE|SLOSH': () => {
                        st.buckets.forEach((b, i) => tween(1200, k =>
                            b.water.rotation.z = Math.sin(k * Math.PI * 4 + i) * 0.15 * (1 - k)));
                        gameMsg('The buckets slosh side to side.');
                    },
                    'FROG': () => {

                        flyby(frog, new THREE.Vector3(-11, F + 2.6, -6), new THREE.Vector3(11, F + 2.6, -6), 2600, { bob: true });
                        beeps([[300, 0.12, 0, 'sawtooth', 0.12], [260, 0.15, 400, 'sawtooth', 0.12], [300, 0.12, 900, 'sawtooth', 0.12]]);
                        gameMsg('Ribbit. A frog hops the bucket rims like stepping stones.');
                    },
                    'SOAP|FOAM': () => {
                        puffBurst(st.tank.position.clone().add(new THREE.Vector3(0, 1.8, 0)),

                    },
                    'TAP|DRIP': () => {
                        beeps([[1400, 0.05, 0, 'sine', 0.12], [1400, 0.05, 500, 'sine', 0.12], [1400, 0.05, 1000, 'sine', 0.12]]);
                        for (let i = 0; i < 3; i++) setTimeout(() =>
                            fwParticle(st.spouts[currentPath().bucket].clone(), new THREE.Vector3(0, -0.1, 0),
                                new THREE.Color(0x66bbff), { gravity: 0.004, decay: 0.04, size: 0.07 }), i * 500);
                        gameMsg('Drip… drip… drip. The most patient sound in plumbing.');
                    },
                    'PLUMBER': () => {
                        const wrench = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.2, 0.3),
                            new THREE.MeshStandardMaterial({ color: 0xc0c8d4, metalness: 0.8, roughness: 0.3 }));
                        wrench.position.set(0, 3.2, -5.2);
                        scene.add(wrench);
                        tween(1800, k => { wrench.rotation.z = k * Math.PI * 4; wrench.position.y = 3.2 + Math.sin(k * Math.PI) * 1; },
                            () => scene.remove(wrench));
                        gameMsg('The plumber twirls a wrench in salute.');
                    },
                    'PIPE|PIPES|CLANK': () => {
                        tween(900, k => { st.v1Box.position.x = Math.sin(k * Math.PI * 6) * 0.08 * (1 - k); });
                        beeps([[220, 0.1, 0, 'square', 0.15], [180, 0.12, 150, 'square', 0.15]]);
                        gameMsg('CLANK. The pipes rattle ominously, then settle.');

                    'TANK': () => {

                        gameBeep(90, 0.6, 'sine', 0.18);
                        gameMsg('The big tank sloshes like a drum.');
                    },
                    'WHIRLPOOL|VORTEX': () => {
                        let bi = 0; st.fills.forEach((f2, i) => { if (f2 > st.fills[bi]) bi = i; });
                        const bx = st.buckets[bi].x;
                        for (let i = 0; i < 20; i++) {
                            const a = i * 0.7;
                            fwParticle(new THREE.Vector3(bx + Math.cos(a) * 0.9, F + 0.6 + st.fills[bi] * 2 , -6 + Math.sin(a) * 0.9),
                                new THREE.Vector3(-Math.sin(a) * 0.06, 0, Math.cos(a) * 0.06),

                        }
                        gameMsg('A tiny whirlpool spins up. Mesmerizing.');
                    },
                    'RAINBOW|MIST': () => {
                        const rb = new THREE.Mesh(new THREE.TorusGeometry(9, 0.35, 8, 40, Math.PI),
                            new THREE.MeshBasicMaterial({ color: 0xffaad4, transparent: true, opacity: 0.45 }));
                        rb.position.set(0, F + 1, -8);
                        scene.add(rb);
                        tween(7000, k => rb.material.opacity = 0.45 * Math.sin(k * Math.PI), () => scene.remove(rb));
                        gameMsg('Mist catches the light — a little rainbow arcs the rig.');
                    },
                    'GURGLE': () => {
                        beeps([[160, 0.1, 0, 'sine', 0.15], [200, 0.1, 100, 'sine', 0.15],
                               [140, 0.1, 220, 'sine', 0.15], [240, 0.15, 340, 'sine', 0.15]]);
                        puffBurst(new THREE.Vector3(0, 4.4, -6), 0xd7f0ff, 6, 0.4, { gravity: -0.001, decay: 0.03, size: 0.06 });
                        gameMsg('The pipes gurgle a little tune.');
                    },
                    'FOUNTAIN': () => {
                        for (let i = 0; i < 24; i++) fwParticle(
                            new THREE.Vector3(0, 5.8, -6),
                            new THREE.Vector3((Math.random() - 0.5) * 0.08, 0.22 + Math.random() * 0.08, (Math.random() - 0.5) * 0.08),
                            new THREE.Color(0x66bbff), { gravity: 0.004, decay: 0.02, size: 0.08 });
                        gameBeep(700, 0.4, 'sine', 0.1);
                        gameMsg('The junction burps a proud little fountain.');
                    },
                    'BIRD': () => {
                        birdsAcross(6);
                        gameMsg('A bird settles on the tank, supervising.');
                    },
                    'TREE|TREES': () => cycleSeason(st)
                }),
                update: () => {
                    // ---- Particle water: each drop follows its own snapshot
                    // of the pipe route, then free-falls into a bucket. Fill
                    // level rises because water ARRIVES, not by abstract rate.
                    if (st.flowing) {
                        st.spawnAcc += (st.rate === 2 ? 2.0 : st.rate === 0.5 ? 0.55 : 1.1) *
                            (st.pressure ? 1.8 : 1) * timeScale;
                        while (st.spawnAcc >= 1) { st.spawnAcc -= 1; spawnDrop(); }
                        // Random leaks; pressure overdrive makes them 3x likelier
                        if (st.leak < 0 && Math.random() < (st.pressure ? 0.0035 : 0.0011) * timeScale) {
                            st.leak = Math.floor(Math.random() * st.leakJoints.length);
                            gameMsg('SSSSST — a joint sprang a LEAK! Water is spraying away…', 6000);
                            gameBeep(1800, 0.6, 'sawtooth', 0.08);
                        }
                    }
                    const dropSpd = 0.16 * (st.pressure ? 1.7 : 1) *
                        (st.rate === 2 ? 1.3 : st.rate === 0.5 ? 0.8 : 1);
                    st.dropPool.forEach(d => {
                        if (!d.active) return;
                        if (!d.fall) {
                            let remaining = dropSpd * timeScale;
                            while (remaining > 0 && d.seg < d.pts.length - 1) {
                                const a = d.pts[d.seg], b = d.pts[d.seg + 1];
                                const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
                                const dist = d.t * segLen + remaining;
                                if (dist >= segLen) { remaining = dist - segLen; d.seg++; d.t = 0; }
                                else { d.t = dist / segLen; remaining = 0; }
                            }
                            if (d.seg >= d.pts.length - 1) {
                                const last = d.pts[d.pts.length - 1];
                                d.x = last[0]; d.y = last[1];
                                d.fall = true; d.vy = 0.02;
                            } else {
                                const a = d.pts[d.seg], b = d.pts[d.seg + 1];
                                d.x = a[0] + (b[0] - a[0]) * d.t;
                                d.y = a[1] + (b[1] - a[1]) * d.t;
                            }
                            // Drops passing a leaking joint may spray out of the maze
                            if (st.leak >= 0) {
                                const lj = st.leakJoints[st.leak];
                                if (Math.hypot(d.x - lj.x, d.y - lj.y) < 0.45 && Math.random() < 0.5) {
                                    d.active = false; d.mesh.visible = false;
                                    fwParticle(new THREE.Vector3(d.x, d.y, -5.9),
                                        new THREE.Vector3((Math.random() - 0.2) * 0.2, 0.12, 0.04),
                                        new THREE.Color(0x88ccff), { gravity: 0.004, decay: 0.05, size: 0.07 });
                                }
                            }
                        } else {
                            d.vy += 0.012 * timeScale;
                            d.y -= d.vy * timeScale;
                            d.x += (Math.random() - 0.5) * 0.03;
                            const surfaceY = F + 0.15 + st.fills[d.bucket] * 2.3;
                            if (d.y <= surfaceY) {
                                d.active = false; d.mesh.visible = false;
                                st.fills[d.bucket] = Math.min(1.16, st.fills[d.bucket] + 0.0018);
                                if (Math.random() < 0.15) puffBurst(
                                    new THREE.Vector3(d.x, surfaceY, -6), 0x9fd4ff, 2, 0.3,
                                    { gravity: 0.002, decay: 0.06, size: 0.05 });
                            }
                        }
                        d.mesh.position.set(d.x, d.y, -5.94);
                    });

                    // Water columns + overflow + duck bobbing
                    st.buckets.forEach((b, i) => {
                        const f2 = st.fills[i];
                        b.water.scale.y = Math.max(0.02, f2 * 2.3);
                        b.water.position.y = F + 0.05 + (f2 * 2.3) / 2;
                        if (f2 >= 1.15) {
                            st.fills[i] = 0;
                            splash(b.x, true);
                            gameMsg('OVERFLOW! The ' + ['LEFT', 'MIDDLE', 'RIGHT'][i] + ' bucket tips and drains. Watch the line!', 5500);
                            beeps([[400, 0.3, 0, 'sawtooth', 0.2], [200, 0.5, 250, 'sawtooth', 0.2]]);
                        }
                    });
                    if (st.duck) {
                        const bi = st.duckBucket;
                        const targetY = F + 0.3 + st.fills[bi] * 2.3;
                        st.duck.position.y += (targetY - st.duck.position.y) * 0.08 * timeScale;
                        st.duck.rotation.z = Math.sin(Date.now() * 0.003) * 0.15;
                    }

                    // Win: all three buckets at the line (0.95 .. 1.15)
                    if (st.fills.every(f2 => f2 >= 0.95)) {
                        st.flowing = false;
                        gameWin('MASTER PLUMBER');
                    }

                    targetCameraPos.set(0, 5.5, 25);
                    targetCameraLookAt.set(0, 2.2, -6);

                    gameStatus('L ' + Math.round(st.fills[0] * 100) + '% · M ' + Math.round(st.fills[1] * 100) +
                        '% · R ' + Math.round(st.fills[2] * 100) + '% · ' + routeName() +
                        ' · flow ' + (st.flowing ? 'ON' : 'off') + (st.pressure ? ' · OVERDRIVE' : '') +
                        (st.leak >= 0 ? ' · LEAKING!' : ''));
                }
            });
            setObjective('WATERWORKS',
                'Fill all three buckets to the white line — overflow drains a bucket to zero. ' +
                'One big VALVE picks a main; each side has a rotating ELBOW that sends water ' +
                'down or across the maze. Old joints sometimes give out…');
        }

        // ==================================================================
        // ==== LEVEL 5: TOWER BUILD (crane + physics blocks + welding) =====
        // Load blocks onto the crane hook, aim with LEFT/RIGHT, drop them
        // onto the pad, and WELD settled ones solid until the stack reaches
        // the red GOAL beam. Real physics: sloppy stacks topple.
        // ==================================================================
        function createTowerBuildScene() {
            currentScene = 'tower_build';
            scene.background = new THREE.Color(0xc9ddea);
            scene.fog = new THREE.FogExp2(0xc9ddea, 0.005);
            const F = -5.1;
            const st = {};
            const SITE = new THREE.Vector3(0, F, -2);

            // Ground + physics floor
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300),
                new THREE.MeshPhongMaterial({ color: 0xb59a6f }));
            ground.rotation.x = -Math.PI / 2; ground.position.y = F; scene.add(ground);
            const dirt = new THREE.Mesh(new THREE.CircleGeometry(9, 24),
                new THREE.MeshPhongMaterial({ color: 0x9c7a4d }));
            dirt.rotation.x = -Math.PI / 2; dirt.position.set(0, F + 0.02, -2); scene.add(dirt);
            const floorBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            floorBody.addShape(new CANNON.Box(new CANNON.Vec3(60, 1, 60)));
            floorBody.position.set(0, F - 1, 0);
            world.addBody(floorBody);
            colliderBodies.push(floorBody);
            // Concrete pad to build on
            const pad = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.4, 4.2),
                new THREE.MeshPhongMaterial({ color: 0x8d8d8d }));
            pad.position.set(SITE.x, F + 0.2, SITE.z); scene.add(pad);
            const padBody = new CANNON.Body({ mass: 0, material: physicsMaterial });
            padBody.addShape(new CANNON.Box(new CANNON.Vec3(2.1, 0.2, 2.1)));
            padBody.position.set(SITE.x, F + 0.2, SITE.z);
            world.addBody(padBody);
            colliderBodies.push(padBody);

            // Crane: mast, jib, counterweight, cab, trolley + cable + hook
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xe8b428, metalness: 0.4, roughness: 0.5 });
            const mast = new THREE.Mesh(new THREE.BoxGeometry(0.9, 14, 0.9), steelMat);
            mast.position.set(8.5, F + 7, -2); scene.add(mast);
            const jib = new THREE.Mesh(new THREE.BoxGeometry(15, 0.6, 0.7), steelMat);
            jib.position.set(2.5, F + 13.6, -2); scene.add(jib);
            const counter = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 1.4),
                new THREE.MeshStandardMaterial({ color: 0x666666 }));
            counter.position.set(10.6, F + 13.2, -2); scene.add(counter);
            const cab = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4),
                new THREE.MeshPhongMaterial({ color: 0x3a4b5c }));
            cab.position.set(8.5, F + 12.4, -1.2); scene.add(cab);
            st.cab = cab;
            const trolley = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.9),
                new THREE.MeshStandardMaterial({ color: 0x444444 }));
            scene.add(trolley); st.trolley = trolley;
            const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 6),
                new THREE.MeshBasicMaterial({ color: 0x222222 }));
            scene.add(cable); st.cable = cable;
            const hook = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.MeshStandardMaterial({ color: 0xb03a2e, metalness: 0.5, roughness: 0.4 }));
            scene.add(hook); st.hook = hook;
            // Preview block that hangs on the hook once LOADed
            const previewMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.8 });
            const preview = new THREE.Mesh(new THREE.BoxGeometry(2.0, 1.3, 2.0), previewMat);
            preview.visible = false;
            scene.add(preview); st.preview = preview;

            // Goal beam + label
            st.goalY = F + 6.6;
            const goal = new THREE.Mesh(new THREE.BoxGeometry(7, 0.18, 4.6),
                new THREE.MeshBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.45 }));
            goal.position.set(SITE.x, st.goalY, SITE.z); scene.add(goal);
            st.goalMesh = goal;
            const goalLabel = makeTextLabel('GOAL', 0.7, 0xff3333);
            goalLabel.position.set(SITE.x - 4.9, st.goalY + 0.2, SITE.z); scene.add(goalLabel);

            // Site dressing: fence, cones, mixer, workers, tree, flag, lights, banner
            for (let i = -5; i <= 5; i++) {
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.6, 0.15),
                    new THREE.MeshPhongMaterial({ color: 0x777777 }));
                post.position.set(i * 2.4, F + 0.8, 6);
                scene.add(post);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.12, 0.08),
                    new THREE.MeshPhongMaterial({ color: 0xd06428 }));
                bar.position.set(i * 2.4 + 1.2, F + 1.3, 6);
                scene.add(bar);
            }
            st.cones = [];
            [[-5, 2.5], [5, 2.5], [-6, -6], [6, -6]].forEach(cp => {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1, 10),
                    new THREE.MeshPhongMaterial({ color: 0xff6a1a }));
                cone.position.set(cp[0], F + 0.5, cp[1]);
                scene.add(cone); st.cones.push(cone);
            });
            const mixer = new THREE.Group();
            const mixBase = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1.2),
                new THREE.MeshPhongMaterial({ color: 0x556677 }));
            mixBase.position.y = 0.4; mixer.add(mixBase);
            const drumGeo = new THREE.CylinderGeometry(0.7, 0.5, 1.6, 10);
            const drum = new THREE.Mesh(drumGeo, new THREE.MeshPhongMaterial({ color: 0xdddddd }));
            drum.rotation.z = 0.6; drum.position.y = 1.4; mixer.add(drum);
            mixer.position.set(-7.5, F, 0);
            scene.add(mixer); st.drum = drum;
            st.workers = [];
            [[-4, 3.5, 0xf2b01e], [4.5, 3.8, 0x3a7bd5], [-2, -5.5, 0x4caf50]].forEach(wp => {
                const w = makeBoxMan(wp[2], 0xf2d21e);
                w.scale.setScalar(0.75);
                w.position.set(wp[0], F, wp[1]);
                scene.add(w); st.workers.push(w);
            });
            st.season = 1;
            makeGameTree(new THREE.Vector3(-10, F, 4), 0x2e8b57, st);
            const flagPole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 6),
                new THREE.MeshPhongMaterial({ color: 0xcccccc }));
            flagPole.position.set(8.5, F + 15.2, -2); scene.add(flagPole);
            st.flag = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7),
                new THREE.MeshBasicMaterial({ color: 0xd42a2a, side: THREE.DoubleSide }));
            st.flag.position.set(9.2, F + 14.4, -2);
            st.flag.scale.setScalar(0.001);
            scene.add(st.flag);
            st.floods = [];
            [[-8, 5], [8, 5]].forEach(fp => {
                const lp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6),
                    new THREE.MeshPhongMaterial({ color: 0x555555 }));
                lp.position.set(fp[0], F + 2.5, fp[1]); scene.add(lp);
                const lampMat = new THREE.MeshPhongMaterial({ color: 0xf5f0d0, emissive: 0x000000 });
                const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.4), lampMat);
                lamp.position.set(fp[0], F + 5.1, fp[1]); scene.add(lamp);
                st.floods.push(lampMat);
            });
            st.banner = new THREE.Group();
            const bannerPlane = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.2),
                new THREE.MeshBasicMaterial({ color: 0xffe14c, side: THREE.DoubleSide }));
            st.banner.add(bannerPlane);
            const bannerText = makeTextLabel('SAFETY FIRST', 0.5, 0x222222);
            bannerText.position.set(0, -0.25, 0.02);
            st.banner.add(bannerText);
            st.banner.position.set(0, F + 3.4, 5.9);
            st.banner.scale.setScalar(0.001);
            scene.add(st.banner);
            st.bannerUp = false;

            // Sim state
            st.loaded = null; st.hookX = 0; st.hookY = F + 10.5;
            st.blocks = []; st.magnet = false; st.scaffT = 0; st.scaffMeshes = [];
            st.cemented = false; st.dropCount = 0;
            const BLOCK_TYPES = {
                CONCRETE: { color: 0x9e9e9e, mass: 2.0, w: 2.0, h: 1.3 },
                BRICK: { color: 0xb5533c, mass: 1.6, w: 2.0, h: 1.3 },
                STEEL: { color: 0x7d8da1, mass: 3.2, w: 1.7, h: 1.3 }
            };
            function loadBlock(type) {
                if (st.loaded) { gameMsg('The hook already carries a ' + st.loaded.toLowerCase() + ' block. DROP it first.'); return; }
                st.loaded = type;
                const def = BLOCK_TYPES[type];
                st.preview.visible = true;
                st.preview.material.color.setHex(def.color);
                st.preview.scale.set(def.w / 2.0, 1, def.w / 2.0);
                gameBeep(340, 0.2, 'square', 0.12);
                gameMsg(type + ' block on the hook. Aim with LEFT/RIGHT, then DROP.');
            }
            function settledUnwelded() {
                return st.blocks.filter(b => !b.welded &&
                    b.body.velocity.length() < 0.6 && Math.abs(b.body.position.x) < 4 &&
                    Math.abs(b.body.position.z - SITE.z) < 4);
            }

            setGameMode({
                name: 'TOWER BUILD',
                words: expandWords({
                    // ---- state advancers -------------------------------------
                    'LOAD|BLOCK|CONCRETE': () => loadBlock('CONCRETE'),
                    'BRICK|BRICKS': () => loadBlock('BRICK'),
                    'STEEL|GIRDER': () => loadBlock('STEEL'),
                    'DROP|PLACE|RELEASE': () => {
                        if (!st.loaded) { gameMsg('Nothing on the hook. LOAD a block (or ask for BRICK / STEEL).'); return; }
                        const def = BLOCK_TYPES[st.loaded];
                        st.loaded = null; st.preview.visible = false; st.dropCount++;
                        const geo = new THREE.BoxGeometry(def.w, def.h, def.w);
                        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
                            color: def.color, roughness: 0.75, metalness: def.mass > 3 ? 0.5 : 0.1 }));
                        mesh.castShadow = true; mesh.receiveShadow = true;
                        const px = st.hookX + (Math.random() - 0.5) * 0.15;
                        mesh.position.set(px, st.hookY - 1.2, SITE.z);
                        scene.add(mesh);
                        const body = new CANNON.Body({ mass: def.mass, material: physicsMaterial });
                        body.addShape(new CANNON.Box(new CANNON.Vec3(def.w / 2, def.h / 2, def.w / 2)));
                        body.position.set(px, st.hookY - 1.2, SITE.z);
                        world.addBody(body);
                        const rec = { mesh, body, type: 'gameBlock', welded: false, half: def.h / 2 };
                        physicsBodies.push(rec);
                        st.blocks.push(rec);
                        gameBeep(180, 0.25, 'square', 0.12);
                        gameMsg('Block away!');
                    },
                    'WELD|FUSE|FIX': () => {
                        const cands = settledUnwelded();
                        if (!cands.length) { gameMsg('Nothing settled to weld — wait for a block to stop wobbling.'); return; }
                        cands.sort((a, b) => a.body.position.y - b.body.position.y);
                        const b = cands[0];
                        b.welded = true;
                        b.body.mass = 0;
                        b.body.updateMassProperties();
                        b.body.velocity.set(0, 0, 0);
                        b.body.angularVelocity.set(0, 0, 0);
                        b.mesh.material.emissive = b.mesh.material.emissive || new THREE.Color(0);
                        b.mesh.material.emissive.setHex(0x331a00);

                    'SPARK|SPARKS|GRIND': () => {

                    },
                    'PAINT': () => {

                    'FLAG': () => {

                        tween(1400, k => st.flag.scale.setScalar(Math.max(0.001, k)));

                    },
                    'LIGHTS|FLOODLIGHT': () => {
                        const on = st.floods[0].emissive.getHex() === 0;
                        st.floods.forEach(l => l.emissive.setHex(on ? 0xfff2b0 : 0x000000));
                        gameMsg(on ? 'Floodlights ON — night shift ready.' : 'Floodlights off.');

                    'NIGHT': () => { skyTo(0x1a2233, 0x1a2233); gameMsg('Dusk settles over the site.'); },
                    'DAY|SUN': () => { skyTo(0xc9ddea, 0xc9ddea); gameMsg('Morning shift. Coffee first.'); },
                    'RAIN': () => { setWeather('rain'); skyTo(0x8a99a8, 0x8a99a8); gameMsg('Rain — the site turns to mud.'); },
                    'SNOW': () => { setWeather('snow'); skyTo(0xe4ecf2, 0xe4ecf2); gameMsg('Snow dusts the girders.'); },
                    'CLEAR': () => { setWeather(null); skyTo(0xc9ddea, 0xc9ddea); gameMsg('Skies clear over the site.'); },
                    'WIND': () => {
                        tween(2200, k => { st.cable.rotation.z = Math.sin(k * Math.PI * 5) * 0.08 * (1 - k); });
                        puffBurst(new THREE.Vector3(0, F + 0.5, 0), 0xc9b083, 14, 6, { gravity: 0.0005, decay: 0.02, size: 0.07 });

                    'MUD|PUDDLE': () => {

                        gameMsg('SPLAT. Someone finds the deep puddle.');
                    },
                    'CONE|CONES': () => {
                        st.cones.forEach((c, i) => tween(700 + i * 180, k =>
                            c.position.y = F + 0.5 + Math.abs(Math.sin(k * Math.PI * 2)) * 0.8 * (1 - k)));

                    },
                    'TRUCK': () => {
                        const truck = new THREE.Group();
                        const cabT = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.6),

                        [[-1.4], [0.2], [1.6]].forEach(wx => {
                            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 10),

                            wheel.position.set(wx[0], 0.4, 0.8); truck.add(wheel);
                        });
                        flyby(truck, new THREE.Vector3(-16, F, 7.5), new THREE.Vector3(16, F, 7.5), 4200);
                        gameBeep(80, 1.6, 'sawtooth', 0.15);
                        gameMsg('A dump truck rumbles past the fence.');
                    },
                    'MIXER|DRUM': () => {
                        tween(2000, k => st.drum.rotation.y = k * Math.PI * 10);
                        puffBurst(mixer.position.clone().add(new THREE.Vector3(0, 2, 0)),
                            0xcccccc, 8, 0.8, { decay: 0.02, size: 0.07 });
                        gameMsg('The mixer drum spins up with a gravelly churn.');
                    },
                    'JACKHAMMER': () => {
                        beeps(Array.from({ length: 8 }, (_, i) => [110, 0.05, i * 90, 'square', 0.18]));
                        tween(800, k => { targetCameraPos.y += (Math.random() - 0.5) * 0.3; });
                        gameMsg('BRRRRRT. The whole street feels that one.');
                    },
                    'SIREN': () => {
                        beeps([[600, 0.5, 0, 'sine', 0.2], [450, 0.5, 500, 'sine', 0.2], [600, 0.5, 1000, 'sine', 0.2]]);
                        gameMsg('End-of-day siren. Tools down… except yours.');
                    },
                    'STARS|STAR': () => {
                        for (let i = 0; i < 14; i++) fwParticle(
                            new THREE.Vector3((Math.random() - 0.5) * 40, 12 + Math.random() * 8, -10 - Math.random() * 8),
                            new THREE.Vector3(0, 0, 0), new THREE.Color(0xffffff), { gravity: 0, decay: 0.01, size: 0.1 });
                        gameMsg('Stars over the scaffolding.');
                    },
                    'TREE|TREES': () => cycleSeason(st),
                    'BANNER|SAFETY': () => {
                        st.bannerUp = !st.bannerUp;
                        const from = st.bannerUp ? 0.001 : 1, to = st.bannerUp ? 1 : 0.001;
                        tween(1200, k => st.banner.scale.setScalar(from + (to - from) * k));
                        gameMsg(st.bannerUp ? 'A "SAFETY FIRST" banner unfurls on the fence.' : 'Banner rolled away.');
                    },
                    'CAT': () => {
                        const cat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.25),
                            new THREE.MeshPhongMaterial({ color: 0xd9d9d9 }));
                        flyby(cat, new THREE.Vector3(10, F + 13.9, -2), new THREE.Vector3(-4, F + 13.9, -2), 6000, { bob: true });
                        gameMsg('A cat strolls the jib like it owns the crane.');
                    },
                    'ECHO|HAMMER': () => {
                        beeps([[700, 0.1, 0, 'square', 0.2], [700, 0.08, 350, 'square', 0.1], [700, 0.06, 700, 'square', 0.05]]);
                        gameMsg('Tink… tink… tink — a hammer echoes off the hills.');
                    }
                }),
                update: () => {
                    // Hook rig follows the trolley target
                    st.trolley.position.set(st.hookX, F + 13.25, SITE.z);
                    const cableLen = (F + 13.05) - st.hookY;
                    st.cable.scale.y = Math.max(0.1, cableLen);
                    st.cable.position.set(st.hookX, st.hookY + cableLen / 2, SITE.z);
                    st.hook.position.set(st.hookX, st.hookY, SITE.z);
                    if (st.preview.visible) st.preview.position.set(st.hookX, st.hookY - 1.0, SITE.z);

                    // Magnet assist pulls falling blocks toward the trolley line
                    if (st.magnet) st.blocks.forEach(b => {
                        if (!b.welded && b.body.velocity.y < -0.5)
                            b.body.velocity.x += (st.hookX - b.body.position.x) * 0.004 * timeScale;
                    });

                    // Scaffold expiry
                    if (st.scaffT > 0) {
                        st.scaffT -= timeScale;
                        if (st.scaffT <= 0) {
                            st.scaffMeshes.forEach(s => { scene.remove(s.mesh); world.removeBody(s.body); });
                            st.scaffMeshes = [];
                            gameMsg('The scaffold comes down — hope the welds hold!');
                        }
                    }

                    // Tumbled-block detection
                    st.blocks.forEach(b => {
                        if (!b.welded && !b.tumbled && b.body.position.y < F + 1 &&
                            (Math.abs(b.body.position.x) > 4.5 || Math.abs(b.body.position.z - SITE.z) > 4.5)) {
                            b.tumbled = true;
                            gameMsg('A block tumbled off the pad. LOAD another (or CLEAR the mess).');
                        }
                    });

                    // Win: a WELDED block's top reaches the goal beam
                    let best = F;
                    st.blocks.forEach(b => { if (b.welded) best = Math.max(best, b.body.position.y + b.half); });
                    st.goalMesh.material.opacity = 0.35 + Math.sin(Date.now() * 0.004) * 0.15;
                    if (best >= st.goalY - 0.05) gameWin('TOWER TOPPED OUT');

                    targetCameraPos.set(9, F + 12, 17);
                    targetCameraLookAt.set(0, F + 4, SITE.z);

                    gameStatus('welded height ' + Math.max(0, best - F).toFixed(1) + ' / ' + (st.goalY - F).toFixed(1) +
                        ' · hook x ' + st.hookX.toFixed(1) +
                        ' · ' + (st.loaded ? st.loaded + ' loaded' : 'hook empty') +
                        (st.magnet ? ' · MAGNET' : '') + (st.cemented ? ' · slab' : ''));
                }
            });
            setObjective('TOWER BUILD',
                'Stack and weld blocks until the tower reaches the red GOAL beam. ' +
                'The crane crew answers to plain site words. Unwelded stacks topple — physics is the foreman here.');
        }

        function createLaunchers() {
            launchers.forEach(l => scene.remove(l));
            launchers = [];
            const launcherGeo = new THREE.CylinderGeometry(0.5, 0.7, 1.5, 16);
            const launcherMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
            
            const positions = [
                new THREE.Vector3(-10, 10, 0),
                new THREE.Vector3(10, 10, 0),
                new THREE.Vector3(0, 12, -5)
            ];

            positions.forEach(pos => {
                const launcher = new THREE.Mesh(launcherGeo, launcherMat);
                launcher.position.copy(pos);
                launcher.rotation.x = Math.PI; // Point down
                scene.add(launcher);
                launchers.push(launcher);
            });
        }

        function createScenesMenu() {
            inScenesMenu = true;
            menuMeshes.forEach(m => scene.remove(m));
            menuMeshes = [];
            scenesMenuMeshes = [];
            tvMeshes = [];
            tvGrid = [];

            // Background Architect Scene: TV wall
            const deskGeo = new THREE.BoxGeometry(10, 0.5, 4);
            const deskMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            desk.position.set(0, -2, 5);
            scene.add(desk);
            scenesMenuMeshes.push(desk);

            const chairGeo = new THREE.BoxGeometry(2, 4, 2);
            const chairMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const chair = new THREE.Mesh(chairGeo, chairMat);
            chair.position.set(0, -1, 8);
            scene.add(chair);
            scenesMenuMeshes.push(chair);

            // Two labeled shelves, no empty screens: WORD QUEST game levels on
            // top (gold, bigger, tagged), classic sandbox toys below, BACK at
            // the bottom. tvGrid is jagged: one row per shelf.
            function addHeader(text, y, colorHex) {
                if (!font) return;
                const h = makeTextLabel(text, 0.42, colorHex);
                h.position.set(0, y, 0.1);
                scene.add(h);
                scenesMenuMeshes.push(h);
            }
            addHeader('WORD QUEST — the scene obeys what you type', 10.6, 0xffd700);
            addHeader('SANDBOX — classic baby-smash letter toys', 6.2, 0x00ff88);

            const gameRow = scenesItems.filter(s => GAME_LEVEL_NAMES.includes(s));
            const classicRow = scenesItems.filter(s => s !== 'BACK' && !GAME_LEVEL_NAMES.includes(s));
            const rowsDef = [
                { items: gameRow, game: true, y: 8.8, spacing: 4.6 },
                { items: classicRow, game: false, y: 4.4, spacing: 4.0 },
                { items: ['BACK'], game: false, y: 1.0, spacing: 4.0 }
            ];
            rowsDef.forEach((row, ry) => {
                tvGrid[ry] = [];
                const n = row.items.length;
                row.items.forEach((label, ix) => {
                    const idx = scenesItems.indexOf(label);
                    const w = row.game ? 3.8 : 3.0, hgt = row.game ? 2.5 : 1.9;
                    const tvMat = new THREE.MeshPhongMaterial({
                        color: 0x000000,
                        emissive: row.game ? 0x2a2000 : 0x003300
                    });
                    const tv = new THREE.Mesh(new THREE.BoxGeometry(w, hgt, 0.2), tvMat);
                    tv.position.set((ix - (n - 1) / 2) * row.spacing, row.y, 0);
                    tv.userData = { x: ix, y: ry, index: idx, type: 'tvBox', game: row.game };
                    scene.add(tv);
                    scenesMenuMeshes.push(tv);
                    tvMeshes.push(tv);
                    tvGrid[ry][ix] = tv;
                    if (font) {
                        const textMesh = makeTextLabel(label, row.game ? 0.32 : 0.28,
                            row.game ? 0xffd700 : 0x00FF00);
                        textMesh.position.set(tv.position.x, tv.position.y - 0.05, 0.12);
                        textMesh.userData = { index: idx, type: 'sceneOption', tv: tv };
                        scene.add(textMesh);
                        scenesMenuMeshes.push(textMesh);
                        tv.userData.textMesh = textMesh;
                        if (row.game) {
                            const tag = makeTextLabel('· TYPE WORDS ·', 0.17, 0xffffff);
                            tag.position.set(tv.position.x, tv.position.y - 0.82, 0.12);
                            scene.add(tag);
                            scenesMenuMeshes.push(tag);
                        }
                    }
                });
            });

            currentTvX = 0;
            currentTvY = 0;
            updateScenesSelection();
        }

        function createOptionsMenu() {
            inOptionsMenu = true;
            menuMeshes.forEach(m => scene.remove(m));
            menuMeshes = [];
            optionsMenuMeshes = [];

            optionsItems.forEach((text, i) => {
                const charGeo = new THREE.TextGeometry(text, {
                    font: font, size: 0.8, height: 0.2
                });
                charGeo.computeBoundingBox();
                const material = new THREE.MeshPhongMaterial({ color: 0xffffff });
                const mesh = new THREE.Mesh(charGeo, material);
                
                const width = charGeo.boundingBox.max.x - charGeo.boundingBox.min.x;
