                mesh.position.set(-width / 2, (optionsItems.length / 2 - i) * 2, 0);
                mesh.userData = { index: i };
                scene.add(mesh);
                optionsMenuMeshes.push(mesh);
            });
            updateOptionsSelection();
        }

        function updateOptionsSelection() {
            optionsMenuMeshes.forEach((mesh, i) => {
                const isSelected = i === selectedOptionIndex;
                mesh.material.color.setHex(isSelected ? 0xff0000 : 0xffffff);
                mesh.scale.setScalar(isSelected ? 1.2 : 1.0);
                
                // Show values for sliders
                if (optionsItems[i] === 'SOUND VOLUME') {
                    mesh.name = `SOUND VOLUME: ${Math.round(soundVolume * 100)}%`;
                } else if (optionsItems[i] === 'GRAVITY') {
                    mesh.name = `GRAVITY: ${worldGravity.toFixed(2)}`;
                } else if (optionsItems[i] === 'MAX LETTERS') {
                    mesh.name = `MAX LETTERS: ${maxLetters}`;
                } else {
                    mesh.name = optionsItems[i];
                }
            });
        }

        function updateScenesSelection() {
            const selectedTv = tvGrid[currentTvY][currentTvX];
            selectedSceneIndex = selectedTv.userData.index;

            tvMeshes.forEach(tv => {
                const isSelected = tv === selectedTv;
                const g = tv.userData.game;
                tv.material.emissive.setHex(isSelected
                    ? (g ? 0x6a5200 : 0x006600)
                    : (g ? 0x2a2000 : 0x003300));
                if (tv.userData.textMesh) {
                    tv.userData.textMesh.material.color.setHex(isSelected ? 0xffffff : (g ? 0xffd700 : 0x00ff00));
                    tv.userData.textMesh.scale.setScalar(isSelected ? 1.35 : 1.0);
                }
            });

            // Partial-zoom camera: drift toward the selected shelf but keep
            // the whole wall in view.
            targetCameraPos.set(selectedTv.position.x * 0.55, selectedTv.position.y * 0.55 + 2.4, 13.5);
            targetCameraLookAt.set(selectedTv.position.x * 0.7, selectedTv.position.y * 0.85, 0);
        }

        function createMenu() {
            menuMeshes.forEach(m => scene.remove(m));
            menuMeshes = [];
            targetCameraPos.set(0, 5, 15);
            targetCameraLookAt.set(0, 0, 0);

            menuItems.forEach((text, i) => {
                const group = new THREE.Group();
                let xOffset = 0;
                for (let j = 0; j < text.length; j++) {
                    const charGeo = new THREE.TextGeometry(text[j], {
                        font: font, size: 0.8, height: 0.2, curveSegments: 12
                    });
                    charGeo.computeBoundingBox();
                    const charMesh = new THREE.Mesh(charGeo, new THREE.MeshPhongMaterial({ color: 0xffffff }));
                    charMesh.position.x = xOffset;
                    xOffset += charGeo.boundingBox.max.x - charGeo.boundingBox.min.x + 0.1;
                    group.add(charMesh);
                }

                const box = new THREE.Box3().setFromObject(group);
                const width = box.max.x - box.min.x;
                group.children.forEach(c => c.position.x -= width / 2);
                
                group.position.y = (menuItems.length / 2 - i) * 2;
                group.userData = { index: i, baseScale: 1, targetScale: 1, originalY: group.position.y };
                scene.add(group);
                menuMeshes.push(group);
            });
            updateSelection();
        }

        function updateSelection() {
            menuMeshes.forEach((mesh, i) => {
                mesh.userData.targetScale = (i === selectedIndex) ? 1.5 : 1.0;
                mesh.children.forEach(char => {
                    char.material.color.setHex(i === selectedIndex ? 0xff0000 : 0xffffff);
                });
            });
        }

        function spawnLetter(char) {
            if (!font) return;

            // LLF-34: Enforce maxLetters
            retireExcessBodies();
            const geo = new THREE.TextGeometry(char, { font: font, size: 1, height: 0.4 });
            geo.computeBoundingBox();
            
            // LLF-47: Metallic bump mapping for letters
            // LLF-52: Randomize color
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff,
                metalness: 0.8,
                roughness: 0.3,
                envMapIntensity: 1.0,
                flatShading: true // Gives a faceted, metallic look
            });
            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            const box = new THREE.Box3().setFromObject(mesh);
            const size = new THREE.Vector3();
            box.getSize(size);
            
            // Bowl fix: drop ABOVE the bowl center (golden-angle spiral) so letters fall
            // into the bowl and pile up centered on screen. Falls back to the play box.
            if (!bowlInfo && !playBounds) setupPlayArea();
            const pos = bowlSpawnPos(size.y);
            pos.x += (Math.random() - 0.5) * 0.4;
            pos.z += (Math.random() - 0.5) * 0.4;
            mesh.position.copy(pos);
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2));
            const body = new CANNON.Body({ mass: 1, material: physicsMaterial });
            body.addShape(shape);
            body.position.set(pos.x, pos.y, pos.z);
            body.angularVelocity.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);
            world.addBody(body);

            physicsBodies.push({ mesh, body });

            // LLF-34: Keep count and delete older ones
            retireExcessBodies();
            return { mesh, body };
        }

        function spellWordInScene(word) {
            if (!font) return;

            // LLF-57: NPC presentation logic
            const npc = physicsBodies.find(pb => pb.type === 'npc');
            if (npc) {
                // LLB-16: Clear previous word's letters if still presenting or just finished
                if (npc.shownLetters) {
                    npc.shownLetters.forEach(l => {
                        // Give them a little kick away
                        l.body.applyImpulse(new CANNON.Vec3((Math.random()-0.5)*5, 5, (Math.random()-0.5)*5), l.body.position);
                    });
                }
                npc.presentingWord = word;
                npc.presentingCharIdx = 0;
                npc.presentingTimer = 0;
                npc.shownLetters = [];
                yellWord(word);
                return;
            }

            // LLF-52: TTS the word
            yellWord(word);

            // Bowl fix: center the spelled row over the bowl and drop it from above the
            // rim so the whole word falls into the bowl on-screen.
            const bx = bowlInfo ? bowlInfo.cx : 0;
            const bz = bowlInfo ? bowlInfo.cz : -10;
            const dropY = bowlInfo ? (bowlInfo.topY + 4) : 15;
            const startX = bx - (word.length / 2) * 1.5;
            for (let i = 0; i < word.length; i++) {
                const char = word[i];

                // LLF-34: Enforce maxLetters
                retireExcessBodies();
            const geo = new THREE.TextGeometry(char, { font: font, size: 1.5, height: 0.6 });
                geo.computeBoundingBox();
                // LLF-47: Metallic bump mapping for word letters
                // LLF-52: Randomize color
                const material = new THREE.MeshStandardMaterial({ 
                    color: Math.random() * 0xffffff, 
                    emissive: 0x000000,
                    metalness: 0.8,
                    roughness: 0.3,
                    envMapIntensity: 1.2,
                    flatShading: true
                });
                const mesh = new THREE.Mesh(geo, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                const box = new THREE.Box3().setFromObject(mesh);
                const size = new THREE.Vector3();
                box.getSize(size);
                
                // LLF-52: Randomize starting position slightly
                const pos = new THREE.Vector3(startX + i * 1.5 + (Math.random() - 0.5) * 0.4, dropY + (Math.random() * 2), bz + (Math.random() - 0.5) * 0.6);
                mesh.position.copy(pos);
                scene.add(mesh);

                const shape = new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2));
                const body = new CANNON.Body({ mass: 5, material: physicsMaterial }); // Heavier letters
                body.addShape(shape);
                body.position.set(pos.x, pos.y, pos.z);
                world.addBody(body);

                physicsBodies.push({ mesh, body, isSpelled: true });
                
                // LLF-34: Keep count and delete older ones
                retireExcessBodies();
            // Add an upward force to "stand them up" initially
                body.applyImpulse(new CANNON.Vec3(0, 5, 0), body.position);
            }
        }

        function createGravityWell(word, position) {
            const well = {
                word: word,
                position: position.clone(),
                startTime: Date.now(),
                duration: 5000, // 5 seconds
                radius: 15,
                strength: 50,
                mesh: null
            };

            // Visual for gravity well
            const geo = new THREE.TorusGeometry(2, 0.05, 16, 100);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            scene.add(mesh);
            well.mesh = mesh;

            gravityWells.push(well);
        }

        function spawnShape() {
            const shapes = ['cube', 'sphere', 'box'];
            const type = shapes[Math.floor(Math.random() * shapes.length)];
            let geo, shape;
            const size = 1;
            // LLF-47: Metallic shape material
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff,
                metalness: 0.8,
                roughness: 0.3,
                envMapIntensity: 1.0,
                flatShading: true
            });

            // LLF-34: Enforce maxLetters
            retireExcessBodies();
            if (type === 'cube' || type === 'box') {
                geo = new THREE.BoxGeometry(size, size, size);
                shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
            } else {
                geo = new THREE.SphereGeometry(size/2, 16, 16);
                shape = new CANNON.Sphere(size/2);
            }

            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            // Bowl fix: drop the shape above the bowl center so it lands on-screen.
            const pos = bowlSpawnPos(size);
            mesh.position.copy(pos);
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 1, material: physicsMaterial });
            body.addShape(shape);
            body.position.set(pos.x, pos.y, pos.z);
            body.angularVelocity.set(Math.random() * 5, Math.random() * 5, Math.random() * 5);
            world.addBody(body);

            physicsBodies.push({ mesh, body });

            // LLF-34: Keep count and delete older ones
            retireExcessBodies();
            }

        // ==== MENU STATE MACHINE ==============================================
        // Single authority for which screen is visible. Tears down EVERY menu
        // screen's meshes first, so it is impossible to be in two screens at once
        // (fixes "SCENES and OPTIONS open on top of each other"). Then it builds the
        // requested screen and syncs the legacy booleans the rest of the code reads.
        function clearAllMenuMeshes() {
            menuMeshes.forEach(m => scene.remove(m)); menuMeshes = [];
            scenesMenuMeshes.forEach(m => scene.remove(m)); scenesMenuMeshes = [];
            tvMeshes = []; tvGrid = [];
            optionsMenuMeshes.forEach(m => scene.remove(m)); optionsMenuMeshes = [];
            escapeMenuMeshes.forEach(m => scene.remove(m)); escapeMenuMeshes = [];
            showEscapeMenu = false;
        }

        function setMenuScreen(name) {
            if (!MENU_SCREENS.includes(name)) name = 'MAIN';
            // Exclusivity: remove all menu meshes and reset the derived flags before
            // building the target screen. Only ONE screen is ever live afterwards.
            clearAllMenuMeshes();
            inScenesMenu = false;
            inOptionsMenu = false;
            menuScreen = name;

            // Word-quest HUDs: only visible while actually playing.
            setWordHudVisible(name === 'PLAYING');
            setObjectiveVisible(name === 'PLAYING' && !!gameMode);
            if (name !== 'PLAYING') hideBanner();

            if (name === 'MAIN') {
                gameStarted = false;
                clearBowl();               // no bowl behind the title menu
                createMenu();
            } else if (name === 'SCENES') {
                gameStarted = false;
                clearBowl();
                createScenesMenu();        // sets inScenesMenu = true
            } else if (name === 'OPTIONS') {
                gameStarted = false;
                clearBowl();
                selectedOptionIndex = 0;
                createOptionsMenu();       // sets inOptionsMenu = true
            } else if (name === 'PLAYING') {
                gameStarted = true;
                // Resume the toy. If no real scene is loaded yet, start the default one
                // (clean-slate so we never stack the desert on top of a previous level).
                if (currentScene === 'default' || !currentScene) {
                    buildScene(createDesertScene);
                }
                setupPlayArea();
            }
        }

        // Activate a highlighted MAIN-menu item. START GAME force-restarts the default
        // scene; SCENES/OPTIONS switch screens; EXIT closes the whole menu and returns
        // to PLAYING (resume the toy) — never a dead button.
        function activateMainMenuItem(item) {
            if (item === 'START GAME') {
                currentScene = 'default';      // force a fresh default scene
                setMenuScreen('PLAYING');
            } else if (item === 'SCENES') {
                setMenuScreen('SCENES');
            } else if (item === 'OPTIONS') {
                setMenuScreen('OPTIONS');
            } else if (item === 'EXIT') {
                setMenuScreen('PLAYING');      // resume the toy (or start default)
            }
        }

        function selectCurrentScene() {
            const selected = scenesItems[selectedSceneIndex];
            console.log(`Selecting scene: ${selected} at index ${selectedSceneIndex}`);
            if (selected === 'BACK' || !selected) {
                setMenuScreen('MAIN');
                return;
            }
            const builders = {
                'KYOTO TRAIN': createKyotoTrainScene,
                'FLIGHT SIM': createFlightSimScene,
                'MOON ROCKET': createMoonRocketScene,
                'WATERWORKS': createWaterworksScene,
                'TOWER BUILD': createTowerBuildScene,
                'WILD WEST': createWildWestScene,
                'COASTAL CITY': createCoastalCityScene,
                'DESERT': createDesertScene,
                'SPACE': createSpaceScene,
                'CITY': createCityScene,
                'FOREST': createForestScene
            };
            const build = builders[selected];
            if (build) buildScene(build);     // clean-slate wipe + build the chosen scene
            // Enter PLAYING. currentScene is now a real scene, so setMenuScreen won't
            // re-create the default; it just tears down the scenes menu + builds the
            // play area/bowl.
            setMenuScreen('PLAYING');
        }


        // The old ad-hoc in-game "escape overlay" menu has been replaced by the
        // setMenuScreen() state machine (Esc now toggles PLAYING <-> MAIN). This array is
        // retained only so clearAllMenuMeshes()/animate never reference an undefined and
        // any stray overlay meshes can still be torn down.
        let escapeMenuMeshes = [];

        function onKeyDown(e) {
            // In any menu screen, claim the navigation keys so the browser doesn't
            // scroll the page or move focus — that hijacking made arrow-key menu
            // navigation appear "dead" even though the handler below runs fine.
            if (menuScreen !== 'PLAYING' &&
                ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
                e.preventDefault();
            }
            // Esc toggles the menu open/closed via the state machine: from PLAYING it
            // opens the MAIN menu (pauses), from any menu screen it resumes the toy.
            if (e.key === 'Escape') {
                setMenuScreen(menuScreen === 'PLAYING' ? 'MAIN' : 'PLAYING');
                return;
            }

            if (menuScreen === 'MAIN') {
                if (e.key === 'ArrowUp') {
                    selectedIndex = (selectedIndex - 1 + menuItems.length) % menuItems.length;
                    updateSelection();
                } else if (e.key === 'ArrowDown') {
                    selectedIndex = (selectedIndex + 1) % menuItems.length;
                    updateSelection();
                } else if (e.key === 'Enter') {
                    activateMainMenuItem(menuItems[selectedIndex]);
                }
            } else if (menuScreen === 'OPTIONS') {
                if (e.key === 'ArrowUp') {
                    selectedOptionIndex = (selectedOptionIndex - 1 + optionsItems.length) % optionsItems.length;
                    updateOptionsSelection();
                } else if (e.key === 'ArrowDown') {
                    selectedOptionIndex = (selectedOptionIndex + 1) % optionsItems.length;
                    updateOptionsSelection();
                } else if (e.key === 'ArrowLeft') {
                    if (optionsItems[selectedOptionIndex] === 'SOUND VOLUME') {
                        soundVolume = Math.max(0, soundVolume - 0.1);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'GRAVITY') {
                        worldGravity = Math.min(0, worldGravity + 1);
                        world.gravity.set(0, worldGravity, 0);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'MAX LETTERS') {
                        maxLetters = Math.max(1, maxLetters - 5);
                        updateOptionsSelection();
                    }
                } else if (e.key === 'ArrowRight') {
                    if (optionsItems[selectedOptionIndex] === 'SOUND VOLUME') {
                        soundVolume = Math.min(1, soundVolume + 0.1);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'GRAVITY') {
                        worldGravity = Math.max(-20, worldGravity - 1);
                        world.gravity.set(0, worldGravity, 0);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'MAX LETTERS') {
                        maxLetters = Math.min(200, maxLetters + 5);
                        updateOptionsSelection();
                    }
                } else if (e.key === 'Enter') {
                    if (optionsItems[selectedOptionIndex] === 'BACK') {
                        setMenuScreen('MAIN');
                    }
                }
            } else if (menuScreen === 'SCENES') {
                // Jagged shelves: clamp x to the row we land on.
                if (e.key === 'ArrowUp') {
                    currentTvY = Math.max(0, currentTvY - 1);
                    currentTvX = Math.min(currentTvX, tvGrid[currentTvY].length - 1);
                    updateScenesSelection();
                } else if (e.key === 'ArrowDown') {
                    currentTvY = Math.min(tvGrid.length - 1, currentTvY + 1);
                    currentTvX = Math.min(currentTvX, tvGrid[currentTvY].length - 1);
                    updateScenesSelection();
                } else if (e.key === 'ArrowLeft') {
                    currentTvX = Math.max(currentTvX - 1, 0);
                    updateScenesSelection();
                } else if (e.key === 'ArrowRight') {
                    currentTvX = Math.min(currentTvX + 1, tvGrid[currentTvY].length - 1);
                    updateScenesSelection();
                } else if (e.key === 'Enter') {
                    selectCurrentScene();
                }
            } else {
                if (e.key.length === 1) {
                    const now = Date.now();
                    lastTypeTime = now;

                    // Word-quest levels consume typing entirely: keys feed the
                    // input buffer + word matcher instead of spawning letters.
                    if (gameMode) {
                        handleGameKey(e.key);
                        return;
                    }

                    if (/[a-zA-Z0-9]/.test(e.key)) {
                        const char = e.key.toUpperCase();
                        const letterObj = spawnLetter(char);
                        if (letterObj && letterObj.mesh) {
                            playTone(char, letterObj.mesh.position);
                        }

                        // LLF-2: Combo-Based Firework Triggers — fast typing sets off fireworks
                        comboKeyTimes.push(now);
                        if (comboKeyTimes.length > COMBO_SPEED_COUNT) comboKeyTimes.shift();
                        if (comboKeyTimes.length >= COMBO_SPEED_COUNT &&
                            (now - comboKeyTimes[0]) <= COMBO_SPEED_MS &&
                            (now - lastComboTime) > COMBO_COOLDOWN_MS) {
                            lastComboTime = now;
                            comboKeyTimes = [];
                            triggerComboFireworks(1);
                        }

                        // LLF-12: Alphabetical Rain — repeating one letter fast rains it down
                        if (char === rainLastChar && (now - rainLastTime) < RAIN_WINDOW_MS) {
                            rainRepeat++;
                        } else {
                            rainRepeat = 1;
                        }
                        rainLastChar = char; rainLastTime = now;
                        if (rainRepeat >= RAIN_TRIGGER_COUNT && !rainActive) {
                            rainRepeat = 0;
                            startLetterRain(char);
                        }

                        inputBuffer += char;
                        if (inputBuffer.length > 16) {
                            inputBuffer = inputBuffer.slice(-16);
                        }
                        bumpHeat();
                        updateWordHud();

                        // LLF-35: Prioritize longer words over shorter words
                        // Check for words in the buffer
                        let foundWords = [];
                        for (const word of DICTIONARY) {
                            if (inputBuffer.endsWith(word)) {
                                foundWords.push(word);
                            }
                        }

                        if (foundWords.length > 0) {
                            // Sort by length descending
                            foundWords.sort((a, b) => b.length - a.length);
                            const longestWord = foundWords[0];
                            console.log(longestWord);
                            // LLF-36: Special handling for "FEATUREBOARD"
                            if (longestWord === "FEATUREBOARD") {
                                hudFlashSuccess(longestWord);
                                yellWord("FEATUREBOARD");
                                launchNuke();
                                inputBuffer = "";
                                typedWord = "";
                                if (wordPending) {
                                    clearTimeout(wordPending.timer);
                                    wordPending = null;
                                }
                                return;
                            }

                            // LLF-15: Special handling for Zoo Animals
                            const zooAnimals = ['LION', 'ELEPHANT', 'MONKEY', 'ZEBRA', 'GIRAFFE'];
                            if (zooAnimals.includes(longestWord)) {
                                hudFlashSuccess(longestWord);
                                spawnZooAnimal(longestWord);
                                inputBuffer = "";
                                typedWord = "";
                                if (wordPending) {
                                    clearTimeout(wordPending.timer);
                                    wordPending = null;
                                }
                                return;
                            }

                            // If we have a pending word timer, and this word is longer, clear the old timer
                            if (wordPending && longestWord.length > wordPending.word.length) {
                                clearTimeout(wordPending.timer);
                                wordPending = null;
                            }

                            // If nothing is pending, or this is the longest word we've seen
                            if (!wordPending) {
                                // Wait 5 seconds before committing the word, to allow for longer words
                                const timer = setTimeout(() => {
                                    hudFlashSuccess(longestWord);
                                    spellWordInScene(longestWord);
                                    inputBuffer = ""; // Clear buffer after finding a word
                                    typedWord = "";
                                    wordPending = null;
                                }, 2000);
                                wordPending = { word: longestWord, timer: timer };
                            }
                        }

                        typedWord += char;
                        // Check for common words or just length (e.g. 5+ chars for a gravity well)
                        if (typedWord.length >= 10) {
                            createGravityWell(typedWord, new THREE.Vector3(0, 0, 0));
                            typedWord = ""; // Reset after creating well
                        }
                    } else if (e.key === ' ') {
                        if (typedWord.length > 0) {
                            //createGravityWell(typedWord, new THREE.Vector3(0, 0, 0));
                            typedWord = "";
                        }
                        inputBuffer = ""; // Clear buffer on space
                        updateWordHud();

                        // LLF-16: Spacebar acts as time-slow trigger
                        isTimeSlowed = !isTimeSlowed;
                        timeScale = isTimeSlowed ? 0.2 : 1.0;
                        console.log(`Time Dilation: ${isTimeSlowed ? 'SLOWED' : 'NORMAL'}`);
                    } else {
                        spawnShape();
                    }
                }
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // LLF-58: Camera mouse exploration offset
            // Move camera slightly when mouse is near edges
            cameraMouseOffset.x = mouse.x * 2.0;
            cameraMouseOffset.y = mouse.y * 1.5;
            
            if (isRightClickHolding && gameStarted) {
                raycaster.setFromCamera(mouse, camera);
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const point = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, point);
                
                fusePath.push(point.clone());
                
                const dotGeo = new THREE.SphereGeometry(0.05, 4, 4);
                const dotMat = new THREE.MeshBasicMaterial({ color: 0xaa5500 });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(point);
                scene.add(dot);
                fuseDots.push(dot);
            }

            if (isDrawing && gameStarted) {
                raycaster.setFromCamera(mouse, camera);
                // Create a virtual plane at z=0 to draw on
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const point = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, point);
                
                paintbrushPath.push(point.clone());
                
                // Visual feedback for the trail
                const dotGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const dotMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(point);
                scene.add(dot);
                trailParticles.push(dot);
            }

            if (!gameStarted && !inScenesMenu && !inOptionsMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(menuMeshes, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !menuMeshes.includes(obj)) obj = obj.parent;
                    if (menuMeshes.includes(obj)) {
                        const newIndex = obj.userData.index;
                        if (newIndex !== selectedIndex) {
                            selectedIndex = newIndex;
                            updateSelection();
                        }
                    }
                }
            } else if (inOptionsMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(optionsMenuMeshes);
                if (intersects.length > 0) {
                    const idx = intersects[0].object.userData.index;
                    if (idx !== selectedOptionIndex) {
                        selectedOptionIndex = idx;
                        updateOptionsSelection();
                    }
                }
            } else if (inScenesMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tvMeshes);
                if (intersects.length > 0) {
                    const tv = intersects[0].object;
                    if (tv.userData.x !== currentTvX || tv.userData.y !== currentTvY) {
                        currentTvX = tv.userData.x;
                        currentTvY = tv.userData.y;
                        updateScenesSelection();
                    }
                }
            }
        }

        function onMouseDown(e) {
            if (menuScreen === 'PLAYING') {
                if (e.button === 2) { // Right click
                    isRightClickHolding = true;
                    rightClickStartTime = Date.now();
                    fusePath = [];
                    fuseDots.forEach(d => scene.remove(d));
                    fuseDots = [];

                    raycaster.setFromCamera(mouse, camera);
                    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                    const point = new THREE.Vector3();
                    raycaster.ray.intersectPlane(plane, point);
                    
                    // Put the rocket down
                    const rocketGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
                    // LLF-47: Metallic rocket material
                    const rocketMat = new THREE.MeshStandardMaterial({ 
                        color: 0xff0000,
                        metalness: 0.7,
                        roughness: 0.4,
                        envMapIntensity: 0.8,
                        flatShading: true
                    });
                    rocketMesh = new THREE.Mesh(rocketGeo, rocketMat);
                    rocketMesh.position.copy(point);
                    scene.add(rocketMesh);
                    
                    const rocketShape = new CANNON.Cylinder(0.2, 0.2, 1, 8);
                    rocketBody = new CANNON.Body({ mass: 1 });
                    rocketBody.addShape(rocketShape);
                    rocketBody.position.set(point.x, point.y, point.z);
                    world.addBody(rocketBody);
                    physicsBodies.push({ mesh: rocketMesh, body: rocketBody, type: 'rocket' });
                    
                    fusePath.push(point.clone());
                    return;
                }

                if (e.button === 1) { // Middle click
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(physicsBodies.map(pb => pb.mesh));
                    if (intersects.length > 0) {
                        const hit = physicsBodies.find(pb => pb.mesh === intersects[0].object);
                        if (hit) {
                            explodeLetter(hit);
                        }
                    }
                    return;
                }

                isDrawing = true;
                paintbrushPath = [];
                trailParticles.forEach(p => scene.remove(p));
                trailParticles = [];

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(physicsBodies.map(pb => pb.mesh));
                if (intersects.length > 0) {
                    const hit = physicsBodies.find(pb => pb.mesh === intersects[0].object);
                    if (hit) {
                        if (hit.type === 'zoo_animal') {
                            playZooAnimalSound(hit.animal);
                            hit.body.applyImpulse(new CANNON.Vec3(0, 15, 0), hit.body.position);
                            hit.body.angularVelocity.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                        } else {
                            hit.body.applyImpulse(new CANNON.Vec3(0, 10, -5), hit.body.position);
                        }
                    }
                }
            } else if (menuScreen === 'OPTIONS') {
                // Single click acts on whatever item was clicked (no select-then-click).
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(optionsMenuMeshes);
                if (intersects.length > 0) {
                    selectedOptionIndex = intersects[0].object.userData.index;
                    updateOptionsSelection();
                    const item = optionsItems[selectedOptionIndex];
                    if (item === 'BACK') {
                        setMenuScreen('MAIN');
                    } else if (item === 'SOUND VOLUME') {
                        soundVolume = (soundVolume + 0.2);
                        if (soundVolume > 1.1) soundVolume = 0;
                        updateOptionsSelection();
                    } else if (item === 'GRAVITY') {
                        worldGravity -= 2;
                        if (worldGravity < -20) worldGravity = 0;
                        world.gravity.set(0, worldGravity, 0);
                        updateOptionsSelection();
                    } else if (item === 'MAX LETTERS') {
                        maxLetters += 10;
                        if (maxLetters > 100) maxLetters = 10;
                        updateOptionsSelection();
                    }
                }
            } else if (menuScreen === 'SCENES') {
                // Single click selects that TV and loads the scene immediately.
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tvMeshes);
                if (intersects.length > 0) {
                    const tv = intersects[0].object;
                    currentTvX = tv.userData.x;
                    currentTvY = tv.userData.y;
                    updateScenesSelection();
                    selectCurrentScene();
                }
            } else {
                // MAIN Menu Click — a single click on an item activates it immediately
                // (all four items are wired, including OPTIONS and EXIT).
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(menuMeshes, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !menuMeshes.includes(obj)) obj = obj.parent;
                    if (menuMeshes.includes(obj)) {
                        selectedIndex = obj.userData.index;
                        updateSelection();
                        activateMainMenuItem(menuItems[selectedIndex]);
                    }
                }
            }
        }

        function onMouseUp(e) {
            if (isRightClickHolding) {
                isRightClickHolding = false;
                const rocket = { mesh: rocketMesh, body: rocketBody, fuse: [...fusePath], dots: [...fuseDots] };
                scene.userData.pendingRockets = scene.userData.pendingRockets || [];
                scene.userData.pendingRockets.push(rocket);
                fuseDots = [];
                fusePath = [];
                rocketMesh = null;
                rocketBody = null;
            }

            if (isDrawing) {
                isDrawing = false;
                // Ignite the trail!
                paintbrushPath.forEach(pos => {
                    spawnFirework(pos);
                });
                
                // Remove visual trail dots
                trailParticles.forEach(p => scene.remove(p));
                trailParticles = [];
                paintbrushPath = [];
            }
        }

        function spawnFirework(pos) {
            const particleCount = 20;
            const particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                const geo = new THREE.SphereGeometry(0.05, 4, 4);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                
                const angle = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.05 + Math.random() * 0.1;
                const velocity = new THREE.Vector3(
                    Math.sin(phi) * Math.cos(angle) * speed,
                    Math.sin(phi) * Math.sin(angle) * speed,
                    Math.cos(phi) * speed
                );
                
                particles.push({ mesh, velocity, life: 1.0 });
            }
            
            // Add a temporary animation loop or manage in main animate
            scene.userData.activeFireworks = scene.userData.activeFireworks || [];
            scene.userData.activeFireworks.push(...particles);
            capParticles(); // W5
        }

        // === LLF-Fix3: Cinematic detonation with varied burst styles =========
        // Extends the LLF-2 firework code. Each detonation randomly picks a color and one
        // of several burst styles. Particles carry optional per-particle gravity/drag/decay
        // (honored by the firework animate loop) so willow/ring/etc. look distinct.
        const FIREWORK_STYLES = ['sphere', 'willow', 'ring', 'crackle', 'palm'];
        function fwParticle(pos, velocity, color, opts) {
            const geo = new THREE.SphereGeometry((opts && opts.size) || 0.07, 4, 4);
            const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1.0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);
            scene.userData.activeFireworks = scene.userData.activeFireworks || [];
            scene.userData.activeFireworks.push(Object.assign(
                { mesh, velocity, life: 1.0, gravity: 0.0016, drag: 1.0, decay: 0.02 },
                opts || {}
            ));
        }
        function detonateFirework(pos, style, hue) {
            style = style || FIREWORK_STYLES[Math.floor(Math.random() * FIREWORK_STYLES.length)];
            hue = (hue == null) ? Math.random() : hue;
            playRocketBoom(); // LLF-Fix4 sound
            const col = (h, s, l) => new THREE.Color().setHSL(((h % 1) + 1) % 1, s == null ? 0.9 : s, l == null ? 0.55 : l);
            if (style === 'willow') {
                // Slow, drooping golden trails: low speed, strong gravity, long life.
                for (let i = 0; i < 34; i++) {
                    const a = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                    const sp = 0.06 + Math.random() * 0.06;
                    fwParticle(pos, new THREE.Vector3(
                        Math.sin(phi) * Math.cos(a) * sp,
                        Math.abs(Math.cos(phi)) * sp * 1.3 + 0.05, // bias upward first
                        Math.sin(phi) * Math.sin(a) * sp
                    ), col(0.09 + Math.random() * 0.05, 0.85, 0.55), { gravity: 0.0045, drag: 0.985, decay: 0.011, size: 0.08 });
                }
            } else if (style === 'ring') {
                // Flat expanding ring in a random tilted plane.
                const tilt = (Math.random() - 0.5) * 0.6;
                const baseHue = hue;
                for (let i = 0; i < 30; i++) {
                    const a = (i / 30) * Math.PI * 2;
                    const sp = 0.17 + Math.random() * 0.03;
                    fwParticle(pos, new THREE.Vector3(
                        Math.cos(a) * sp,
                        Math.sin(a) * sp * tilt,
                        Math.sin(a) * sp
                    ), col(baseHue + Math.random() * 0.06), { gravity: 0.0008, drag: 0.99, decay: 0.016 });
                }
            } else if (style === 'crackle') {
                // Bright compact flash, then a few delayed micro-pops (the "crackle").
                for (let i = 0; i < 16; i++) {
                    const a = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                    const sp = 0.1 + Math.random() * 0.12;
                    fwParticle(pos, new THREE.Vector3(
                        Math.sin(phi) * Math.cos(a) * sp,
                        Math.sin(phi) * Math.sin(a) * sp,
                        Math.cos(phi) * sp
                    ), col(hue, 0.2, 0.9), { gravity: 0.0016, decay: 0.05, size: 0.06 });
                }
                for (let k = 0; k < 3; k++) {
                    setTimeout(() => {
                        if (!scene) return;
                        const off = new THREE.Vector3((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3).add(pos);
                        for (let i = 0; i < 8; i++) {
                            const a = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                            const sp = 0.08 + Math.random() * 0.08;
                            fwParticle(off, new THREE.Vector3(
                                Math.sin(phi) * Math.cos(a) * sp,
                                Math.sin(phi) * Math.sin(a) * sp,
                                Math.cos(phi) * sp
                            ), col(Math.random(), 0.3, 0.95), { gravity: 0.002, decay: 0.06, size: 0.05 });
                        }
                        capParticles();
                    }, 120 + k * 120);
                }
            } else if (style === 'palm') {
                // A few thick fronds that rise then droop.
                for (let f = 0; f < 9; f++) {
                    const a = (f / 9) * Math.PI * 2;
                    const sp = 0.15 + Math.random() * 0.05;
                    fwParticle(pos, new THREE.Vector3(
                        Math.cos(a) * sp * 0.6,
                        0.18 + Math.random() * 0.05,
                        Math.sin(a) * sp * 0.6
                    ), col(hue + Math.random() * 0.04, 0.9, 0.6), { gravity: 0.004, drag: 0.985, decay: 0.013, size: 0.1 });
                }
            } else {
                // 'sphere' — classic even burst.
                for (let i = 0; i < 28; i++) {
                    const a = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
                    const sp = 0.12 + Math.random() * 0.1;
                    fwParticle(pos, new THREE.Vector3(
                        Math.sin(phi) * Math.cos(a) * sp,
                        Math.sin(phi) * Math.sin(a) * sp,
                        Math.cos(phi) * sp
                    ), col(hue + Math.random() * 0.08), { gravity: 0.0016, decay: 0.02 });
                }
            }
            capParticles(); // W5: never leak particles
        }

        function spawnFireParticle(pos) {
            const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 4, 4);
            const colors = [0xff4400, 0xff8800, 0xffaa00, 0xffff00];
            const mat = new THREE.MeshBasicMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                transparent: true,
                opacity: 0.8
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);

            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.05,
                0.1 + Math.random() * 0.1,
                (Math.random() - 0.5) * 0.05
            );

            scene.userData.activeFireworks = scene.userData.activeFireworks || [];
            scene.userData.activeFireworks.push({ mesh, velocity, life: 1.0 });
            capParticles(); // W5
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            // LLF-Fix1: the visible play box depends on aspect ratio — recompute + rewall.
            setupPlayArea();
        }

        function explodeLetter(pb) {
            const pos = pb.mesh.position.clone();
            
            // LLF-4: Burst with a localized force field effect
            physicsBodies.forEach(other => {
                if (other === pb) return;
                const dist = other.body.position.distanceTo(pb.body.position);
                if (dist < 10) {
                    const dir = other.body.position.vsub(pb.body.position);
                    dir.normalize();
                    const force = 30 * (1 - dist/10);
                    other.body.applyImpulse(dir.scale(force), other.body.position);
                }
            });

            // Shatter into smaller glowing particles
            for (let i = 0; i < 30; i++) {
                const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 4, 4);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: pb.mesh.material.color || 0x00ffff,
                    emissive: pb.mesh.material.color || 0x00ffff,
                    emissiveIntensity: 2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.2 + Math.random() * 0.4;
                const velocity = new THREE.Vector3(
                    Math.sin(phi) * Math.cos(angle) * speed,
                    Math.sin(phi) * Math.sin(angle) * speed,
                    Math.cos(phi) * speed
                );

                scene.userData.activeFireworks = scene.userData.activeFireworks || [];
                scene.userData.activeFireworks.push({ mesh, velocity, life: 1.0 + Math.random() });
            }
            capParticles(); // W5: bound particle count after a shatter burst

            // Sound
            initAudio();
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2 * soundVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }

            // Remove original
            scene.remove(pb.mesh);
            world.removeBody(pb.body);
            physicsBodies = physicsBodies.filter(p => p !== pb);
            if (pb.mesh.geometry) pb.mesh.geometry.dispose();
            if (pb.mesh.material) pb.mesh.material.dispose();
        }

        function animate() {
            requestAnimationFrame(animate);
            updateControlsHint(); // W3: keep the on-screen hint in sync with game state
            if (npcMixer) npcMixer.update(0.016 * timeScale);
            const time = Date.now() * 0.002;

            // Camera Swing/Lerp — during play, follow the letter pile's bounding box so
            // it stays centered; menus set their own targets (leave those alone).
            // Word-quest levels drive their own camera + sim inside gameFrame().
            if (gameStarted) {
                if (gameMode) gameFrame();
                else frameLettersCamera();
            }
            updateWordHudFrame(); // buffer border glow: green -> orange -> blue -> green
            const finalTargetPos = targetCameraPos.clone().add(cameraMouseOffset);
            camera.position.lerp(finalTargetPos, 0.05);
            currentCameraLookAt.lerp(targetCameraLookAt, 0.05);
            camera.lookAt(currentCameraLookAt);

            // LLF-60: NPC stays within the visible frustum
            const npc = physicsBodies.find(pb => pb.type === 'npc');
            if (npc && gameStarted) {
                // Bounds for the visible scene area (frustum approximation)
                const minX = -12, maxX = 12;
                const minZ = -5, maxZ = 10;
                const minY = -5, maxY = 5;

                let pos = npc.body.position;
                let needsReset = false;

                if (pos.x < minX || pos.x > maxX) { pos.x = THREE.MathUtils.clamp(pos.x, minX, maxX); needsReset = true; }
                if (pos.z < minZ || pos.z > maxZ) { pos.z = THREE.MathUtils.clamp(pos.z, minZ, maxZ); needsReset = true; }
                if (pos.y < minY || pos.y > maxY) { pos.y = THREE.MathUtils.clamp(pos.y, minY, maxY); needsReset = true; }

                if (needsReset) {
                    npc.body.velocity.set(0, 0, 0);
                    // Pick a new wander target inside bounds
                    npc.wanderTarget = new CANNON.Vec3(
                        (Math.random() - 0.5) * 10,
                        -5,
                        (Math.random() - 0.5) * 5
                    );
                    npc.wanderTimer = 2;
                }
                
                // LLF-60: Scene Anchor Point - All future scene elements should be placed 
                // within the frustum visible from targetCameraPos (0, 5, 15) looking at (0, 0, 0).
            }

            if (showEscapeMenu) {
                escapeMenuMeshes.forEach((mesh, i) => {
                    const dist = 5;
                    const pos = new THREE.Vector3(0, (escapeMenuMeshes.length/2 - i) * 1.2, -dist);
                    pos.applyQuaternion(camera.quaternion);
                    pos.add(camera.position);
                    mesh.position.lerp(pos, 0.1);
                    mesh.quaternion.slerp(camera.quaternion, 0.1);
                });
            }
            if (!gameStarted) {
                menuMeshes.forEach((group, i) => {
                    group.userData.baseScale = THREE.MathUtils.lerp(group.userData.baseScale, group.userData.targetScale, 0.1);
                    group.scale.setScalar(group.userData.baseScale);
                    group.position.y = group.userData.originalY + Math.sin(time + i) * 0.2;
                    group.children.forEach((char, j) => {
                        char.position.y = Math.sin(time * 2 + j * 0.5) * 0.05;
                        char.rotation.z = Math.sin(time * 3 + j) * 0.02;
                    });
                });

                if (inScenesMenu) {
                    const selectedTv = tvGrid[currentTvY][currentTvX];
                    if (selectedTv && selectedTv.userData.textMesh) {
                        selectedTv.userData.textMesh.rotation.y = Math.sin(time * 2) * 0.2;
                    }
                }

                if (inOptionsMenu) {
                    optionsMenuMeshes.forEach((mesh, i) => {
                        mesh.rotation.y = Math.sin(time + i) * 0.1;
                        if (optionsItems[i] !== 'BACK') {
                             const charGeo = new THREE.TextGeometry(mesh.name, {
                                font: font, size: 0.8, height: 0.2
                            });
                            charGeo.computeBoundingBox();
                            mesh.geometry.dispose();
                            mesh.geometry = charGeo;
                            const width = charGeo.boundingBox.max.x - charGeo.boundingBox.min.x;
                            mesh.position.x = -width / 2;
                        }
                    });
                }
            } else {
                world.step((1 / 60) * timeScale);
                const now = Date.now();

                // Gravity Wells Logic
                gravityWells = gravityWells.filter(well => {
                    const elapsed = now - well.startTime;
                    if (elapsed > well.duration) {
                        scene.remove(well.mesh);
                        return false;
                    }

                    // Animate the well mesh
                    well.mesh.rotation.z += 0.05 * timeScale;
                    well.mesh.scale.setScalar(1 + Math.sin(time * 5) * 0.2);
                    well.mesh.material.opacity = 0.5 * (1 - elapsed / well.duration);

                    // Pull physics bodies
                    physicsBodies.forEach(pb => {
                        const dist = pb.body.position.distanceTo(new CANNON.Vec3(well.position.x, well.position.y, well.position.z));
                        if (dist < well.radius) {
                            const force = new CANNON.Vec3(
                                well.position.x - pb.body.position.x,
                                well.position.y - pb.body.position.y,
                                well.position.z - pb.body.position.z
                            );
                            force.normalize();
                            force.scale(well.strength * (1 - dist / well.radius) * timeScale, force);
                            pb.body.applyForce(force, pb.body.position);
                        }
                    });
                    return true;
                });

                physicsBodies.forEach(pb => {
                // LLF-56: If y is very low, it might have fallen through colliders 
                if (pb.body.position.y < -50) { 
                    pb.body.position.set(0, 15, 0); 
                    pb.body.velocity.set(0, 0, 0); 
                }
                    pb.mesh.position.copy(pb.body.position);
                    pb.mesh.quaternion.copy(pb.body.quaternion);

                    // LLF-54: Glowing effect for spelled words
                                        // LLF-65: Fire shader more like actual flames
                    if (pb.isFireWord) {
                        const intensity = 5 + Math.sin(time * 15) * 3;
                        pb.mesh.material.emissiveIntensity = intensity;
                        pb.mesh.material.color.setRGB(1.0, 0.3 + Math.sin(time * 20) * 0.2, 0.0);
                        
                        // LLF-65: Actual flames particle effects
                        if (Math.random() > 0.2) {
                            const firePos = pb.mesh.position.clone();
                            firePos.x += (Math.random() - 0.5) * 0.5;
                            firePos.z += (Math.random() - 0.5) * 0.5;
                            spawnFireParticle(firePos);
                        }
                    }
                    if (pb.isSpelled) {
                        const glowIntensity = 0.5 + Math.sin(time * 5) * 0.5;
                        if (pb.mesh.material.emissive) {
                            pb.mesh.material.emissive.setHex(pb.mesh.material.color.getHex());
                            pb.mesh.material.emissiveIntensity = glowIntensity * 2;
                        }
                    }

                    // LLF-3: Zoo Animal Wandering logic
                    if (pb.type === 'zoo_animal' && pb.body.position.y < -4) {
                        pb.wanderTimer -= (1/60) * timeScale;
                        if (pb.wanderTimer <= 0) {
                            pb.wanderTimer = 2 + Math.random() * 3;
                            pb.wanderTarget = new CANNON.Vec3((Math.random()-0.5)*40, -5, (Math.random()-0.5)*40);
                        }
                        const dir = pb.wanderTarget.vsub(pb.body.position);
                        dir.y = 0;
                        dir.normalize();
                        const speed = 5 * timeScale;
                        pb.body.velocity.x = dir.x * speed;
                        pb.body.velocity.z = dir.z * speed;
                        
                        // Look towards target (rough approximation with quaternion)
                        const angle = Math.atan2(dir.x, dir.z);
                        pb.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle);
                    }
                    if (pb.type === 'npc') {
                        // Keep on ground if fallen through
                        if (pb.body.position.y < -10) pb.body.position.y = 5;

                        // Knock over letters logic (applied to all physics bodies)
                        physicsBodies.forEach(other => {
                            if (other !== pb && other.body.position.distanceTo(pb.body.position) < 2.0) {
                                // LLB-17: Disable knocking while presenting and for 5s after
                                if (pb.presentingWord || (pb.postPresentingTimer && pb.postPresentingTimer > 0)) {
                                    return;
                                }
                                // Knock over: apply a force away from npc
                                const knockDir = other.body.position.vsub(pb.body.position);
                                knockDir.y = 0.5; // slight upward pop
                                knockDir.normalize();
                                other.body.applyImpulse(knockDir.scale(5), other.body.position);
                            }
                        });

                        if (pb.presentingWord) {
                            const word = pb.presentingWord;
                            pb.body.velocity.set(0, 0, 0);

                            // Keep shown letters standing
                            if (pb.shownLetters) {
                                pb.shownLetters.forEach((l, idx) => {
                                    if (!l.body || !l.mesh || l.isHeadingToScreen) return;
                                    const npcPos = pb.body.position;
                                    // Space letters out, handle long words by scaling distance
                                    const spacing = word.length > 8 ? 1.0 : 1.5;
                                    const targetPos = new THREE.Vector3(npcPos.x, npcPos.y - 1, npcPos.z).add(
                                        new THREE.Vector3((idx - (word.length-1)/2)*spacing, 0, 4).applyQuaternion(pb.mesh.quaternion)
                                    );
                                    // Lerp body towards target to "stand them up"
                                    const currentPos = l.body.position;
                                    l.body.position.x += (targetPos.x - currentPos.x) * 0.1 * timeScale;
                                    l.body.position.z += (targetPos.z - currentPos.z) * 0.1 * timeScale;
                                    l.body.velocity.y *= 0.9; // dampen
                                    // Align rotation to NPC
                                    const targetQuat = pb.body.quaternion;
                                    l.body.quaternion.x += (targetQuat.x - l.body.quaternion.x) * 0.1 * timeScale;
                                    l.body.quaternion.y += (targetQuat.y - l.body.quaternion.y) * 0.1 * timeScale;
                                    l.body.quaternion.z += (targetQuat.z - l.body.quaternion.z) * 0.1 * timeScale;
                                    l.body.quaternion.w += (targetQuat.w - l.body.quaternion.w) * 0.1 * timeScale;
                                    l.body.quaternion.normalize();
                                });
                            }
                            
                            // LLF-63: Throw entire word at once
                            const npcPosThrow = pb.body.position;
                            const backpackPos = new THREE.Vector3(npcPosThrow.x, npcPosThrow.y + 1, npcPosThrow.z).add(
                                new THREE.Vector3(0,0,-1).applyQuaternion(pb.mesh.quaternion)
                            );
                            
                            // Create a word group/container or just throw individual letters in a burst
                            for (let i = 0; i < word.length; i++) {
                                const char = word[i];
                                const letter = spawnLetter(char);
                                if (letter) {
                                    letter.body.position.set(backpackPos.x, backpackPos.y, backpackPos.z);
                                    
                                    // Fire shader / Glowing effect
                                    letter.mesh.material = new THREE.MeshStandardMaterial({
                                        color: 0xff4400,
                                        emissive: 0xff2200,
                                        emissiveIntensity: 5,
                                        metalness: 0.9,
                                        roughness: 0.1
                                    });
                                    letter.isFireWord = true;

                                    const targetPos = new THREE.Vector3(0, 0, 0);
                                    const throwDir = targetPos.clone().sub(letter.body.position).normalize();
                                    const speed = 25 + Math.random() * 10;
                                    // Spread them out slightly
                                    const spread = new THREE.Vector3((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
                                    
                                    // Calculate upward toss
                                    const upToss = 15 + Math.random() * 10;
                                    
                                    letter.body.velocity.set(
                                        throwDir.x * speed + spread.x, 
                                        upToss + spread.y, 
                                        throwDir.z * speed + spread.z
                                    );
                                    
                                    letter.isHeadingToScreen = false;
                                    letter.char = char;
                                }
                            }
                            
                            pb.presentingWord = null;
                            pb.postPresentingTimer = 5.0;
                            pb.wanderTimer = 2;
                        }
                        
                        if (!pb.presentingWord) {
                            // LLB-17: Tick post-presenting timer
                            if (pb.postPresentingTimer > 0) {
                                pb.postPresentingTimer -= (1/60) * timeScale;
                            }

                            // LLF-66: Dino wanders towards camera over 20 seconds
                            if (pb.wanderTowardCamera) {
                                const elapsed = (Date.now() - pb.wanderStartTime) / 1000;
                                const duration = 20; // 20 seconds
                                
                                // Target position: 50 units out from camera in the direction it's pointing
                                const cameraDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                                cameraDir.y = 0; // Keep it on the ground
                                cameraDir.normalize();
                                const targetPos = camera.position.clone().add(cameraDir.multiplyScalar(50));
                                targetPos.y = -5; // Ground level
                                
                                if (elapsed < duration) {
                                    // Mix wandering with camera attraction
                                    const cameraInfluence = elapsed / duration; // 0 to 1
                                    
                                    if (pb.wanderTimer <= 0 || !pb.wanderTarget) {
                                        pb.wanderTimer = 5 + Math.random() * 10;
                                        const randomWander = new CANNON.Vec3((Math.random()-0.5)*60, -5, (Math.random()-0.5)*60);
                                        
                                        // Blend random target with camera target
                                        pb.wanderTarget = new CANNON.Vec3(
                                            THREE.MathUtils.lerp(randomWander.x, targetPos.x, cameraInfluence),
                                            -5,
                                            THREE.MathUtils.lerp(randomWander.z, targetPos.z, cameraInfluence)
                                        );
                                    }
                                } else {
                                    // Fully locked on to camera direction
                                    pb.wanderTarget = new CANNON.Vec3(targetPos.x, -5, targetPos.z);
                                    if (pb.wanderTimer <= 0) pb.wanderTimer = 1.0;
                                }
                            }

                            // Normal Wandering
                            pb.wanderTimer -= (1/60) * timeScale;
                            if (pb.wanderTimer <= 0 || !pb.wanderTarget) {
                                pb.wanderTimer = 5 + Math.random() * 10;
                                pb.wanderTarget = new CANNON.Vec3((Math.random()-0.5)*60, -5, (Math.random()-0.5)*60);
                            }
                            const dir = pb.wanderTarget.vsub(pb.body.position);
                            dir.y = 0; dir.normalize();
                            pb.body.velocity.x = dir.x * 4 * timeScale;
                            pb.body.velocity.z = dir.z * 4 * timeScale;
                            
                            const angle = Math.atan2(dir.x, dir.z);
                            pb.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle);
                        }
                    }
                });

                if (currentScene === 'coastal_city') {
                    const ocean = scene.children.find(m => m.geometry && m.geometry.type === 'PlaneGeometry' && m.position.y <= -15);
                    if (ocean) {
                        ocean.position.y = -15.5 + Math.sin(time * 0.5) * 0.2;
                        ocean.rotation.x = -Math.PI / 2 + Math.sin(time * 0.3) * 0.01;
                        ocean.rotation.y = Math.sin(time * 0.1) * 0.01;
                    }
                }
                if (currentScene === 'desert' && scene.userData.sparkles) {
                    const positions = scene.userData.sparkles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i+1] = -5.04 + Math.sin(time * 5 + i) * 0.05;
                    }
                    scene.userData.sparkles.geometry.attributes.position.needsUpdate = true;
                }
                if (currentScene === 'desert' && scene.userData.sparkles) {
                    const positions = scene.userData.sparkles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i+1] = -5.04 + Math.sin(time * 5 + i) * 0.05;
                    }
                    scene.userData.sparkles.geometry.attributes.position.needsUpdate = true;
                }

                if (currentScene === 'wild_west' && scene.userData.trainCars) {
                    // W2: advance a single head parameter along the arc-length curve;
                    // each car trails it by a fixed arc gap, so the train follows the
                    // track smoothly. Kinematic bodies are teleported to match.
                    const curve = scene.userData.trackCurve;
                    const L = scene.userData.trackLength || 1;
                    const du = scene.userData.trainCarGap / L;
                    const wwH = scene.userData.wwHeight || (() => -5.05);
                    scene.userData.trainHeadU = (scene.userData.trainHeadU + 0.0009 * timeScale) % 1;
                    const headU = scene.userData.trainHeadU;
                    scene.userData.trainCars.forEach((car, k) => {
                        let u = (headU - k * du) % 1;
                        if (u < 0) u += 1;
                        const p = curve.getPointAt(u);
                        const t = curve.getTangentAt(u);
                        const yaw = Math.atan2(t.x, t.z);
                        const gy = wwH(p.x, p.z);
                        car.group.position.set(p.x, gy, p.z);
                        car.group.rotation.y = yaw;
                        car.body.position.set(p.x, gy + car.yOff, p.z);
                        car.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), yaw);
                    });
                    scene.userData.trainWheels.forEach(w => {
                        w.rotation.x += 0.18 * timeScale;
                    });
                }

                // Firework Animation Logic — honors optional per-particle gravity/drag/decay
                // (LLF-Fix3) so willow/ring/crackle/palm bursts each move distinctly.
                if (scene.userData.activeFireworks) {
                    scene.userData.activeFireworks = scene.userData.activeFireworks.filter(p => {
                        p.mesh.position.x += p.velocity.x * timeScale;
                        p.mesh.position.y += p.velocity.y * timeScale;
                        p.mesh.position.z += p.velocity.z * timeScale;
                        const g = (p.gravity != null) ? p.gravity : 0.001;
                        p.velocity.y -= g * timeScale; // Gravity
                        if (p.drag != null && p.drag !== 1.0) {
                            const d = Math.pow(p.drag, timeScale);
                            p.velocity.x *= d; p.velocity.y *= d; p.velocity.z *= d;
                        }
                        p.life -= ((p.decay != null) ? p.decay : 0.02) * timeScale;
                        p.mesh.material.opacity = Math.max(0, Math.min(1, p.life));
                        p.mesh.material.transparent = true;

                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            return false;
                        }
                        return true;
                    });
                }

                // Rocket Fuse and Launch Logic
                if (scene.userData.pendingRockets) {
                    scene.userData.pendingRockets = scene.userData.pendingRockets.filter(rocket => {
                        if (rocket.fuse.length > 0) {
                            // LLF-16: Use a counter to slow down fuse burning
                            rocket.fuseCounter = (rocket.fuseCounter || 0) + timeScale;
                            if (rocket.fuseCounter >= 1.0) {
                                rocket.fuseCounter = 0;
                                const p = rocket.fuse.pop();
                                const dot = rocket.dots.pop();
                                if (dot) {
                                    spawnFirework(p);
                                    scene.remove(dot);
                                }
                            }
                            return true;
                        } else {
                            // LLF-Fix3: Cinematic scripted flight — the rocket rises AND
                            // recedes into the background (arcing away from the camera like
                            // a TV firework), then detonates into a varied burst. Driven by
                            // position (physics body detached) so containment walls never
                            // block it and the arc is exactly the shape we want.
                            if (!rocket.flight) {
                                if (rocket.body) {
                                    world.removeBody(rocket.body);
                                    physicsBodies = physicsBodies.filter(pb => pb.body !== rocket.body);
                                }
                                const b = playBounds || { minX: -8, maxX: 8, minZ: -9, maxZ: 5, floorY: DEFAULT_FLOOR_Y };
                                const start = rocket.mesh.position.clone();
                                const ox = THREE.MathUtils.clamp(start.x, b.minX, b.maxX);
                                const oz = THREE.MathUtils.clamp(start.z, b.minZ + 1, b.maxZ);
                                const oy = b.floorY + 0.5;              // launch from near the ground
                                rocket.flight = {
                                    duration: 1500 + Math.random() * 800,   // ms of ascent
                                    ox: ox, oy: oy, oz: oz,
                                    drift: (Math.random() - 0.5) * 10,      // lateral sway
                                    depth: 26 + Math.random() * 20,         // travel INTO background (-z)
                                    apex: 14 + Math.random() * 8,           // rise height
                                    style: FIREWORK_STYLES[Math.floor(Math.random() * FIREWORK_STYLES.length)],
                                    hue: Math.random(),
                                    u: 0, lastExhaust: 0,
                                    prev: new THREE.Vector3(ox, oy, oz)
                                };
                                rocket.mesh.position.set(ox, oy, oz);
                                playRocketWhoosh();                         // LLF-Fix4 launch sound
                            }
                            const fl = rocket.flight;
                            fl.u += (timeScale * 16.7) / fl.duration;       // advance (slow-mo aware)
                            const t = Math.min(1, fl.u);
                            const cur = new THREE.Vector3(
                                fl.ox + fl.drift * t,
                                fl.oy + fl.apex * (1 - (1 - t) * (1 - t)), // rise, easing near apex
                                fl.oz - fl.depth * t                       // recede into background
                            );
                            const dir = cur.clone().sub(fl.prev);
                            if (dir.lengthSq() > 1e-6) {
                                dir.normalize();
                                rocket.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                            }
                            rocket.mesh.position.copy(cur);
                            fl.prev.copy(cur);
                            // Thin exhaust trail trailing the nose.
                            fl.lastExhaust += timeScale;
                            if (fl.lastExhaust >= 1) {
                                fl.lastExhaust = 0;
                                fwParticle(cur.clone().addScaledVector(dir, -0.6),
                                    new THREE.Vector3((Math.random() - 0.5) * 0.02, -0.02, (Math.random() - 0.5) * 0.02),
                                    new THREE.Color(1.0, 0.7, 0.3), { gravity: 0.0005, decay: 0.06, size: 0.06 });
                            }
                            if (t < 1) return true;

                            // Detonate at apex with the chosen varied style + color.
                            detonateFirework(cur, fl.style, fl.hue);
                            scene.remove(rocket.mesh);
                            if (rocket.mesh.geometry) rocket.mesh.geometry.dispose();
                            if (rocket.mesh.material) rocket.mesh.material.dispose();
                            return false;
                        }
                    });
                }
            }

            
            // LLF-62: Screen letters logic
            screenLetters = screenLetters.filter(sl => {
                if (sl.stuckTimer > 0) {
                    sl.stuckTimer -= (1/60) * timeScale;
                } else {
                    sl.vy += 0.2 * timeScale;
                    sl.y += sl.vy;
                    sl.life -= 0.01 * timeScale;
                    sl.el.style.top = sl.y + '%';
                    sl.el.style.opacity = sl.life;
                    sl.el.style.transform = 'scale(' + (1 + (1-sl.life)) + ')';
                }

                if (sl.y > 110 || sl.life <= 0) {
                    document.getElementById('waterMarkOverlay').removeChild(sl.el);
                    return false;
                }
                return true;
            });

            
            // Check 3D letters for screen collision
            const frustum = new THREE.Frustum();
            const projScreenMatrix = new THREE.Matrix4();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);

            physicsBodies.forEach(pb => {
                if (pb.isHeadingToScreen) {
                    const pos = pb.mesh.position.clone();
                    const distance = pos.distanceTo(camera.position);
                    
                    // If it's in front of camera and very close
                    if (distance < 5) {
                        // Project to screen coordinates to see if it's actually "on screen"
                        const vector = pos.project(camera);
                        const x = (vector.x + 1) / 2;
                        const y = -(vector.y - 1) / 2;
                        
                        // If within screen bounds (roughly)
                        if (x > -0.2 && x < 1.2 && y > -0.2 && y < 1.2) {
                            spawnScreenLetter(pb.char);
                            pb.isHeadingToScreen = false;
                            scene.remove(pb.mesh);
                            world.removeBody(pb.body);
                            physicsBodies = physicsBodies.filter(item => item !== pb);
                        }
                    }
                }
            });

            renderer.render(scene, camera);
        }

        // Boot the app (all declarations above are initialized by now).
        init();
        animate();
        // build: word-quest levels v1
    </script>
</body>
</html>
