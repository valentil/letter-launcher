<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Launcher</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        /* W3: on-screen controls hint */
        #controlsHint {
            position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
            z-index: 200; pointer-events: none; max-width: 92%;
            padding: 8px 16px; border-radius: 10px;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.18);
            color: #eaf6ff; font-size: 13px; line-height: 1.5; text-align: center;
            letter-spacing: 0.2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            transition: opacity 0.4s ease;
        }
        #controlsHint b { color: #7fd7ff; }
        #controlsHint .key {
            display: inline-block; padding: 1px 6px; margin: 0 1px; border-radius: 4px;
            background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
            font-weight: 600; color: #fff;
        }
        /* Word-quest: live input buffer with a "readiness" border glow.
           Green = ready, warms toward orange as you type, flashes blue on a
           recognized word, then fades back to green. */
        #wordHud {
            position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
            min-width: 240px; padding: 10px 26px; border-radius: 12px;
            border: 2px solid #39d353; box-shadow: 0 0 18px rgba(57, 211, 83, 0.55);
            background: rgba(0, 0, 0, 0.6); color: #fff; z-index: 220; display: none;
            font-family: 'Consolas', 'Courier New', monospace; font-size: 24px; font-weight: 600;
            letter-spacing: 4px; text-align: center; pointer-events: none;
        }
        #wordHud .ph { color: rgba(255,255,255,0.35); font-size: 14px; letter-spacing: 1px; font-weight: 400; }
        /* Word-quest: objective / hint / discovered-words panel */
        #objectiveHud {
            position: absolute; top: 14px; left: 14px; max-width: 350px;
            padding: 12px 16px; border-radius: 10px; z-index: 210; display: none;
            background: rgba(0, 0, 0, 0.62); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #eaf6ff; font-size: 13px; line-height: 1.55; pointer-events: none;
        }
        #objectiveHud h3 { margin: 0 0 5px; font-size: 15px; color: #7fd7ff; letter-spacing: 0.5px; }
        #objectiveHud .goal { color: #d7e8f5; }
        #objectiveHud .status { color: #9fe0a8; margin-top: 5px; font-family: 'Consolas', monospace; font-size: 12px; }
        #objectiveHud .msg { color: #ffd27f; margin-top: 5px; min-height: 17px; font-weight: 600; }
        #objectiveHud .found { color: #8fd98f; margin-top: 5px; font-size: 11px; }
        /* Word-quest: victory / event banner */
        #gameBanner {
            position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 46px; border-radius: 14px; z-index: 300; display: none;
            background: rgba(0, 0, 0, 0.78); border: 2px solid #ffd700; color: #ffd700;
            font-size: 34px; font-weight: 800; letter-spacing: 2px; text-align: center;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9); pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="waterMarkOverlay" style="background: rgba(255,0,0,0.1); position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 100;"></div>
    <div id="ui"></div>
    <!-- W3: brief on-screen controls hint (updated by updateControlsHint) -->
    <div id="controlsHint">Loading…</div>
    <!-- Word-quest game HUD: live typed buffer + objective panel + banner -->
    <div id="wordHud"></div>
    <div id="objectiveHud"></div>
    <div id="gameBanner"></div>
    <script>
        // LLF-Dict: Built-in offline fallback (~200 common words). Used immediately so
        // word detection works before any network fetch resolves, and permanently if
        // both the local file and the online list fail. Keeps the toy 100% client-side.
        const FALLBACK_WORDS = [
            "THE","AND","FOR","ARE","BUT","NOT","YOU","ALL","ANY","CAN","HAD","HER","WAS","ONE","OUR","OUT","DAY","GET","HAS","HIM","HIS","HOW","MAN","NEW","NOW","OLD","SEE","TWO","WAY","WHO","BOY","DID","ITS","LET","PUT","SAY","SHE","TOO","USE",
            "CAT","DOG","EGG","FISH","GOAT","HAT","ICE","JUMP","KITE","LION","MOON","NEST","OWL","PIG","QUEEN","RAIN","SUN","TREE","VAN","WOLF","YAK","ZEBRA","BIRD","CAKE","DUCK","FIRE","GOLD","HAND","IRON","JOKE","KING","LAMP","MILK","NOTE","OPEN","PARK","ROSE","STAR","TENT","UNIT","VOTE","WIND","YEAR","ZONE",
            "APPLE","BALL","BEAR","BEE","BOAT","BOOK","CAR","CLOUD","COW","CROWN","DEER","DOOR","DRUM","EAGLE","EARTH","FARM","FLAG","FROG","GAME","GHOST","GLASS","GRASS","HEART","HORSE","HOUSE","JUICE","KEY","LEAF","LEMON","LIGHT","LOVE","MOUSE","MUSIC","NIGHT","OCEAN","PLANT","PLAY","QUACK","RIVER","ROBOT","ROCK","SAND","SEED","SHIP","SNAKE","SNOW","SONG","STONE","STORM","SWORD","TIGER","TRAIN","WATER","WHALE","WHEEL","WORLD","BLUE","RED","GREEN","PINK","BLACK","WHITE","BROWN","HAPPY","HELLO","SMILE","DANCE","DREAM","MAGIC","SPACE","STARS","SWEET","SUPER","MOUNTAIN","RAINBOW","GARDEN","FOREST","FLOWER","BUTTERFLY","DINOSAUR","ELEPHANT","MONKEY","RABBIT","TURTLE","PENGUIN","DOLPHIN","CASTLE","DRAGON","WIZARD","PLANET","COMET","ROCKET","THUNDER","JUNGLE"
        ];
        let DICTIONARY = FALLBACK_WORDS.slice();

        // LLF-Dict: Client-side dictionary loader with a defined try-order + fallback.
        //   1) ./dictionary.txt  — local file if the user still ships it (fast, offline).
        //   2) an online public word list (google-10000-english, ~10k common words) so
        //      the ~4 MB file no longer has to be committed. words_alpha (dwyl) works too
        //      but its 370k words make the per-keystroke endsWith() scan sluggish, so the
        //      smaller common-words list is preferred for snappier detection.
        //   3) FALLBACK_WORDS (already loaded above) if both network paths fail.
        // Result is cached in the in-memory DICTIONARY global. All errors are caught so
        // there are never uncaught promise rejections.
        const DICTIONARY_SOURCES = [
            './dictionary.txt',
            'https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english-no-swears.txt'
        ];
        async function loadDictionary() {
            for (const url of DICTIONARY_SOURCES) {
                try {
                    const res = await fetch(url);
                    if (!res || !res.ok) continue;
                    const text = await res.text();
                    const words = text.split(/\r?\n/)
                        .map(w => w.trim().toUpperCase())
                        .filter(w => w.length > 2 && /^[A-Z]+$/.test(w));
                    if (words.length > 50) {
                        DICTIONARY = words;
                        console.log(`Letter Launcher: loaded ${words.length} words from ${url}`);
                        return;
                    }
                } catch (err) {
                    console.warn(`Letter Launcher: dictionary source failed (${url}):`, err && err.message);
                }
            }
            console.warn(`Letter Launcher: using built-in fallback word list (${DICTIONARY.length} words).`);
        }
        loadDictionary();
    </script>
