                if (f.opts.bob) f.mesh.position.y += Math.sin(k * 20) * 0.4;
                if (f.opts.arc) f.mesh.position.y += Math.sin(k * Math.PI) * f.opts.arc;
                if (f.opts.spin) { f.mesh.rotation.y += 0.1 * timeScale; f.mesh.rotation.x += 0.06 * timeScale; }
                if (f.opts.face) f.mesh.lookAt(f.to);
                if (k >= 1) {
                    scene.remove(f.mesh);
                    if (f.opts.onDone) try { f.opts.onDone(); } catch (err) {}
                    return false;
                }
                return true;
            });
            if (gameMode.weather === 'rain') {
                for (let i = 0; i < 3; i++) fwParticle(
                    new THREE.Vector3((Math.random() - 0.5) * 52, 14, (Math.random() - 0.5) * 32 - 4),
                    new THREE.Vector3(0, -0.5, 0), new THREE.Color(0x66aaff),
                    { gravity: 0.004, decay: 0.03, size: 0.05 });
            } else if (gameMode.weather === 'snow') {
                for (let i = 0; i < 2; i++) fwParticle(
                    new THREE.Vector3((Math.random() - 0.5) * 52, 14, (Math.random() - 0.5) * 32 - 4),
                    new THREE.Vector3((Math.random() - 0.5) * 0.03, -0.06, 0), new THREE.Color(0xffffff),
                    { gravity: 0.0002, decay: 0.008, size: 0.09 });
            } else if (gameMode.weather === 'petals') {
                if (Math.random() < 0.6) fwParticle(
                    new THREE.Vector3((Math.random() - 0.5) * 46, 12, (Math.random() - 0.5) * 32),
                    new THREE.Vector3((Math.random() - 0.5) * 0.04, -0.04, 0), new THREE.Color(0xffb7d5),
                    { gravity: 0.0003, decay: 0.006, size: 0.08 });
            }
            if (gameMode.skyTarget && scene.background && scene.background.isColor) {
                scene.background.lerp(gameMode.skyTarget.c, 0.04);
                if (gameMode.skyTarget.f && scene.fog) scene.fog.color.lerp(gameMode.skyTarget.f, 0.04);
            }
            if (gameMode.update) {
                try { gameMode.update(); } catch (err) { console.warn('game update error', err); }
            }
        }

        // ==================================================================
        // ==== LEVEL 1: KYOTO TRAIN (isometric word-driven train puzzle) ===
        // Deliver the Shogun to the palace: stop at his station, get him
        // aboard, switch off the outer line before the stalled school bus,
        // open the palace gates, and stop at the palace on the inner line.
        // ==================================================================
        function createKyotoTrainScene() {
            currentScene = 'kyoto_train';
            scene.background = new THREE.Color(0xcfe8f5);
            scene.fog = new THREE.FogExp2(0xcfe8f5, 0.004);
            const F = -5.1;
            const st = {};

            // Ground + pond
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
                new THREE.MeshPhongMaterial({ color: 0x9fca8a }));
            ground.rotation.x = -Math.PI / 2; ground.position.y = F;
            ground.receiveShadow = true; scene.add(ground);
            st.pondMat = new THREE.MeshPhongMaterial({ color: 0x3d84b8, shininess: 100, emissive: 0x000000 });
            const pond = new THREE.Mesh(new THREE.CircleGeometry(4.5, 24), st.pondMat);
            pond.rotation.x = -Math.PI / 2; pond.position.set(-12, F + 0.03, 6);
            scene.add(pond);
            st.pondPos = new THREE.Vector3(-12, F + 0.2, 6);

            // Two track lines. Outer loop passes the bus crossing; the inner
            // line cuts across in front of the palace. They share the south arc.
            st.outer = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-18, 0, -12), new THREE.Vector3(0, 0, -16),
                new THREE.Vector3(18, 0, -12), new THREE.Vector3(21, 0, 2),
                new THREE.Vector3(13, 0, 14), new THREE.Vector3(0, 0, 16),
                new THREE.Vector3(-13, 0, 14), new THREE.Vector3(-21, 0, 2)
            ], true, 'catmullrom', 0.5);
            st.inner = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-21, 0, 2), new THREE.Vector3(-13, 0, -3),
                new THREE.Vector3(0, 0, -6), new THREE.Vector3(13, 0, -3),
                new THREE.Vector3(21, 0, 2), new THREE.Vector3(13, 0, 14),
                new THREE.Vector3(0, 0, 16), new THREE.Vector3(-13, 0, 14)
            ], true, 'catmullrom', 0.5);
            st.outerL = st.outer.getLength();
            st.innerL = st.inner.getLength();
            // Rails + ties are BAKED into two merged meshes (one per material)
            // instead of ~700 individual meshes — a huge draw-call saving.
            const railBaker = makeBaker(), tieBaker = makeBaker();
            function layRails(curve) {
                const n = 120;
                const pts = curve.getSpacedPoints(n);
                for (let i = 0; i < n; i++) {
                    const p = pts[i], pn = pts[(i + 1) % n];
                    const dir = new THREE.Vector3().subVectors(pn, p);
                    const len = dir.length(); if (len < 1e-4) continue;
                    dir.normalize();
                    const yaw = Math.atan2(dir.x, dir.z);
                    const nrm = new THREE.Vector3(-dir.z, 0, dir.x);
                    const mx = (p.x + pn.x) / 2, mz = (p.z + pn.z) / 2;
                    [0.55, -0.55].forEach(off => {
                        railBaker.add(new THREE.BoxGeometry(0.14, 0.1, len * 1.1),
                            mx + nrm.x * off, F + 0.15, mz + nrm.z * off, yaw);
                    });
                    if (i % 3 === 0) tieBaker.add(new THREE.BoxGeometry(1.6, 0.08, 0.3), mx, F + 0.09, mz, yaw);
                }
            }
            layRails(st.outer); layRails(st.inner);
            railBaker.bake(new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.5, roughness: 0.5 }));
            tieBaker.bake(new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 }));

            // Clearance test so nothing spawns on the rails or in a landmark.
            const trackPts = [];
            [st.outer, st.inner].forEach(c => c.getSpacedPoints(150).forEach(p => trackPts.push(p)));
            const keepOut = [
                [0, -11, 6.5],   // palace
                [0, -8.2, 4],    // palace gates
                [0, -6, 3.5],    // palace crossing
                [0, 18.3, 5.5],  // station platform
                [-12, 6, 6],     // pond
                [15, -17, 5],    // school
                [15, -13.6, 3],  // schoolkids
                [5.5, 18.5, 3],  // torii
                [-5.5, 18.5, 2.5], // statue
                [10, -15, 5]     // bus crossing
            ];
            function isClear(x, z, trackMin) {
                for (const k of keepOut) {
                    if (Math.hypot(x - k[0], z - k[1]) < k[2]) return false;
                }
                for (const p of trackPts) {
                    if (Math.hypot(x - p.x, z - p.z) < trackMin) return false;
                }
                return true;
            }

            // Machiya townhouses: placed procedurally with clearance checks so
            // none clip the rails or landmarks, then BAKED into two meshes
            // (bodies + roofs).
            const housePts = [];
            const houseBodyBaker = makeBaker(), houseRoofBaker = makeBaker();
            let placeTries = 0;
            while (housePts.length < 15 && placeTries++ < 350) {
                const x = (Math.random() - 0.5) * 38;
                const z = (Math.random() - 0.5) * 30 - 1;
                if (!isClear(x, z, 3.6)) continue;
                if (housePts.some(h2 => Math.hypot(h2.x - x, h2.z - z) < 4.4)) continue;
                const w = 2.2 + Math.random() * 1.4, h = 1.8 + Math.random() * 1.2;
                houseBodyBaker.add(new THREE.BoxGeometry(w, h, w), x, F + h / 2, z);
                houseRoofBaker.add(new THREE.ConeGeometry(w * 0.95, h * 0.7, 4),
                    x, F + h + h * 0.35, z, Math.PI / 4);
                housePts.push({ x, z });
            }
            st.houseMesh = houseBodyBaker.bake(new THREE.MeshPhongMaterial({ color: 0xd9c7a7 }));
            st.roofMesh = houseRoofBaker.bake(new THREE.MeshPhongMaterial({ color: 0x3d4750, flatShading: true }));
            st.teahousePos = housePts.length ? new THREE.Vector3(housePts[0].x, F, housePts[0].z)
                                             : new THREE.Vector3(8, F, 6);

            // Palace (multi-tier pagoda) + gates that must be OPENED to win
            const palace = new THREE.Group();
            [[6, 2.4, 0], [4.6, 2.0, 2.4], [3.2, 1.8, 4.4]].forEach(t => {
                const tier = new THREE.Mesh(new THREE.BoxGeometry(t[0], t[1], t[0] * 0.8),
                    new THREE.MeshPhongMaterial({ color: 0xf3ead8 }));
                tier.position.y = t[2] + t[1] / 2; palace.add(tier);
                const roof = new THREE.Mesh(new THREE.ConeGeometry(t[0] * 0.85, 1.1, 4),
                    new THREE.MeshPhongMaterial({ color: 0xa33327, flatShading: true }));
                roof.position.y = t[2] + t[1] + 0.5; roof.rotation.y = Math.PI / 4; palace.add(roof);
            });
            palace.position.set(0, F, -11);
            scene.add(palace);
            st.palace = palace;
            st.gates = [];
            [-1.1, 1.1].forEach((gx, i) => {
                const gate = new THREE.Mesh(new THREE.BoxGeometry(2.1, 2.6, 0.2),
                    new THREE.MeshPhongMaterial({ color: 0x7a1f1f }));
                gate.position.set(gx, F + 1.3, -8.2);
                scene.add(gate); st.gates.push({ mesh: gate, dir: i === 0 ? -1 : 1 });
            });
            st.gatesOpen = false;

            // Torii gate near the station + samurai statue + lanterns
            const torii = new THREE.Group();
            const toriiMat = new THREE.MeshPhongMaterial({ color: 0xc23b22 });
            [-1.2, 1.2].forEach(x => {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 3, 8), toriiMat);
                post.position.set(x, 1.5, 0); torii.add(post);
            });
            const beam = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 0.36), toriiMat);
            beam.position.y = 3; torii.add(beam);
            const beam2 = new THREE.Mesh(new THREE.BoxGeometry(3, 0.22, 0.3), toriiMat);
            beam2.position.y = 2.3; torii.add(beam2);
            torii.position.set(5.5, F, 18.5);
            scene.add(torii);
            st.torii = torii; st.toriiMat = toriiMat;
            const statue = makeBoxMan(0x6a7d8a, 0x8a9aa8);
            statue.scale.setScalar(1.4);
            statue.position.set(-5.5, F, 18.5);
            scene.add(statue);
            st.statue = statue;
            st.lanterns = [];
            [[-3, 17.5], [3, 17.5], [-16, 2], [16, 2], [-3, -8.5], [3, -8.5]].forEach(lp => {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 1.6, 6),
                    new THREE.MeshPhongMaterial({ color: 0x333333 }));
                post.position.set(lp[0], F + 0.8, lp[1]); scene.add(post);
                const lampMat = new THREE.MeshPhongMaterial({ color: 0xf7e8c0, emissive: 0x000000 });
                const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), lampMat);
                lamp.position.set(lp[0], F + 1.75, lp[1]); scene.add(lamp);
                st.lanterns.push(lampMat);
            });
            st.lanternsOn = false;

            // Station platform + waiting Shogun
            const platform = new THREE.Mesh(new THREE.BoxGeometry(7, 0.5, 2.2),
                new THREE.MeshPhongMaterial({ color: 0x8d8d8d }));
            platform.position.set(0, F + 0.25, 18.3);
            scene.add(platform);
            st.stationPos = new THREE.Vector3(0, F, 16);
            const shogun = makeBoxMan(0x24365c, 0xd4af37);
            shogun.position.set(1.4, F + 0.5, 18.2);
            scene.add(shogun);
            st.shogun = shogun; st.aboard = false;

            // School + kids near the outer line (WHISTLE makes them step back)
            const school = new THREE.Group();
            const sBody = new THREE.Mesh(new THREE.BoxGeometry(4, 2.4, 3),
                new THREE.MeshPhongMaterial({ color: 0xe8d28a }));
            sBody.position.y = 1.2; school.add(sBody);
            const sRoof = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.4, 4),
                new THREE.MeshPhongMaterial({ color: 0x8a4b32, flatShading: true }));
            sRoof.position.y = 3.1; sRoof.rotation.y = Math.PI / 4; school.add(sRoof);
            school.position.set(15, F, -17);
            scene.add(school);
            st.kids = [];
            for (let i = 0; i < 3; i++) {
                const kid = makeBoxMan([0xd45050, 0x50a0d4, 0xd4c050][i], 0xf2e14c);
                kid.scale.setScalar(0.55);
                kid.position.set(15 + (i - 1) * 1.4, F, -13.6);
                scene.add(kid);
                st.kids.push({ mesh: kid, baseZ: -13.6 });
            }
            st.kidsPos = new THREE.Vector3(15, F, -13.6);
            st.whistleT = 0; st.schoolWarned = false;

            // The stalled school bus on the outer line's north crossing
            const bus = new THREE.Group();
            const busBody = new THREE.Mesh(new THREE.BoxGeometry(5, 1.8, 1.9),
                new THREE.MeshPhongMaterial({ color: 0xf2b01e }));
            busBody.position.y = 1.3; bus.add(busBody);
            const busStripe = new THREE.Mesh(new THREE.BoxGeometry(5.02, 0.5, 1.92),
                new THREE.MeshPhongMaterial({ color: 0x222222 }));
            busStripe.position.y = 1.6; bus.add(busStripe);
            [[-1.8, 1], [1.8, 1], [-1.8, -1], [1.8, -1]].forEach(wp => {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 10),
                    new THREE.MeshPhongMaterial({ color: 0x111111 }));
                wheel.rotation.x = Math.PI / 2;
                wheel.position.set(wp[0], 0.42, wp[1] * 0.95); bus.add(wheel);
            });
            // Parked on the outer line's north-east crossing, near the school
            // (clear of the palace so the two never visually collide).
            st.busBaseX = 10;
            bus.position.set(st.busBaseX, F, -15);
            bus.rotation.y = 0.5;
            scene.add(bus);
            st.bus = bus; st.busHome = 0; st.busAway = 0;
            st.busPos = new THREE.Vector3(st.busBaseX, F, -15);

            // Cherry trees: procedural clearance placement; trunks + foliage
            // baked into ONE mesh each. The foliage material gets a wind-sway
            // vertex shader (onBeforeCompile) so every tree gently waves —
            // zero per-frame JS cost. Season 0 = spring pink.
            st.season = 0;
            st.trees = [];
            const trunkBaker = makeBaker(), leafBaker = makeBaker();
            placeTries = 0;
            while (st.trees.length < 16 && placeTries++ < 450) {
                const x = (Math.random() - 0.5) * 46;
                const z = (Math.random() - 0.5) * 38 - 1;
                if (!isClear(x, z, 3.0)) continue;
                if (housePts.some(h2 => Math.hypot(h2.x - x, h2.z - z) < 3.4)) continue;
                if (st.trees.some(t => Math.hypot(t.pos.x - x, t.pos.z - z) < 3.4)) continue;
                trunkBaker.add(new THREE.CylinderGeometry(0.18, 0.3, 2.2, 6), x, F + 1.1, z);
                for (let i = 0; i < 3; i++) {
                    leafBaker.add(new THREE.SphereGeometry(0.9 + Math.random() * 0.5, 7, 5),
                        x + (Math.random() - 0.5) * 1.2, F + 2.4 + Math.random() * 0.9,
                        z + (Math.random() - 0.5) * 1.2);
                }
                st.trees.push({ pos: new THREE.Vector3(x, F, z), mat: null });
            }
            trunkBaker.bake(new THREE.MeshPhongMaterial({ color: 0x6b4a2f }));
            st.leafShaderStore = {};
            const kyotoLeafMat = makeWindyMaterial(
                new THREE.MeshPhongMaterial({ color: 0xffb7d5 }), F + 1.8, st.leafShaderStore);
            st.leafMesh = leafBaker.bake(kyotoLeafMat);
            st.trees.forEach(t => { t.mat = kyotoLeafMat; });
            st.windBoost = 0;

            // Hidden extras for doodads: Mt Fuji + a moon
            const fuji = new THREE.Mesh(new THREE.ConeGeometry(26, 34, 5),
                new THREE.MeshPhongMaterial({ color: 0x7d8ba8, flatShading: true }));
            const fujiCap = new THREE.Mesh(new THREE.ConeGeometry(9, 10, 5),
                new THREE.MeshPhongMaterial({ color: 0xffffff, flatShading: true }));
            fujiCap.position.y = 12.5; fuji.add(fujiCap);
            fuji.position.set(-55, F, -85);
            fuji.scale.setScalar(0.001); fuji.visible = false;
            scene.add(fuji);
            st.fuji = fuji; st.fujiUp = false;
            const moon = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 12),
                new THREE.MeshBasicMaterial({ color: 0xf5efc9 }));
            moon.position.set(40, -20, -70); moon.visible = false;
            scene.add(moon);
            st.moon = moon; st.moonUp = false;

            // The train: engine + tender + caboose (script-driven, no physics)
            st.cars = []; st.wheels = [];
            function makeTrainCar(len, h, color, isEngine) {
                const g = new THREE.Group();
                if (isEngine) {
                    const boilerGeo = new THREE.CylinderGeometry(0.55, 0.55, len * 0.6, 12);
                    boilerGeo.rotateX(Math.PI / 2);
                    const boiler = new THREE.Mesh(boilerGeo,
                        new THREE.MeshStandardMaterial({ color: color, metalness: 0.4, roughness: 0.5 }));
                    boiler.position.set(0, 0.95, len * 0.1); g.add(boiler);
                    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.3, h, len * 0.35),
                        new THREE.MeshStandardMaterial({ color: 0x25313a, roughness: 0.7 }));
                    cab.position.set(0, 0.5 + h / 2, -len * 0.28); g.add(cab);
                    const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 0.8, 8),
                        new THREE.MeshStandardMaterial({ color: 0x111111 }));
                    chimney.position.set(0, 1.7, len * 0.3); g.add(chimney);
                    st.chimneyOffset = new THREE.Vector3(0, 2.1, len * 0.3);
                } else {
                    const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, h, len),
                        new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 }));
                    body.position.y = 0.5 + h / 2; g.add(body);
                }
                [-len * 0.3, len * 0.3].forEach(zz => {
                    [0.62, -0.62].forEach(xx => {
                        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.16, 10);
                        wheelGeo.rotateZ(Math.PI / 2);
                        const wheel = new THREE.Mesh(wheelGeo,
                            new THREE.MeshStandardMaterial({ color: 0x0a0a0a }));
                        wheel.position.set(xx, 0.3, zz); g.add(wheel);
                        st.wheels.push(wheel);
                    });
                });
                g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
                scene.add(g);
                return g;
            }
            st.cars.push(makeTrainCar(3.4, 1.1, 0x2c5545, true));
            st.cars.push(makeTrainCar(2.6, 0.9, 0x222222, false));
            st.cars.push(makeTrainCar(3.0, 1.1, 0xa33327, false));
            st.carGap = 3.6;

            // Sim state
            st.line = 'outer';
            st.u = nearestU(st.outer, new THREE.Vector3(21, 0, 2));
            st.startU = st.u;
            st.spd = 0; st.mult = 1; st.dir = 1; st.vel = 0;
            st.fuel = 1; st.shake = 0; st.crashCd = 0;
            st.stationHinted = false; st.palaceHinted = false;

            const enginePos = () => st.cars[0].position;
            function whistle() {
                beeps([[620, 0.35, 0, 'triangle', 0.2], [830, 0.5, 240, 'triangle', 0.2]]);
                if (st.chimneyOffset) puffBurst(
                    enginePos().clone().add(new THREE.Vector3(0, 2.2, 0)), 0xeeeeee, 10, 0.6,
                    { gravity: -0.0006, decay: 0.02, size: 0.09 });
            }
            function crash() {
                st.spd = 0; st.vel = 0; st.shake = 26; st.crashCd = 90;
                puffBurst(st.busPos.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff7733, 26, 2.2,
                    { gravity: 0.002, decay: 0.03 });
                beeps([[120, 0.6, 0, 'sawtooth', 0.3], [70, 0.8, 120, 'sawtooth', 0.3]]);
                st.u = st.startU; st.line = 'outer';
                gameMsg('CRASH! The school bus was stalled on the OUTER line. Train reset — try the points…', 6000);
            }
            // Victory sequence: the Shogun dismounts, walks through the open
            // gates under a petal storm while the camera pushes in.
            function kyotoFinale() {
                if (gameMode.won) return;
                const cab = st.cars[st.cars.length - 1];
                const from = new THREE.Vector3(cab.position.x, F, cab.position.z);
                st.aboard = false;
                st.shogun.position.copy(from);
                st.shogun.rotation.y = Math.atan2(0 - from.x, -8.4 - from.z);
                tween(3000, k => {
                    st.shogun.position.lerpVectors(from, new THREE.Vector3(0, F, -8.6), k);
                    st.shogun.position.y = F + Math.abs(Math.sin(k * Math.PI * 8)) * 0.12;
                }, () => tween(1100, k => { st.shogun.rotation.x = Math.sin(k * Math.PI) * 0.55; }));
                setWeather('petals');
                for (let i = 0; i < 6; i++) setTimeout(() =>
                    puffBurst(new THREE.Vector3((Math.random() - 0.5) * 16, F + 5 + Math.random() * 4, -11 + (Math.random() - 0.5) * 6),
                        0xffb7d5, 16, 3, { gravity: 0.0004, decay: 0.01, size: 0.09 }), i * 300);
                st.winCam = true;
                gameWin('THE SHOGUN REACHES THE PALACE');
            }

            setGameMode({
                name: 'KYOTO TRAIN',
                words: expandWords({
                    // ---- state advancers -------------------------------------
                    'GO|START|CHOO|DEPART|ONWARD': () => {
                        if (st.crashCd > 0) { gameMsg('The crew is still dusting off…'); return; }
                        if (st.fuel <= 0) { gameMsg('No steam — the coal is spent. STOKE the firebox.'); return; }
                        st.spd = 1; whistle(); gameMsg('The little engine chuffs forward.');
                    },
                    'STOP|HALT|BRAKE': () => {
                        st.spd = 0;
                        const d = enginePos().distanceTo(st.stationPos);
                        if (d < 6 && !st.aboard) gameMsg('Stopped at the station. The SHOGUN awaits your word…');
                        else gameMsg('Brakes squeal. The train halts.');
                        gameBeep(220, 0.4, 'sawtooth', 0.12);
                    },
                    'FAST|HURRY|EXPRESS': () => { st.mult = 1.8; gameMsg('Full steam ahead!'); },
                    'SLOW|EASY|GENTLE': () => { st.mult = 0.6; gameMsg('Easing off the throttle.'); },
                    'SWITCH|POINTS|TRACKS': () => {
                        const to = st.line === 'outer' ? 'inner' : 'outer';
                        const curve = to === 'inner' ? st.inner : st.outer;
                        st.u = nearestU(curve, enginePos());
                        st.line = to;
                        beeps([[300, 0.08, 0, 'square', 0.15], [260, 0.08, 90, 'square', 0.15]]);
                        gameMsg('Clack! Points switched — now on the ' + to.toUpperCase() + ' line.');
                    },
                    'REVERSE|BACK': () => { st.dir *= -1; gameMsg('Reversing gear engaged.'); },
                    'SHOGUN': () => {
                        const d = enginePos().distanceTo(st.stationPos);
                        if (!st.aboard && st.spd === 0 && Math.abs(st.vel) < 0.0002 && d < 6) {
                            st.aboard = true;
                            gameMsg('The Shogun bows and boards the caboose!', 5000);
                            beeps([[523, 0.2, 0, 'triangle', 0.2], [659, 0.3, 180, 'triangle', 0.2]]);
                        } else if (st.aboard) {
                            gameMsg('The Shogun rides with quiet dignity.');
                            tween(700, k => { st.shogun.rotation.x = Math.sin(k * Math.PI) * 0.5; });
                        } else {
                            gameMsg('The Shogun bows from the southern station. Stop there for him.');
                            tween(700, k => { st.shogun.rotation.x = Math.sin(k * Math.PI) * 0.5; });
                        }
                    },
                    'PALACE|GATES|OPEN': () => {
                        if (!st.gatesOpen) {
                            st.gatesOpen = true;
                            st.gates.forEach(g2 => tween(1400, k => {
                                g2.mesh.position.x = g2.dir * (1.1 + k * 1.6);
                                g2.mesh.rotation.y = g2.dir * k * 0.9;
                            }));
                            gameBeep(392, 0.6, 'triangle', 0.18);
                            gameMsg('The palace gates swing open!');
                        } else gameMsg('The gates already stand open, awaiting the Shogun.');
                    },
                    'BUS': () => {
                        beeps([[310, 0.25, 0, 'square', 0.22], [310, 0.25, 320, 'square', 0.22]]);
                        if (st.busAway <= 0) {
                            st.busAway = 650;
                            tween(1500, k => { st.bus.position.x = st.busBaseX + k * 15; });
                            gameMsg('The driver restarts the bus — the crossing clears for a moment!');
                        } else gameMsg('The bus honks back cheerfully.');
                    },
                    'WHISTLE|HORN': () => {
                        whistle();
                        st.whistleT = 620;
                        st.kids.forEach(k2 => tween(900, t =>
                            k2.mesh.position.z = k2.baseZ - t * 2.2));
                        gameMsg('WHOO-WHOO! The schoolchildren step well back from the line.');
                    },
                    'STOKE|COAL|FIRE': () => {
                        st.fuel = 1;
                        puffBurst(enginePos().clone().add(new THREE.Vector3(0, 1.5, 0)), 0xff8833, 12, 0.8,
                            { gravity: -0.0004, decay: 0.03, size: 0.06 });
                        gameMsg('Coal shoveled — the firebox roars back to life.');
                    },
                    // ---- doodads (react, but do not advance the game) --------
                    'TREE|TREES|SAKURA': () => cycleSeason(st),
                    'CHERRY|BLOSSOM|HANAMI|PETALS': () => {
                        if (gameMode.weather === 'petals') { setWeather(null); gameMsg('The petal-fall settles.'); }
                        else { setWeather('petals'); gameMsg('Cherry blossoms drift over the city…'); }
                    },
                    'RAIN': () => { setWeather('rain'); skyTo(0x8fa8bd, 0x8fa8bd); gameMsg('A soft rain falls on Kyoto.'); },
                    'SNOW': () => { setWeather('snow'); skyTo(0xdfe8f2, 0xdfe8f2); gameMsg('Snow hushes the rooftops.'); },
                    'SUN|CLEAR': () => { setWeather(null); skyTo(0xcfe8f5, 0xcfe8f5); gameMsg('The sky clears to blue.'); },
                    'NIGHT': () => {
                        skyTo(0x141c33, 0x141c33);
                        st.lanternsOn = true;
                        st.lanterns.forEach(l => l.emissive.setHex(0xffaa44));
                        gameMsg('Dusk falls; the lanterns glow warm.');
                    },
                    'DAY|DAWN|MORNING': () => {
                        skyTo(0xcfe8f5, 0xcfe8f5);
                        st.lanternsOn = false;
                        st.lanterns.forEach(l => l.emissive.setHex(0x000000));
                        st.moon.visible = false; st.moonUp = false;
                        gameMsg('Morning light returns.');
                    },
                    'FOG|MIST': () => {
                        tween(7000, k => { if (scene.fog) scene.fog.density = 0.004 + Math.sin(k * Math.PI) * 0.02; });
                        gameMsg('Mist curls through the streets…');
                    },
                    'WIND|GUST|BREEZE': () => {
                        st.windBoost = 4; // gusts the foliage wind shader
                        for (let i = 0; i < 22; i++) fwParticle(
                            new THREE.Vector3(-20 + Math.random() * 8, F + 2 + Math.random() * 5, (Math.random() - 0.5) * 26),
                            new THREE.Vector3(0.25 + Math.random() * 0.1, 0.01, 0),
                            new THREE.Color(0xffb7d5), { gravity: 0.0002, decay: 0.012, size: 0.07 });
                        gameMsg('A gust sweeps petals across the rooftops.');
                    },
                    'BIRD|BIRDS|CRANE': () => { birdsAcross(9); gameMsg('Cranes wheel over the city.'); },
                    'CAT': () => {
                        const cat = new THREE.Group();
                        const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.3),
                            new THREE.MeshPhongMaterial({ color: 0x333333 }));
                        body.position.y = 0.15; cat.add(body);
                        const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.5, 5),
                            new THREE.MeshPhongMaterial({ color: 0x333333 }));
                        tail.position.set(-0.4, 0.35, 0); tail.rotation.z = 0.7; cat.add(tail);
                        flyby(cat, new THREE.Vector3(-12, F + 3.4, -1), new THREE.Vector3(12, F + 3.4, -1), 3600, { bob: true });
                        beeps([[900, 0.15, 0, 'sine', 0.12], [700, 0.2, 180, 'sine', 0.1]]);
                        gameMsg('A rooftop cat trots by, unimpressed.');
                    },
                    'BELL|TEMPLE': () => {
                        gameBeep(98, 1.8, 'sine', 0.3);
                        tween(1800, k => st.palace.scale.setScalar(1 + Math.sin(k * Math.PI) * 0.03));
                        gameMsg('A temple bell tolls, deep and slow.');
                    },
                    'DRUM|TAIKO': () => {
                        beeps([[80, 0.2, 0, 'sine', 0.35], [80, 0.2, 250, 'sine', 0.35], [60, 0.35, 500, 'sine', 0.4]]);
                        [st.houseMesh, st.roofMesh].forEach((m, i) => {
                            if (m) tween(700 + i * 80, k =>
                                m.position.y = Math.abs(Math.sin(k * Math.PI * 2)) * 0.22 * (1 - k));
                        });
                        gameMsg('Taiko drums — the whole town bounces!');
                    },
                    'LANTERN|LANTERNS|LIGHT': () => {
                        st.lanternsOn = !st.lanternsOn;
                        st.lanterns.forEach(l => l.emissive.setHex(st.lanternsOn ? 0xffaa44 : 0x000000));
                        gameMsg(st.lanternsOn ? 'Paper lanterns flicker alight.' : 'The lanterns are snuffed out.');
                    },
                    'HANABI|FIREWORK|FIREWORKS': () => {
                        detonateFirework(new THREE.Vector3(0, 12, -11));
                        gameMsg('Hanabi! Fireworks bloom over the palace.');
                    },
                    'KOI|FISH': () => {
                        const koi = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 6),
                            new THREE.MeshPhongMaterial({ color: 0xff7733 }));
                        koi.rotation.z = Math.PI / 2;
                        flyby(koi, st.pondPos.clone().add(new THREE.Vector3(-1.5, 0, 0)),
                            st.pondPos.clone().add(new THREE.Vector3(1.5, 0, 0)), 900, { arc: 2 });
                        puffBurst(st.pondPos, 0x66ccff, 10, 1.2, { decay: 0.03 });
                        gameMsg('A koi leaps, flashing orange.');
                    },
                    'GARDEN|FLOWER|FLOWERS': () => {
                        for (let i = 0; i < 4; i++) puffBurst(
                            new THREE.Vector3((Math.random() - 0.5) * 8, F + 0.5, -8 + (Math.random() - 0.5) * 4),
                            () => [0xff6b9d, 0xffd166, 0xa78bfa, 0xff8fa3][Math.floor(Math.random() * 4)],
                            8, 1.5, { gravity: 0.0008, decay: 0.014, size: 0.08 });
                        gameMsg('The palace garden bursts into bloom.');
                    },
                    'TEA': () => {
                        puffBurst(st.teahousePos.clone().add(new THREE.Vector3(0, 3.4, 0)),
                            0xffffff, 8, 0.5, { gravity: -0.0008, decay: 0.012, size: 0.07 });
                        gameMsg('Steam rises from the teahouse. The kettle sings.');
                        gameBeep(1200, 0.5, 'sine', 0.06);
                    },
                    'NINJA': () => {
                        const ninja = makeBoxMan(0x1a1a1a, 0x1a1a1a);
                        ninja.scale.setScalar(0.7);
                        flyby(ninja, new THREE.Vector3(14, F + 3.2, 6), new THREE.Vector3(-14, F + 3.2, 6), 1400, { arc: 1.5 });
                        gameBeep(2000, 0.12, 'sawtooth', 0.05);
                        gameMsg('…did a shadow just cross the rooftops?');
                    },
                    'MONK': () => {
                        const monk = makeBoxMan(0x7a5230, null);
                        monk.scale.setScalar(0.8);
                        flyby(monk, new THREE.Vector3(-10, F, -6), new THREE.Vector3(4, F, -8.5), 9000, { bob: true });
                        gameBeep(880, 1.2, 'sine', 0.08);
                        gameMsg('A monk walks the palace path, bell chiming softly.');
                    },
                    'TORII': () => {
                        tween(2000, k => {
                            const e = Math.sin(k * Math.PI) * 0.6;
                            st.toriiMat.emissive = st.toriiMat.emissive || new THREE.Color(0);
                            st.toriiMat.emissive.setRGB(e, e * 0.15, e * 0.1);
                        });
                        gameMsg('The torii gate glows vermilion.');
                    },
                    'SMOKE|STEAM': () => {
                        for (let i = 0; i < 3; i++) setTimeout(() =>
                            puffBurst(enginePos().clone().add(new THREE.Vector3(0, 2.2, 0)), 0xdddddd, 8, 0.4,
                                { gravity: -0.0008, decay: 0.012, size: 0.11 }), i * 220);
                        gameMsg('The engine blows proud smoke rings.');
                    },
                    'STAR|STARS': () => {
                        for (let i = 0; i < 14; i++) fwParticle(
                            new THREE.Vector3((Math.random() - 0.5) * 40, 12 + Math.random() * 8, -10 - Math.random() * 10),
                            new THREE.Vector3(0, 0, 0), new THREE.Color(0xffffff),
                            { gravity: 0, decay: 0.01, size: 0.1 });
                        gameMsg('Stars prickle awake above the hills.');
                    },
                    'FUJI|MOUNTAIN': () => {
                        st.fujiUp = !st.fujiUp;
                        st.fuji.visible = true;
                        const from = st.fujiUp ? 0.001 : 1, to = st.fujiUp ? 1 : 0.001;
                        tween(2200, k => st.fuji.scale.setScalar(from + (to - from) * k),
                            () => { if (!st.fujiUp) st.fuji.visible = false; });
                        gameMsg(st.fujiUp ? 'The clouds part — Mount Fuji stands on the horizon.' : 'Fuji slips back behind the haze.');
                    },
                    'MOON': () => {
                        st.moonUp = !st.moonUp;
                        st.moon.visible = true;
                        const fy = st.moonUp ? -20 : 26, ty = st.moonUp ? 26 : -20;
                        tween(2600, k => st.moon.position.y = fy + (ty - fy) * k,
                            () => { if (!st.moonUp) st.moon.visible = false; });
                        gameMsg(st.moonUp ? 'A pale moon climbs the sky.' : 'The moon sets beyond the hills.');
                    },
                    'QUAKE|EARTHQUAKE|RUMBLE': () => {
                        st.shake = 20;
                        gameBeep(40, 1.2, 'sawtooth', 0.25);
                        gameMsg('The ground shivers… just a small one.');
                    }
                }),
                update: () => {
                    const curve = st.line === 'outer' ? st.outer : st.inner;
                    const L = st.line === 'outer' ? st.outerL : st.innerL;

                    // Timers
                    if (st.crashCd > 0) st.crashCd -= timeScale;
                    if (st.whistleT > 0) {
                        st.whistleT -= timeScale;
                        if (st.whistleT <= 0) st.kids.forEach(k2 =>
                            tween(900, t => k2.mesh.position.z = k2.baseZ - 2.2 + t * 2.2));
                    }
                    if (st.busAway > 0) {
                        st.busAway -= timeScale;
                        if (st.busAway <= 0) tween(1500, k => { st.bus.position.x = st.busBaseX + 15 - k * 15; });
                    }

                    // Speed with school-zone crawl + coal burn
                    let mult = st.mult;
                    const ep = enginePos();
                    const nearKids = ep.distanceTo(st.kidsPos) < 9;
                    if (nearKids && st.whistleT <= 0 && st.spd > 0) {
                        mult = Math.min(mult, 0.35);
                        if (!st.schoolWarned) {
                            st.schoolWarned = true;
                            gameMsg('Children near the line — the driver crawls. A WHISTLE would warn them.');
                        }
                    } else if (!nearKids) st.schoolWarned = false;
                    if (st.spd > 0 && st.fuel > 0) {
                        st.fuel = Math.max(0, st.fuel - 0.00035 * timeScale);
                        if (st.fuel <= 0) { st.spd = 0; gameMsg('The coal is spent! STOKE the firebox to raise steam.'); }
                    }
                    const targetVel = st.spd * (0.075 * mult * st.dir) / L;
                    st.vel += (targetVel - st.vel) * 0.06 * timeScale;
                    st.u = ((st.u + st.vel * timeScale) % 1 + 1) % 1;

                    // Place cars along the active curve
                    const du = st.carGap / L;
                    st.cars.forEach((car, k) => {
                        let u = ((st.u - k * du) % 1 + 1) % 1;
                        const p = curve.getPointAt(u);
                        const t2 = curve.getTangentAt(u);
                        car.position.set(p.x, F, p.z);
                        car.rotation.y = Math.atan2(t2.x * st.dir, t2.z * st.dir);
                    });
                    st.wheels.forEach(w => { w.rotation.x += st.vel * L * 0.5 * timeScale; });
                    if (Math.abs(st.vel) * L > 0.02 && Math.random() < 0.25)
                        fwParticle(ep.clone().add(new THREE.Vector3(0, 2.2, 0)),
                            new THREE.Vector3(0, 0.05, 0), new THREE.Color(0xcccccc),
                            { gravity: -0.0005, decay: 0.03, size: 0.08 });

                    // Shogun rides the caboose
                    if (st.aboard) {
                        const cab = st.cars[st.cars.length - 1];
                        st.shogun.position.set(cab.position.x, F + 1.6, cab.position.z);
                        st.shogun.rotation.y = cab.rotation.y;
                    }

                    // Crash into the bus (outer line only, while it blocks)
                    if (st.line === 'outer' && st.busAway <= 0 && Math.abs(st.vel) * L > 0.01 &&
                        ep.distanceTo(st.busPos) < 4.5 && st.crashCd <= 0) crash();

                    // Station hint
                    if (!st.aboard && !st.stationHinted && ep.distanceTo(st.stationPos) < 6 &&
                        st.spd === 0 && Math.abs(st.vel) < 0.0002) {
                        st.stationHinted = true;
                        gameMsg('The station master salutes. Someone important is waiting…');
                    }

                    // Win: Shogun aboard, gates open, stopped at the palace
                    // crossing. Hints REPEAT (every ~6s) so the last step is
                    // never a mystery, and being stopped nearby on the wrong
                    // line gets its own nudge.
                    const palaceStop = new THREE.Vector3(0, F, -6);
                    const isStopped = st.spd === 0 && Math.abs(st.vel) < 0.0002;
                    st.palaceHintT = Math.max(0, (st.palaceHintT || 0) - timeScale);
                    if (st.aboard && isStopped && !gameMode.won) {
                        if (ep.distanceTo(palaceStop) < 7) {
                            if (st.gatesOpen) kyotoFinale();
                            else if (st.palaceHintT <= 0) {
                                st.palaceHintT = 380;
                                gameMsg('You have arrived — but the PALACE gates are shut tight.', 5500);
                            }
                        } else if (ep.distanceTo(st.palace.position) < 11 && st.line === 'outer' &&
                                   st.palaceHintT <= 0) {
                            st.palaceHintT = 380;
                            gameMsg('So close! The palace crossing is on the INNER line — SWITCH the points.', 5500);
                        }
                    }

                    // Foliage wind shader: time + gust decay (WIND doodad)
                    if (st.windBoost > 0) st.windBoost = Math.max(0, st.windBoost - 0.02 * timeScale);
                    if (st.leafShaderStore && st.leafShaderStore.shader) {
                        st.leafShaderStore.shader.uniforms.uTime.value = Date.now() * 0.001;
                        st.leafShaderStore.shader.uniforms.uWind.value = 1 + st.windBoost;
                    }
                    // Pond shimmer
                    if (st.pondMat) st.pondMat.emissive.setScalar(0.05 + Math.sin(Date.now() * 0.0016) * 0.04);

                    // Isometric camera with a gentle follow + crash shake;
                    // after the win it pushes in on the palace celebration.
                    if (st.winCam) {
                        targetCameraPos.set(11, 13, 6);
                        targetCameraLookAt.set(0, F + 2.5, -10);
                    } else {
                        targetCameraPos.set(ep.x * 0.22 + 27, 25, ep.z * 0.22 + 27);
                        targetCameraLookAt.set(ep.x * 0.4, F + 1, ep.z * 0.4);
                    }
                    if (st.shake > 0) {
                        st.shake -= timeScale;
                        targetCameraPos.x += (Math.random() - 0.5) * 1.4;
                        targetCameraPos.y += (Math.random() - 0.5) * 1.4;
                    }

                    const coal = Math.round(st.fuel * 100);
                    gameStatus(gameMode.won
                        ? '★ COMPLETE — the Shogun is home. Words still play!'
                        : 'coal ' + coal + '% · ' + st.line.toUpperCase() + ' line · ' +
                          (st.aboard ? 'Shogun ABOARD' : 'Shogun at the station') +
                          (st.gatesOpen ? ' · gates OPEN' : ''));
                }
            });
            setObjective('KYOTO TRAIN',
                'Deliver the Shogun to the palace. The engine obeys plain words — tell it what to do. ' +
                'Mind what blocks the outer line, and closed doors help no one.');
            gameMode.weather = 'petals'; // gentle spring ambience (CHERRY toggles)
        }

        // ==================================================================
        // ==== LEVEL 2: FLIGHT SIM (word-driven cross-country hop) =========
        // Pick a destination city, take off, steer with words, then get the
        // GEAR down and FLAPS out to land on its runway.
        // ==================================================================
        function createFlightSimScene() {
            currentScene = 'flight_sim';
            scene.background = new THREE.Color(0x9fd4f5);
            scene.fog = new THREE.FogExp2(0x9fd4f5, 0.0035);
            const F = -5.1;
            const st = {};

            // Rolling countryside
            const terrGeo = new THREE.PlaneGeometry(600, 600, 60, 60);
            terrGeo.rotateX(-Math.PI / 2);
            const tv = terrGeo.attributes.position.array;
            for (let i = 0; i < tv.length; i += 3) {
                const x = tv[i], z = tv[i + 2];
                if (Math.hypot(x, z) > 30) tv[i + 1] = Math.sin(x * 0.03) * Math.cos(z * 0.04) * 2.2;
            }
            terrGeo.computeVertexNormals();
            const terrain = new THREE.Mesh(terrGeo,
                new THREE.MeshPhongMaterial({ color: 0x7fb069, flatShading: true }));
            terrain.position.y = F; scene.add(terrain);

            // Home airfield
            function makeRunway(x, z, yaw) {
                const rw = new THREE.Mesh(new THREE.PlaneGeometry(6, 26),
                    new THREE.MeshPhongMaterial({ color: 0x555555 }));
                rw.rotation.x = -Math.PI / 2; rw.rotation.z = yaw || 0;
                rw.position.set(x, F + 0.06, z); scene.add(rw);
                for (let i = -2; i <= 2; i++) {
                    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 2.4),
                        new THREE.MeshBasicMaterial({ color: 0xffffff }));
                    stripe.rotation.x = -Math.PI / 2;
                    stripe.position.set(x + Math.sin(yaw || 0) * i * 5, F + 0.07, z + Math.cos(yaw || 0) * i * 5);
                    scene.add(stripe);
                }
                return rw;
            }
            makeRunway(0, 0, 0);
            const towerBase = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 6, 8),
                new THREE.MeshPhongMaterial({ color: 0xdddddd }));
            towerBase.position.set(7, F + 3, 4); scene.add(towerBase);
            const towerTop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.2, 2.4),
                new THREE.MeshPhongMaterial({ color: 0x88bbdd, emissive: 0x000000 }));
            towerTop.position.set(7, F + 6.6, 4); scene.add(towerTop);
            st.towerTop = towerTop;

            // Destination cities on the four compass points
            st.cities = [
                { name: 'OSAKA', pos: new THREE.Vector3(0, F, -115), dirTxt: 'N', color: 0xd45d79 },
                { name: 'PARIS', pos: new THREE.Vector3(115, F, 0), dirTxt: 'E', color: 0x6c8dd6 },
                { name: 'CAIRO', pos: new THREE.Vector3(0, F, 115), dirTxt: 'S', color: 0xd6a44f },
                { name: 'RIO', pos: new THREE.Vector3(-115, F, 0), dirTxt: 'W', color: 0x53b57e }
            ];
            st.cities.forEach(c => {
                for (let i = 0; i < 9; i++) {
                    const h = 3 + Math.random() * 9;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(2.5 + Math.random() * 2, h, 2.5 + Math.random() * 2),
                        new THREE.MeshPhongMaterial({ color: c.color }));
                    b.position.set(c.pos.x + (Math.random() - 0.5) * 26, F + h / 2, c.pos.z + (Math.random() - 0.5) * 26);
                    scene.add(b);
                }
                makeRunway(c.pos.x, c.pos.z, Math.atan2(c.pos.x, c.pos.z));
                const label = makeTextLabel(c.name, 4, 0xffffff);
                label.position.set(c.pos.x, F + 16, c.pos.z);
                label.lookAt(new THREE.Vector3(c.pos.x * 2, F + 16, c.pos.z * 2));
                scene.add(label);
                const beacon = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 60, 10, 1, true),
                    new THREE.MeshBasicMaterial({ color: 0x66ffcc, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false }));
                beacon.position.set(c.pos.x, F + 30, c.pos.z);
                beacon.visible = false; scene.add(beacon);
                c.beacon = beacon;
            });

            // Season-able forest patches + fields with cows (doodads)
            st.season = 1; // summer green
            [[30, -40], [-45, 25], [50, 45], [-30, -55], [60, -15], [-60, -30]]
                .forEach(tp => makeGameTree(new THREE.Vector3(tp[0], F, tp[1]), 0x2e8b57, st));
            st.fieldPos = new THREE.Vector3(-35, F, 45);

            // The plane
            const plane = new THREE.Group();
            const fusGeo = new THREE.CylinderGeometry(0.5, 0.35, 4.4, 10);
            fusGeo.rotateX(Math.PI / 2);
            plane.add(new THREE.Mesh(fusGeo, new THREE.MeshStandardMaterial({ color: 0xe8ecf2, metalness: 0.3, roughness: 0.5 })));
            const noseGeo = new THREE.ConeGeometry(0.42, 0.9, 10);
            noseGeo.rotateX(Math.PI / 2);
            const nose = new THREE.Mesh(noseGeo, new THREE.MeshStandardMaterial({ color: 0xc23b22 }));
            nose.position.z = 2.6; plane.add(nose);
            const wings = new THREE.Mesh(new THREE.BoxGeometry(7, 0.12, 1.3),
                new THREE.MeshStandardMaterial({ color: 0xc23b22 }));
            wings.position.z = 0.3; plane.add(wings);
            const tailW = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 0.8),
                new THREE.MeshStandardMaterial({ color: 0xc23b22 }));
            tailW.position.z = -2; plane.add(tailW);
            const tailF = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.9),
                new THREE.MeshStandardMaterial({ color: 0xe8ecf2 }));
            tailF.position.set(0, 0.5, -2); plane.add(tailF);
            const prop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.2, 0.08),
                new THREE.MeshStandardMaterial({ color: 0x222222 }));
            prop.position.z = 3.05; plane.add(prop);
            st.prop = prop;
            st.gearMeshes = [];
            [[-1, 0.6], [1, 0.6], [0, -1.6]].forEach(gp => {
                const leg = new THREE.Group();
                const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 6),
                    new THREE.MeshStandardMaterial({ color: 0x333333 }));
                strut.position.y = -0.25; leg.add(strut);
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.15, 8),
                    new THREE.MeshStandardMaterial({ color: 0x111111 }));
                wheel.rotation.z = Math.PI / 2; wheel.position.y = -0.55; leg.add(wheel);
                leg.position.set(gp[0], -0.4, gp[1]);
                plane.add(leg); st.gearMeshes.push(leg);
            });
            st.flapMeshes = [];
            [-2.2, 2.2].forEach(x => {
                const flap = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.5),
                    new THREE.MeshStandardMaterial({ color: 0x8a1f14 }));
                flap.position.set(x, -0.02, -0.35); plane.add(flap); st.flapMeshes.push(flap);
            });
            plane.position.set(0, F + 1.0, 8);
            scene.add(plane);
            st.plane = plane;

            // Sim state
            st.phase = 'parked';       // parked -> flying -> landing -> landed
            st.heading = Math.PI;      // facing -z (north)
            st.thead = Math.PI;
            st.alt = F + 1.0; st.talt = F + 1.0;
            st.spdMult = 1; st.gear = true; st.flaps = false;
            st.autop = false; st.target = null;
            st.smoke = null; st.turb = 0;

            const fwd = () => new THREE.Vector3(Math.sin(st.heading), 0, Math.cos(st.heading));
            function bearingTo(p) {
                return Math.atan2(p.x - plane.position.x, p.z - plane.position.z);
            }
            function requireFlying(msg2) {
                if (st.phase !== 'flying') { gameMsg(msg2 || 'We are not flying yet. TAKEOFF first.'); return false; }
                return true;
            }
            function setGear(down) {
                st.gear = down;
                st.gearMeshes.forEach(g2 => tween(800, k => g2.scale.setScalar(down ? k : 1 - k + 0.001)));
                gameBeep(down ? 500 : 700, 0.2, 'square', 0.1);
            }

            setGameMode({
                name: 'FLIGHT SIM',
                words: expandWords({
                    // ---- state advancers -------------------------------------
                    'TAKEOFF|FLY': () => {
                        if (st.phase === 'flying') { gameMsg('Already airborne, captain.'); return; }
                        st.phase = 'flying'; st.talt = F + 13;
                        beeps([[200, 0.6, 0, 'sawtooth', 0.12], [320, 0.8, 500, 'sawtooth', 0.1]]);
                        gameMsg('Throttle up… rotate… we\'re flying! Pick a destination city by name.');
                        setTimeout(() => { if (gameMode && st.phase === 'flying' && st.gear) { setGear(false); gameMsg('Wheels up.'); } }, 3500);
                    },
                    'LAND|LANDING': () => {
                        if (!requireFlying('Nothing to land — we are on the ground.')) return;
                        if (!st.target) { gameMsg('Land where? Name a destination city first.'); return; }
                        const d = plane.position.distanceTo(st.target.pos);
                        if (d > 30) { gameMsg('Nothing but fields below — ' + st.target.name + ' is still ' + Math.round(d) + ' off.'); return; }
                        if (!st.gear) { gameMsg('The tower waves us off — our wheels are still up! (GEAR)'); return; }
                        if (!st.flaps) { gameMsg('Too fast to touch down. We need drag… (FLAPS)'); return; }
                        st.phase = 'landing';
                        const from = plane.position.clone();
                        const to = st.target.pos.clone().setY(F + 1.0);
                        tween(4200, k => {
                            plane.position.lerpVectors(from, to, k);
                            plane.position.y = from.y + (to.y - from.y) * (k * k);
                            st.heading = st.thead = bearingTo(st.target.pos);
                        }, () => {
                            st.phase = 'landed';
                            puffBurst(plane.position.clone(), 0xcccccc, 12, 2, { decay: 0.03 });
                            gameBeep(180, 0.5, 'sawtooth', 0.15);
                            gameWin('WELCOME TO ' + st.target.name);
                        });
                        gameMsg('Flaps out, gear down… final approach into ' + st.target.name + '.');
                    },
                    'LEFT': () => { if (requireFlying()) { st.thead += Math.PI / 4; st.autop = false; gameMsg('Banking left.'); } },
                    'RIGHT': () => { if (requireFlying()) { st.thead -= Math.PI / 4; st.autop = false; gameMsg('Banking right.'); } },
                    'TURN|AROUND': () => { if (requireFlying()) { st.thead += Math.PI; st.autop = false; gameMsg('Coming about — 180.'); } },
                    'HIGHER|CLIMB': () => { if (requireFlying()) { st.talt = Math.min(F + 30, st.talt + 5); gameMsg('Climbing.'); } },
                    'LOWER|DESCEND|DIVE': () => { if (requireFlying()) { st.talt = Math.max(F + 6, st.talt - 5); gameMsg('Descending.'); } },
                    'FAST|THROTTLE|BOOST': () => { st.spdMult = 1.9; gameMsg('Throttle to the firewall!'); },
                    'SLOW|CRUISE': () => { st.spdMult = 1; gameMsg('Easing back to cruise.'); },
                    'GEAR|WHEELS': () => {
                        setGear(!st.gear);
                        gameMsg(st.gear ? 'Gear down and locked.' : 'Gear up.');
                    },
                    'FLAPS': () => {
                        st.flaps = !st.flaps;
                        st.flapMeshes.forEach(f2 => tween(600, k => f2.rotation.x = (st.flaps ? k : 1 - k) * 0.6));
                        gameMsg(st.flaps ? 'Flaps out — slow and steady.' : 'Flaps in — clean wing.');
                    },
                    'AUTOPILOT|AUTO': () => {
                        if (!requireFlying()) return;
                        if (!st.target) { gameMsg('Autopilot needs a destination. Name a city.'); return; }
                        st.autop = !st.autop;
                        gameMsg(st.autop ? 'Autopilot ON — tracking ' + st.target.name + '.' : 'Autopilot off, hands on the yoke.');
                    },
                    'OSAKA|PARIS|CAIRO|RIO': () => {
                        // Resolved below in tryGameWords by exact key; this stub is
                        // replaced right after expandWords (kept for the found-list).
                    },
                    // ---- doodads ---------------------------------------------
                    'LOOP': () => {
                        if (!requireFlying()) return;
                        tween(1800, k => { st.plane.rotation.x = -k * Math.PI * 2; });
                        gameMsg('Loop-the-loop! The tower sighs.');
                    },
                    'ROLL|BARREL': () => {
                        if (!requireFlying()) return;
                        tween(1400, k => { st.plane.rotation.z = k * Math.PI * 2; });
                        gameMsg('A crisp barrel roll.');
                    },
                    'WAVE|WAGGLE': () => {
                        tween(1500, k => { st.plane.rotation.z = Math.sin(k * Math.PI * 4) * 0.4 * (1 - k); });
                        gameMsg('Wing-waggle hello!');
                    },
                    'SMOKE|TRAIL': () => {
                        st.smoke = st.smoke ? null : new THREE.Color().setHSL(Math.random(), 0.85, 0.6);
                        gameMsg(st.smoke ? 'Airshow smoke ON.' : 'Smoke off.');
                    },
                    'CLOUD|CLOUDS': () => {
                        for (let i = 0; i < 3; i++) {
                            const cl = new THREE.Group();
                            for (let j = 0; j < 4; j++) {
                                const puff = new THREE.Mesh(new THREE.SphereGeometry(1.4 + Math.random(), 8, 6),
                                    new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
                                puff.position.set((Math.random() - 0.5) * 3.4, (Math.random() - 0.5) * 1, (Math.random() - 0.5) * 2);
                                cl.add(puff);
                            }
                            const base = plane.position.clone().add(fwd().multiplyScalar(30 + i * 18));
                            base.y = plane.position.y + (Math.random() - 0.5) * 5;
                            base.x += (Math.random() - 0.5) * 20;
                            flyby(cl, base, base.clone().add(new THREE.Vector3(18, 0, 0)), 26000);
                        }
                        gameMsg('Puffy clouds drift by.');
                    },
                    'RAIN': () => { setWeather('rain'); skyTo(0x7d93a8, 0x7d93a8); gameMsg('Rain streaks the windscreen.'); },
                    'SNOW': () => { setWeather('snow'); skyTo(0xdfe8f2, 0xdfe8f2); gameMsg('Snow! Mind the icing.'); },
                    'STORM|THUNDER|LIGHTNING': () => {
                        setWeather('rain'); skyTo(0x4a5866, 0x4a5866);
                        setTimeout(() => { if (scene.background) scene.background.setHex(0xffffff); }, 400);
                        beeps([[60, 1.4, 500, 'sawtooth', 0.3]]);
                        gameMsg('CRACK! A storm cell rumbles past.');
                    },
                    'SUN|CLEAR': () => { setWeather(null); skyTo(0x9fd4f5, 0x9fd4f5); gameMsg('Severe clear. Beautiful flying weather.'); },
                    'NIGHT': () => { skyTo(0x101830, 0x101830); gameMsg('Night falls; the cities glitter below.'); },
                    'DAY': () => { skyTo(0x9fd4f5, 0x9fd4f5); gameMsg('Dawn paints the horizon.'); },
                    'RAINBOW': () => {
                        const rb = new THREE.Mesh(new THREE.TorusGeometry(20, 0.7, 8, 40, Math.PI),
                            new THREE.MeshBasicMaterial({ color: 0xff88cc, transparent: true, opacity: 0.5 }));
                        rb.position.set(plane.position.x, F, plane.position.z - 40);
                        scene.add(rb);
                        tween(9000, k => { rb.material.opacity = 0.5 * Math.sin(k * Math.PI); }, () => scene.remove(rb));
                        gameMsg('A rainbow arcs over the fields.');
                    },
                    'BIRD|BIRDS|FLOCK': () => { birdsAcross(plane.position.y - 3); gameMsg('A flock scatters far below.'); },
                    'BALLOON': () => {
                        const bl = new THREE.Group();
                        const env = new THREE.Mesh(new THREE.SphereGeometry(2.4, 10, 8),
                            new THREE.MeshPhongMaterial({ color: 0xd6604f }));
                        env.position.y = 3; bl.add(env);
                        const basket = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1),
                            new THREE.MeshPhongMaterial({ color: 0x8a5a2b }));
                        bl.add(basket);
                        const p0 = plane.position.clone().add(new THREE.Vector3(15, -14, -20));
                        flyby(bl, p0, p0.clone().add(new THREE.Vector3(6, 22, 0)), 14000);
                        gameMsg('A hot-air balloon rises gently.');
                    },
                    'BLIMP|ZEPPELIN': () => {
                        const zp = new THREE.Mesh(new THREE.SphereGeometry(3, 10, 8),
                            new THREE.MeshPhongMaterial({ color: 0xb0b8c4 }));
                        zp.scale.set(2.4, 1, 1);
                        const y = plane.position.y + 6;
                        flyby(zp, new THREE.Vector3(plane.position.x - 70, y, plane.position.z - 30),
                            new THREE.Vector3(plane.position.x + 70, y, plane.position.z - 30), 22000);
                        gameMsg('A blimp chugs across the sky.');
                    },
                    'UFO': () => {
                        const ufo = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 2.2, 0.7, 12),
                            new THREE.MeshStandardMaterial({ color: 0x9be89b, metalness: 0.8, roughness: 0.2 }));
                        const y = plane.position.y + 8;
                        flyby(ufo, new THREE.Vector3(plane.position.x + 60, y, plane.position.z - 40),
                            new THREE.Vector3(plane.position.x - 60, y + 6, plane.position.z - 10), 1600, { spin: true });
                        beeps([[1400, 0.1, 0, 'square', 0.08], [1800, 0.1, 110, 'square', 0.08], [1000, 0.15, 220, 'square', 0.08]]);
                        gameMsg('…nobody will believe the flight log.');
                    },
                    'COW|COWS|MOO': () => {
                        puffBurst(st.fieldPos.clone().add(new THREE.Vector3(0, 1, 0)), 0x8a5a2b, 8, 4, { decay: 0.02 });
                        gameBeep(140, 0.7, 'sawtooth', 0.14);
                        gameMsg('Somewhere below, a cow moos back.');
                    },
                    'TREE|TREES|FOREST': () => cycleSeason(st),
                    'RADIO': () => {
                        beeps([[880, 0.06, 0, 'square', 0.07], [660, 0.06, 90, 'square', 0.07],
                               [880, 0.06, 180, 'square', 0.07], [990, 0.1, 300, 'square', 0.07]]);
                        gameMsg('"…cleared as filed, keep the shiny side up." — tower');
                    },
                    'TOWER': () => {
                        tween(2400, k => st.towerTop.material.emissive.setScalar(Math.abs(Math.sin(k * Math.PI * 3)) * 0.5),
                            () => st.towerTop.material.emissive.setScalar(0));
                        gameMsg('The control tower sweeps its light.');
                    },
                    'FLARE|FLARES': () => {
                        puffBurst(plane.position.clone().add(fwd().multiplyScalar(-3)),
                            () => [0xffdd55, 0xff8833][Math.floor(Math.random() * 2)], 16, 1.5,
                            { gravity: 0.002, decay: 0.03, size: 0.09 });
                        gameMsg('Countermeasures away! (From what, exactly?)');
                    },
                    'STARS|STAR': () => {
                        for (let i = 0; i < 16; i++) fwParticle(
                            plane.position.clone().add(new THREE.Vector3((Math.random() - 0.5) * 50, 15 + Math.random() * 10, (Math.random() - 0.5) * 50)),
                            new THREE.Vector3(0, 0, 0), new THREE.Color(0xffffff), { gravity: 0, decay: 0.008, size: 0.1 });
                        gameMsg('Stars wink through the canopy.');
                    },
                    'MOON': () => {
                        const m = new THREE.Mesh(new THREE.SphereGeometry(5, 14, 10),
                            new THREE.MeshBasicMaterial({ color: 0xf5efc9 }));
                        const p0 = plane.position.clone().add(new THREE.Vector3(-60, 5, -80));
                        flyby(m, p0, p0.clone().add(new THREE.Vector3(0, 35, 0)), 12000);
                        gameMsg('The moon climbs alongside.');
                    },
                    'JET': () => {
                        const jet = new THREE.Mesh(new THREE.ConeGeometry(0.5, 3, 6),
                            new THREE.MeshStandardMaterial({ color: 0x666e78, metalness: 0.7, roughness: 0.3 }));
                        jet.rotation.z = -Math.PI / 2;
                        const y = plane.position.y + 4;
                        flyby(jet, new THREE.Vector3(plane.position.x - 90, y, plane.position.z - 15),
                            new THREE.Vector3(plane.position.x + 90, y, plane.position.z - 15), 900);
                        setTimeout(() => gameBeep(50, 0.8, 'sawtooth', 0.35), 700);
                        gameMsg('A jet streaks past — BOOM.');
                    },
                    'KITE': () => {
                        const kite = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4),
                            new THREE.MeshBasicMaterial({ color: 0xff5577, side: THREE.DoubleSide }));
                        kite.rotation.z = Math.PI / 4;
                        const p0 = st.fieldPos.clone();
                        flyby(kite, p0, p0.clone().add(new THREE.Vector3(4, 18, 2)), 7000, { bob: true });
                        gameMsg('A kite dances up from a field.');
                    },
                    'FIREWORK|FIREWORKS': () => {
                        let best = st.cities[0], bd = Infinity;
                        st.cities.forEach(c => { const d = plane.position.distanceTo(c.pos); if (d < bd) { bd = d; best = c; } });
                        detonateFirework(best.pos.clone().add(new THREE.Vector3(0, 20, 0)));
                        gameMsg('Fireworks over ' + best.name + '!');
                    },
                    'WIND|TURBULENCE': () => { st.turb = 140; gameMsg('Bumpy air — hold onto your coffee.'); }
                }),
                update: () => {
                    // City-name targeting (checked directly so each name works)
                    st.prop.rotation.z += (st.phase === 'parked' ? 0.15 : 0.9) * timeScale;

                    if (st.phase === 'flying') {
                        if (st.autop && st.target) st.thead = bearingTo(st.target.pos);
                        st.heading += angDiff(st.thead, st.heading) * 0.035 * timeScale;
                        const spd = 0.26 * st.spdMult * (st.flaps ? 0.6 : 1);
                        plane.position.addScaledVector(fwd(), spd * timeScale);
                        plane.position.y += (st.talt - plane.position.y) * 0.02 * timeScale;
                        plane.rotation.y = st.heading;
                        const bank = THREE.MathUtils.clamp(angDiff(st.thead, st.heading) * 1.2, -0.7, 0.7);
                        plane.rotation.z += (bank - plane.rotation.z) * 0.08 * timeScale;
                        const pitch = THREE.MathUtils.clamp((plane.position.y - st.talt) * 0.05, -0.4, 0.4);
                        plane.rotation.x += (pitch - plane.rotation.x) * 0.08 * timeScale;
                        if (st.turb > 0) {
                            st.turb -= timeScale;
                            plane.position.y += (Math.random() - 0.5) * 0.25;
                            plane.rotation.z += (Math.random() - 0.5) * 0.04;
                        }
                        if (st.smoke && Math.random() < 0.8) fwParticle(
                            plane.position.clone().add(fwd().multiplyScalar(-2.6)),
                            new THREE.Vector3(0, 0, 0), st.smoke,
                            { gravity: 0.0001, decay: 0.006, size: 0.14 });
                        // Keep the flight inside the world
                        if (Math.abs(plane.position.x) > 190 || Math.abs(plane.position.z) > 190) {
                            st.thead = bearingTo(new THREE.Vector3(0, 0, 0));
                            gameMsg('Edge of the chart — turning back toward home field.');
                        }
                    }

                    // Chase camera
                    const behind = plane.position.clone().sub(fwd().multiplyScalar(13));
                    behind.y = plane.position.y + 5.5;
                    targetCameraPos.copy(behind);
                    targetCameraLookAt.copy(plane.position);

                    if (st.target) {
                        const d = Math.round(plane.position.distanceTo(st.target.pos));
                        gameStatus('→ ' + st.target.name + ' (' + st.target.dirTxt + ') · dist ' + d +
                            ' · alt ' + Math.max(0, Math.round(plane.position.y - F)) +
                            ' · gear ' + (st.gear ? 'DOWN' : 'UP') + ' · flaps ' + (st.flaps ? 'OUT' : 'IN') +
                            (st.autop ? ' · AP' : ''));
                    } else {
                        gameStatus(st.phase === 'parked'
                            ? 'Parked at home field. Destinations: OSAKA N · PARIS E · CAIRO S · RIO W'
                            : 'No destination set — name a city.');
                    }
                }
            });

            // City names need individual handlers (expandWords gave them a stub)
            st.cities.forEach(c => {
                gameMode.words[c.name] = () => {
                    st.target = c;
                    st.cities.forEach(o => { o.beacon.visible = o === c; });
                    gameBeep(760, 0.25, 'triangle', 0.15);
                    gameMsg(c.name + ' set as destination — its beacon glows ' + c.dirTxt + ' of here.');
                };
            });

            setObjective('FLIGHT SIM',
                'Fly to a destination city and land on its runway. The aircraft answers to ' +
                'plain airman\'s words — and towers are picky about landing configuration.');
        }

        // ==================================================================
        // ==== LEVEL 3: MOON ROCKET (orbit the moon and come home) =========
        // Launch from the pad, drop the spent booster, circularize, fly one
        // full orbit, then retro-burn and land back on the pad. Space props
        // borrowed from the SPACE scene (starfield, nebula, distant planet).
        // ==================================================================
        function createMoonRocketScene() {
            currentScene = 'moon_rocket';
            scene.background = new THREE.Color(0x000005);
            scene.fog = null;
            const st = {};
            const MOON_R = 10;
            const CENTER = new THREE.Vector3(0, 1, 0);

            // Starfield + nebula + distant planet (SPACE-scene assets)
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(900 * 3);
            for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 400;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.5 });
            scene.add(new THREE.Points(starGeo, starMat));
            st.starMat = starMat;
            const nebulaMat = new THREE.MeshBasicMaterial({
                color: 0x220044, side: THREE.BackSide, transparent: true, opacity: 0.3
            });
            scene.add(new THREE.Mesh(new THREE.SphereGeometry(160, 24, 24), nebulaMat));
            st.nebulaMat = nebulaMat;
            const planetMat = new THREE.MeshPhongMaterial({ color: 0x4488FF, emissive: 0x112244 });
            const planet = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 24), planetMat);
            planet.position.set(-48, 26, -80);
            scene.add(planet);
            st.planet = planet;
            const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 12),
                new THREE.MeshBasicMaterial({ color: 0xfff2c9 }));
            sunGlow.position.set(70, 40, -90);
            scene.add(sunGlow);
            st.sun = sunGlow;
            const light = new THREE.PointLight(0xFFFFFF, 1.6, 300);
            light.position.set(60, 40, 60);
            scene.add(light);
            st.light = light;

            // The moon — an indexed sphere (shared vertices + proper UVs).
            // Displacement is a DETERMINISTIC function of position, so
            // duplicated seam vertices move identically and the surface can
            // never crack open (the old per-vertex random tore the faces).
            const moonGeo = new THREE.SphereGeometry(MOON_R, 48, 32);
            const mv = moonGeo.attributes.position;
            for (let i = 0; i < mv.count; i++) {
                const x = mv.getX(i), y = mv.getY(i), z = mv.getZ(i);
                const n = 1 +
                    0.016 * Math.sin(x * 1.7 + z * 2.3) * Math.cos(y * 2.1 + x * 0.9) +
                    0.010 * Math.sin(y * 3.7 + z * 1.3);
                mv.setXYZ(i, x * n, y * n, z * n);
            }
            moonGeo.computeVertexNormals();
            // Real moon texture borrowed from the comet-rex project. Tries the
            // local downscaled copy first, then the comet-rex original (when
            // served from the showcase root); stays flat gray if neither loads.
            const moonMat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 1 });
            (function loadMoonTex(srcs) {
                if (!srcs.length) { console.warn('moon texture missing — using flat gray'); return; }
                new THREE.TextureLoader().load(srcs[0], tex => {
                    moonMat.map = tex;
                    moonMat.color.setHex(0xffffff);
                    moonMat.needsUpdate = true;
                }, undefined, () => loadMoonTex(srcs.slice(1)));
            })(['assets/moon_2k.jpg', '../comet-rex/assets/8k_moon.jpg']);
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.copy(CENTER);
            scene.add(moon);
            st.moon = moon;

            // Launch pad on the lower-right of the disc (orbit is in the X/Y plane)
            st.padTh = -0.62;
            const padDir = th => new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
            const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.9, 0.5, 10),
                new THREE.MeshStandardMaterial({ color: 0x555e66, metalness: 0.4, roughness: 0.6 }));
            pad.position.copy(CENTER).addScaledVector(padDir(st.padTh), MOON_R + 0.1);
            pad.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), padDir(st.padTh));
            scene.add(pad);
            // Additive blending so the beacon GLOWS over the sky instead of
            // rendering as a dark beam.
            st.padBeacon = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.55, 26, 8, 1, true),
                new THREE.MeshBasicMaterial({ color: 0x66ffcc, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
            st.padBeacon.position.copy(CENTER).addScaledVector(padDir(st.padTh), MOON_R + 13);
            st.padBeacon.quaternion.copy(pad.quaternion);
            st.padBeacon.visible = false;
            scene.add(st.padBeacon);
            st.orbitRing = new THREE.Mesh(new THREE.TorusGeometry(MOON_R + 7, 0.06, 6, 80),
                new THREE.MeshBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
            st.orbitRing.position.copy(CENTER);
            st.orbitRing.visible = false;
            scene.add(st.orbitRing);

            // The rocket (with a strap-on booster ring that STAGE jettisons)
            const rocket = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf2, metalness: 0.4, roughness: 0.4 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 2.4, 12), bodyMat);
            body.position.y = 1.2; rocket.add(body);
            const noseR = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 12),
                new THREE.MeshStandardMaterial({ color: 0xc23b22 }));
            noseR.position.y = 2.85; rocket.add(noseR);
            for (let i = 0; i < 3; i++) {
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.7, 0.55),
                    new THREE.MeshStandardMaterial({ color: 0xc23b22 }));
                const a = (i / 3) * Math.PI * 2;
                fin.position.set(Math.cos(a) * 0.5, 0.35, Math.sin(a) * 0.5);
                fin.rotation.y = -a; rocket.add(fin);
            }
            const booster = new THREE.Group();
            for (let i = 0; i < 3; i++) {
                const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.4, 8),
                    new THREE.MeshStandardMaterial({ color: 0xb8863b, metalness: 0.5, roughness: 0.5 }));
                const a = (i / 3) * Math.PI * 2 + 0.5;
                tank.position.set(Math.cos(a) * 0.62, 0.7, Math.sin(a) * 0.62);
                booster.add(tank);
            }
            rocket.add(booster);
            st.booster = booster;
            st.strobe = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5),
                new THREE.MeshBasicMaterial({ color: 0x330000 }));
            st.strobe.position.y = 3.35; rocket.add(st.strobe);
            scene.add(rocket);
            st.rocket = rocket;

            // Sim state — position expressed as (angle th around the moon, altitude)
            st.phase = 'pad';   // pad -> ascent -> coast -> orbit -> deorbit -> landing -> landed
            st.th = st.padTh; st.alt = 0; st.dir = 1;
            st.lap = 0; st.lapDone = false; st.staged = false;
            st.fuel = 1; st.strobeOn = false; st.flagPlanted = false;
            st.hint1 = false; st.hint2 = false;

            const radial = () => padDir(st.th);
            const surfPos = (th, alt) => CENTER.clone().addScaledVector(padDir(th), MOON_R + 1.55 + alt);
            function flame(size) {
                const tail = st.rocket.position.clone().addScaledVector(
                    new THREE.Vector3(0, -1, 0).applyQuaternion(st.rocket.quaternion), 0.4);
                fwParticle(tail, new THREE.Vector3((Math.random() - 0.5) * 0.04, -0.03, 0),
                    new THREE.Color().setHSL(0.07 + Math.random() * 0.04, 0.95, 0.55),
                    { gravity: 0.0002, decay: 0.05, size: size || 0.1 });
            }

            setGameMode({
                name: 'MOON ROCKET',
                words: expandWords({
