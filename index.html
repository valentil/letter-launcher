            if (showEscapeMenu) {
                if (e.key === 'ArrowUp') {
                    selectedIndex = (selectedIndex - 1 + 4) % 4; // Use selectedIndex or separate? 4 items
                } else if (e.key === 'ArrowDown') {
                    selectedIndex = (selectedIndex + 1) % 4;
                } else if (e.key === 'Enter') {
                    const item = escapeMenuMeshes[selectedIndex % escapeMenuMeshes.length]; // fallback
                    // We'll use raycasting/selection in animate for visual feedback
                }
                // Update selection visually
                escapeMenuMeshes.forEach((m, i) => m.material.color.setHex(i === (selectedIndex % 4) ? 0xff0000 : 0xffffff));
                
                if (e.key === 'Enter') {
                    const action = ['RESUME', 'SCENES', 'OPTIONS', 'MAIN MENU'][selectedIndex % 4];
                    if (action === 'RESUME') handleEscapeMenu();
                    if (action === 'SCENES') { removeEscapeMenu(); gameStarted = false; createScenesMenu(); }
                    if (action === 'OPTIONS') { removeEscapeMenu(); gameStarted = false; createOptionsMenu(); }
                    if (action === 'MAIN MENU') { removeEscapeMenu(); gameStarted = false; createMenu(); }
                }
                return;
            }

            if (!gameStarted && !inScenesMenu) {
                if (e.key === 'ArrowUp') {
                    selectedIndex = (selectedIndex - 1 + menuItems.length) % menuItems.length;
                    updateSelection();
                } else if (e.key === 'ArrowDown') {
                    selectedIndex = (selectedIndex + 1) % menuItems.length;
                    updateSelection();
                } else if (e.key === 'Enter') {
                    if (menuItems[selectedIndex] === 'START GAME') {
                        gameStarted = true;
                        menuMeshes.forEach(m => scene.remove(m));
                        menuMeshes = [];
                        createDesertScene();
                    } else if (menuItems[selectedIndex] === 'SCENES') {
                        createScenesMenu();
                    } else if (menuItems[selectedIndex] === 'OPTIONS') {
                        createOptionsMenu();
                    }
                }
            } else if (inOptionsMenu) {
                if (e.key === 'ArrowUp') {
                    selectedOptionIndex = (selectedOptionIndex - 1 + optionsItems.length) % optionsItems.length;
                    updateOptionsSelection();
                } else if (e.key === 'ArrowDown') {
                    selectedOptionIndex = (selectedOptionIndex + 1) % optionsItems.length;
                    updateOptionsSelection();
                } else if (e.key === 'ArrowLeft') {
                    if (optionsItems[selectedOptionIndex] === 'SOUND VOLUME') {
                        soundVolume = Math.max(0, soundVolume - 0.1);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'GRAVITY') {
                        worldGravity = Math.min(0, worldGravity + 1);
                        world.gravity.set(0, worldGravity, 0);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'MAX LETTERS') {
                        maxLetters = Math.max(1, maxLetters - 5);
                        updateOptionsSelection();
                    }
                } else if (e.key === 'ArrowRight') {
                    if (optionsItems[selectedOptionIndex] === 'SOUND VOLUME') {
                        soundVolume = Math.min(1, soundVolume + 0.1);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'GRAVITY') {
                        worldGravity = Math.max(-20, worldGravity - 1);
                        world.gravity.set(0, worldGravity, 0);
                        updateOptionsSelection();
                    } else if (optionsItems[selectedOptionIndex] === 'MAX LETTERS') {
                        maxLetters = Math.min(200, maxLetters + 5);
                        updateOptionsSelection();
                    }
                } else if (e.key === 'Enter') {
                    if (optionsItems[selectedOptionIndex] === 'BACK') {
                        inOptionsMenu = false;
                        optionsMenuMeshes.forEach(m => scene.remove(m));
                        optionsMenuMeshes = [];
                        createMenu();
                    }
                }
            } else if (inScenesMenu) {
                if (e.key === 'ArrowUp') {
                    currentTvY = Math.min(currentTvY + 1, 4);
                    updateScenesSelection();
                } else if (e.key === 'ArrowDown') {
                    currentTvY = Math.max(currentTvY - 1, 0);
                    updateScenesSelection();
                } else if (e.key === 'ArrowLeft') {
                    currentTvX = Math.max(currentTvX - 1, 0);
                    updateScenesSelection();
                } else if (e.key === 'ArrowRight') {
                    currentTvX = Math.min(currentTvX + 1, 4);
                    updateScenesSelection();
                } else if (e.key === 'Enter') {
                    selectCurrentScene();
                }
            } else {
                if (e.key.length === 1) {
                    const now = Date.now();
                    lastTypeTime = now;

                    if (/[a-zA-Z0-9]/.test(e.key)) {
                        const char = e.key.toUpperCase();
                        const letterObj = spawnLetter(char);
                        if (letterObj && letterObj.mesh) {
                            playTone(char, letterObj.mesh.position);
                        }
                        
                        inputBuffer += char;
                        if (inputBuffer.length > 16) {
                            inputBuffer = inputBuffer.slice(-16);
                        }

                        // LLF-35: Prioritize longer words over shorter words
                        // Check for words in the buffer
                        let foundWords = [];
                        for (const word of DICTIONARY) {
                            if (inputBuffer.endsWith(word)) {
                                foundWords.push(word);
                            }
                        }

                        if (foundWords.length > 0) {
                            // Sort by length descending
                            foundWords.sort((a, b) => b.length - a.length);
                            const longestWord = foundWords[0];
                            console.log(longestWord);
                            // LLF-36: Special handling for "FEATUREBOARD"
                            if (longestWord === "FEATUREBOARD") {
                                yellWord("FEATUREBOARD");
                                launchNuke();
                                inputBuffer = "";
                                typedWord = "";
                                if (wordPending) {
                                    clearTimeout(wordPending.timer);
                                    wordPending = null;
                                }
                                return;
                            }

                            // LLF-15: Special handling for Zoo Animals
                            const zooAnimals = ['LION', 'ELEPHANT', 'MONKEY', 'ZEBRA', 'GIRAFFE'];
                            if (zooAnimals.includes(longestWord)) {
                                spawnZooAnimal(longestWord);
                                inputBuffer = "";
                                typedWord = "";
                                if (wordPending) {
                                    clearTimeout(wordPending.timer);
                                    wordPending = null;
                                }
                                return;
                            }

                            // If we have a pending word timer, and this word is longer, clear the old timer
                            if (wordPending && longestWord.length > wordPending.word.length) {
                                clearTimeout(wordPending.timer);
                                wordPending = null;
                            }

                            // If nothing is pending, or this is the longest word we've seen
                            if (!wordPending) {
                                // Wait 5 seconds before committing the word, to allow for longer words
                                const timer = setTimeout(() => {
                                    spellWordInScene(longestWord);
                                    inputBuffer = ""; // Clear buffer after finding a word
                                    typedWord = "";
                                    wordPending = null;
                                }, 2000);
                                wordPending = { word: longestWord, timer: timer };
                            }
                        }

                        typedWord += char;
                        // Check for common words or just length (e.g. 5+ chars for a gravity well)
                        if (typedWord.length >= 10) {
                            createGravityWell(typedWord, new THREE.Vector3(0, 0, 0));
                            typedWord = ""; // Reset after creating well
                        }
                    } else if (e.key === ' ') {
                        if (typedWord.length > 0) {
                            //createGravityWell(typedWord, new THREE.Vector3(0, 0, 0));
                            typedWord = "";
                        }
                        inputBuffer = ""; // Clear buffer on space
                        
                        // LLF-16: Spacebar acts as time-slow trigger
                        isTimeSlowed = !isTimeSlowed;
                        timeScale = isTimeSlowed ? 0.2 : 1.0;
                        console.log(`Time Dilation: ${isTimeSlowed ? 'SLOWED' : 'NORMAL'}`);
                    } else {
                        spawnShape();
                    }
                }
            }
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // LLF-58: Camera mouse exploration offset
            // Move camera slightly when mouse is near edges
            cameraMouseOffset.x = mouse.x * 2.0;
            cameraMouseOffset.y = mouse.y * 1.5;
            
            if (isRightClickHolding && gameStarted) {
                raycaster.setFromCamera(mouse, camera);
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const point = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, point);
                
                fusePath.push(point.clone());
                
                const dotGeo = new THREE.SphereGeometry(0.05, 4, 4);
                const dotMat = new THREE.MeshBasicMaterial({ color: 0xaa5500 });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(point);
                scene.add(dot);
                fuseDots.push(dot);
            }

            if (isDrawing && gameStarted) {
                raycaster.setFromCamera(mouse, camera);
                // Create a virtual plane at z=0 to draw on
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const point = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, point);
                
                paintbrushPath.push(point.clone());
                
                // Visual feedback for the trail
                const dotGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const dotMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(point);
                scene.add(dot);
                trailParticles.push(dot);
            }

            if (!gameStarted && !inScenesMenu && !inOptionsMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(menuMeshes, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !menuMeshes.includes(obj)) obj = obj.parent;
                    if (menuMeshes.includes(obj)) {
                        const newIndex = obj.userData.index;
                        if (newIndex !== selectedIndex) {
                            selectedIndex = newIndex;
                            updateSelection();
                        }
                    }
                }
            } else if (inOptionsMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(optionsMenuMeshes);
                if (intersects.length > 0) {
                    const idx = intersects[0].object.userData.index;
                    if (idx !== selectedOptionIndex) {
                        selectedOptionIndex = idx;
                        updateOptionsSelection();
                    }
                }
            } else if (inScenesMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tvMeshes);
                if (intersects.length > 0) {
                    const tv = intersects[0].object;
                    if (tv.userData.x !== currentTvX || tv.userData.y !== currentTvY) {
                        currentTvX = tv.userData.x;
                        currentTvY = tv.userData.y;
                        updateScenesSelection();
                    }
                }
            }
        }

        function onMouseDown(e) {
            if (gameStarted) {
                if (showEscapeMenu) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(escapeMenuMeshes);
                    if (intersects.length > 0) {
                        const action = intersects[0].object.userData.text;
                        if (action === 'RESUME') handleEscapeMenu();
                        if (action === 'SCENES') { removeEscapeMenu(); gameStarted = false; createScenesMenu(); }
                        if (action === 'OPTIONS') { removeEscapeMenu(); gameStarted = false; createOptionsMenu(); }
                        if (action === 'MAIN MENU') { removeEscapeMenu(); gameStarted = false; createMenu(); }
                    }
                    return;
                }

                if (e.button === 2) { // Right click
                    isRightClickHolding = true;
                    rightClickStartTime = Date.now();
                    fusePath = [];
                    fuseDots.forEach(d => scene.remove(d));
                    fuseDots = [];

                    raycaster.setFromCamera(mouse, camera);
                    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                    const point = new THREE.Vector3();
                    raycaster.ray.intersectPlane(plane, point);
                    
                    // Put the rocket down
                    const rocketGeo = new THREE.CylinderGeometry(0.2, 0.2, 1, 8);
                    // LLF-47: Metallic rocket material
                    const rocketMat = new THREE.MeshStandardMaterial({ 
                        color: 0xff0000,
                        metalness: 0.7,
                        roughness: 0.4,
                        envMapIntensity: 0.8,
                        flatShading: true
                    });
                    rocketMesh = new THREE.Mesh(rocketGeo, rocketMat);
                    rocketMesh.position.copy(point);
                    scene.add(rocketMesh);
                    
                    const rocketShape = new CANNON.Cylinder(0.2, 0.2, 1, 8);
                    rocketBody = new CANNON.Body({ mass: 1 });
                    rocketBody.addShape(rocketShape);
                    rocketBody.position.set(point.x, point.y, point.z);
                    world.addBody(rocketBody);
                    physicsBodies.push({ mesh: rocketMesh, body: rocketBody, type: 'rocket' });
                    
                    fusePath.push(point.clone());
                    return;
                }

                if (e.button === 1) { // Middle click
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(physicsBodies.map(pb => pb.mesh));
                    if (intersects.length > 0) {
                        const hit = physicsBodies.find(pb => pb.mesh === intersects[0].object);
                        if (hit) {
                            explodeLetter(hit);
                        }
                    }
                    return;
                }

                isDrawing = true;
                paintbrushPath = [];
                trailParticles.forEach(p => scene.remove(p));
                trailParticles = [];

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(physicsBodies.map(pb => pb.mesh));
                if (intersects.length > 0) {
                    const hit = physicsBodies.find(pb => pb.mesh === intersects[0].object);
                    if (hit) {
                        if (hit.type === 'zoo_animal') {
                            playZooAnimalSound(hit.animal);
                            hit.body.applyImpulse(new CANNON.Vec3(0, 15, 0), hit.body.position);
                            hit.body.angularVelocity.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                        } else {
                            hit.body.applyImpulse(new CANNON.Vec3(0, 10, -5), hit.body.position);
                        }
                    }
                }
            } else if (inOptionsMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(optionsMenuMeshes);
                if (intersects.length > 0) {
                    const idx = intersects[0].object.userData.index;
                    if (idx === selectedOptionIndex) {
                        if (optionsItems[selectedOptionIndex] === 'BACK') {
                            inOptionsMenu = false;
                            optionsMenuMeshes.forEach(m => scene.remove(m));
                            optionsMenuMeshes = [];
                            createMenu();
                        } else if (optionsItems[selectedOptionIndex] === 'SOUND VOLUME') {
                            soundVolume = (soundVolume + 0.2);
                            if (soundVolume > 1.1) soundVolume = 0;
                            updateOptionsSelection();
                        } else if (optionsItems[selectedOptionIndex] === 'GRAVITY') {
                            worldGravity -= 2;
                            if (worldGravity < -20) worldGravity = 0;
                            world.gravity.set(0, worldGravity, 0);
                            updateOptionsSelection();
                        } else if (optionsItems[selectedOptionIndex] === 'MAX LETTERS') {
                            maxLetters += 10;
                            if (maxLetters > 100) maxLetters = 10;
                            updateOptionsSelection();
                        }
                    } else {
                        selectedOptionIndex = idx;
                        updateOptionsSelection();
                    }
                }
            } else if (inScenesMenu) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tvMeshes);
                if (intersects.length > 0) {
                    const tv = intersects[0].object;
                    if (tv.userData.x === currentTvX && tv.userData.y === currentTvY) {
                        selectCurrentScene();
                    } else {
                        currentTvX = tv.userData.x;
                        currentTvY = tv.userData.y;
                        updateScenesSelection();
                    }
                }
            } else {
                // Main Menu Click
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(menuMeshes, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !menuMeshes.includes(obj)) obj = obj.parent;
                    if (menuMeshes.includes(obj)) {
                        const clickedIndex = obj.userData.index;
                        if (clickedIndex === selectedIndex) {
                            if (menuItems[selectedIndex] === 'START GAME') {
                                gameStarted = true;
                                menuMeshes.forEach(m => scene.remove(m));
                                menuMeshes = [];
                                createDesertScene();
                            } else if (menuItems[selectedIndex] === 'SCENES') {
                                createScenesMenu();
                            }
                        } else {
                            selectedIndex = clickedIndex;
                            updateSelection();
                        }
                    }
                }
            }
        }

        function onMouseUp(e) {
            if (isRightClickHolding) {
                isRightClickHolding = false;
                const rocket = { mesh: rocketMesh, body: rocketBody, fuse: [...fusePath], dots: [...fuseDots] };
                scene.userData.pendingRockets = scene.userData.pendingRockets || [];
                scene.userData.pendingRockets.push(rocket);
                fuseDots = [];
                fusePath = [];
                rocketMesh = null;
                rocketBody = null;
            }

            if (isDrawing) {
                isDrawing = false;
                // Ignite the trail!
                paintbrushPath.forEach(pos => {
                    spawnFirework(pos);
                });
                
                // Remove visual trail dots
                trailParticles.forEach(p => scene.remove(p));
                trailParticles = [];
                paintbrushPath = [];
            }
        }

        function spawnFirework(pos) {
            const particleCount = 20;
            const particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                const geo = new THREE.SphereGeometry(0.05, 4, 4);
                const mat = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                
                const angle = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.05 + Math.random() * 0.1;
                const velocity = new THREE.Vector3(
                    Math.sin(phi) * Math.cos(angle) * speed,
                    Math.sin(phi) * Math.sin(angle) * speed,
                    Math.cos(phi) * speed
                );
                
                particles.push({ mesh, velocity, life: 1.0 });
            }
            
            // Add a temporary animation loop or manage in main animate
            scene.userData.activeFireworks = scene.userData.activeFireworks || [];
            scene.userData.activeFireworks.push(...particles);
        }

        function spawnFireParticle(pos) {
            const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 4, 4);
            const colors = [0xff4400, 0xff8800, 0xffaa00, 0xffff00];
            const mat = new THREE.MeshBasicMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                transparent: true,
                opacity: 0.8
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);

            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.05,
                0.1 + Math.random() * 0.1,
                (Math.random() - 0.5) * 0.05
            );

            scene.userData.activeFireworks = scene.userData.activeFireworks || [];
            scene.userData.activeFireworks.push({ mesh, velocity, life: 1.0 });
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function explodeLetter(pb) {
            const pos = pb.mesh.position.clone();
            
            // LLF-4: Burst with a localized force field effect
            physicsBodies.forEach(other => {
                if (other === pb) return;
                const dist = other.body.position.distanceTo(pb.body.position);
                if (dist < 10) {
                    const dir = other.body.position.vsub(pb.body.position);
                    dir.normalize();
                    const force = 30 * (1 - dist/10);
                    other.body.applyImpulse(dir.scale(force), other.body.position);
                }
            });

            // Shatter into smaller glowing particles
            for (let i = 0; i < 30; i++) {
                const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.1, 4, 4);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: pb.mesh.material.color || 0x00ffff,
                    emissive: pb.mesh.material.color || 0x00ffff,
                    emissiveIntensity: 2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const speed = 0.2 + Math.random() * 0.4;
                const velocity = new THREE.Vector3(
                    Math.sin(phi) * Math.cos(angle) * speed,
                    Math.sin(phi) * Math.sin(angle) * speed,
                    Math.cos(phi) * speed
                );

                scene.userData.activeFireworks = scene.userData.activeFireworks || [];
                scene.userData.activeFireworks.push({ mesh, velocity, life: 1.0 + Math.random() });
            }

            // Sound
            initAudio();
            if (audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2 * soundVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }

            // Remove original
            scene.remove(pb.mesh);
            world.removeBody(pb.body);
            physicsBodies = physicsBodies.filter(p => p !== pb);
            if (pb.mesh.geometry) pb.mesh.geometry.dispose();
            if (pb.mesh.material) pb.mesh.material.dispose();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (npcMixer) npcMixer.update(0.016 * timeScale);
            const time = Date.now() * 0.002;

            // Camera Swing/Lerp
            const finalTargetPos = targetCameraPos.clone().add(cameraMouseOffset);
            camera.position.lerp(finalTargetPos, 0.05);
            currentCameraLookAt.lerp(targetCameraLookAt, 0.05);
            camera.lookAt(currentCameraLookAt);

            // LLF-60: NPC stays within the visible frustum
            const npc = physicsBodies.find(pb => pb.type === 'npc');
            if (npc && gameStarted) {
                // Bounds for the visible scene area (frustum approximation)
                const minX = -12, maxX = 12;
                const minZ = -5, maxZ = 10;
                const minY = -5, maxY = 5;

                let pos = npc.body.position;
                let needsReset = false;

                if (pos.x < minX || pos.x > maxX) { pos.x = THREE.MathUtils.clamp(pos.x, minX, maxX); needsReset = true; }
                if (pos.z < minZ || pos.z > maxZ) { pos.z = THREE.MathUtils.clamp(pos.z, minZ, maxZ); needsReset = true; }
                if (pos.y < minY || pos.y > maxY) { pos.y = THREE.MathUtils.clamp(pos.y, minY, maxY); needsReset = true; }

                if (needsReset) {
                    npc.body.velocity.set(0, 0, 0);
                    // Pick a new wander target inside bounds
                    npc.wanderTarget = new CANNON.Vec3(
                        (Math.random() - 0.5) * 10,
                        -5,
                        (Math.random() - 0.5) * 5
                    );
                    npc.wanderTimer = 2;
                }
                
                // LLF-60: Scene Anchor Point - All future scene elements should be placed 
                // within the frustum visible from targetCameraPos (0, 5, 15) looking at (0, 0, 0).
            }

            if (showEscapeMenu) {
                escapeMenuMeshes.forEach((mesh, i) => {
                    const dist = 5;
                    const pos = new THREE.Vector3(0, (escapeMenuMeshes.length/2 - i) * 1.2, -dist);
                    pos.applyQuaternion(camera.quaternion);
                    pos.add(camera.position);
                    mesh.position.lerp(pos, 0.1);
                    mesh.quaternion.slerp(camera.quaternion, 0.1);
                });
            }
            if (!gameStarted) {
                menuMeshes.forEach((group, i) => {
                    group.userData.baseScale = THREE.MathUtils.lerp(group.userData.baseScale, group.userData.targetScale, 0.1);
                    group.scale.setScalar(group.userData.baseScale);
                    group.position.y = group.userData.originalY + Math.sin(time + i) * 0.2;
                    group.children.forEach((char, j) => {
                        char.position.y = Math.sin(time * 2 + j * 0.5) * 0.05;
                        char.rotation.z = Math.sin(time * 3 + j) * 0.02;
                    });
                });

                if (inScenesMenu) {
                    const selectedTv = tvGrid[currentTvY][currentTvX];
                    if (selectedTv && selectedTv.userData.textMesh) {
                        selectedTv.userData.textMesh.rotation.y = Math.sin(time * 2) * 0.2;
                    }
                }

                if (inOptionsMenu) {
                    optionsMenuMeshes.forEach((mesh, i) => {
                        mesh.rotation.y = Math.sin(time + i) * 0.1;
                        if (optionsItems[i] !== 'BACK') {
                             const charGeo = new THREE.TextGeometry(mesh.name, {
                                font: font, size: 0.8, height: 0.2
                            });
                            charGeo.computeBoundingBox();
                            mesh.geometry.dispose();
                            mesh.geometry = charGeo;
                            const width = charGeo.boundingBox.max.x - charGeo.boundingBox.min.x;
                            mesh.position.x = -width / 2;
                        }
                    });
                }
            } else {
                world.step((1 / 60) * timeScale);
                const now = Date.now();

                // Gravity Wells Logic
                gravityWells = gravityWells.filter(well => {
                    const elapsed = now - well.startTime;
                    if (elapsed > well.duration) {
                        scene.remove(well.mesh);
                        return false;
                    }

                    // Animate the well mesh
                    well.mesh.rotation.z += 0.05 * timeScale;
                    well.mesh.scale.setScalar(1 + Math.sin(time * 5) * 0.2);
                    well.mesh.material.opacity = 0.5 * (1 - elapsed / well.duration);

                    // Pull physics bodies
                    physicsBodies.forEach(pb => {
                        const dist = pb.body.position.distanceTo(new CANNON.Vec3(well.position.x, well.position.y, well.position.z));
                        if (dist < well.radius) {
                            const force = new CANNON.Vec3(
                                well.position.x - pb.body.position.x,
                                well.position.y - pb.body.position.y,
                                well.position.z - pb.body.position.z
                            );
                            force.normalize();
                            force.scale(well.strength * (1 - dist / well.radius) * timeScale, force);
                            pb.body.applyForce(force, pb.body.position);
                        }
                    });
                    return true;
                });

                physicsBodies.forEach(pb => {
                // LLF-56: If y is very low, it might have fallen through colliders 
                if (pb.body.position.y < -50) { 
                    pb.body.position.set(0, 15, 0); 
                    pb.body.velocity.set(0, 0, 0); 
                }
                    pb.mesh.position.copy(pb.body.position);
                    pb.mesh.quaternion.copy(pb.body.quaternion);

                    // LLF-54: Glowing effect for spelled words
                                        // LLF-65: Fire shader more like actual flames
                    if (pb.isFireWord) {
                        const intensity = 5 + Math.sin(time * 15) * 3;
                        pb.mesh.material.emissiveIntensity = intensity;
                        pb.mesh.material.color.setRGB(1.0, 0.3 + Math.sin(time * 20) * 0.2, 0.0);
                        
                        // LLF-65: Actual flames particle effects
                        if (Math.random() > 0.2) {
                            const firePos = pb.mesh.position.clone();
                            firePos.x += (Math.random() - 0.5) * 0.5;
                            firePos.z += (Math.random() - 0.5) * 0.5;
                            spawnFireParticle(firePos);
                        }
                    }
                    if (pb.isSpelled) {
                        const glowIntensity = 0.5 + Math.sin(time * 5) * 0.5;
                        if (pb.mesh.material.emissive) {
                            pb.mesh.material.emissive.setHex(pb.mesh.material.color.getHex());
                            pb.mesh.material.emissiveIntensity = glowIntensity * 2;
                        }
                    }

                    // LLF-3: Zoo Animal Wandering logic
                    if (pb.type === 'zoo_animal' && pb.body.position.y < -4) {
                        pb.wanderTimer -= (1/60) * timeScale;
                        if (pb.wanderTimer <= 0) {
                            pb.wanderTimer = 2 + Math.random() * 3;
                            pb.wanderTarget = new CANNON.Vec3((Math.random()-0.5)*40, -5, (Math.random()-0.5)*40);
                        }
                        const dir = pb.wanderTarget.vsub(pb.body.position);
                        dir.y = 0;
                        dir.normalize();
                        const speed = 5 * timeScale;
                        pb.body.velocity.x = dir.x * speed;
                        pb.body.velocity.z = dir.z * speed;
                        
                        // Look towards target (rough approximation with quaternion)
                        const angle = Math.atan2(dir.x, dir.z);
                        pb.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle);
                    }
                    if (pb.type === 'npc') {
                        // Keep on ground if fallen through
                        if (pb.body.position.y < -10) pb.body.position.y = 5;

                        // Knock over letters logic (applied to all physics bodies)
                        physicsBodies.forEach(other => {
                            if (other !== pb && other.body.position.distanceTo(pb.body.position) < 2.0) {
                                // LLB-17: Disable knocking while presenting and for 5s after
                                if (pb.presentingWord || (pb.postPresentingTimer && pb.postPresentingTimer > 0)) {
                                    return;
                                }
                                // Knock over: apply a force away from npc
                                const knockDir = other.body.position.vsub(pb.body.position);
                                knockDir.y = 0.5; // slight upward pop
                                knockDir.normalize();
                                other.body.applyImpulse(knockDir.scale(5), other.body.position);
                            }
                        });

                        if (pb.presentingWord) {
                            const word = pb.presentingWord;
                            pb.body.velocity.set(0, 0, 0);

                            // Keep shown letters standing
                            if (pb.shownLetters) {
                                pb.shownLetters.forEach((l, idx) => {
                                    if (!l.body || !l.mesh || l.isHeadingToScreen) return;
                                    const npcPos = pb.body.position;
                                    // Space letters out, handle long words by scaling distance
                                    const spacing = word.length > 8 ? 1.0 : 1.5;
                                    const targetPos = new THREE.Vector3(npcPos.x, npcPos.y - 1, npcPos.z).add(
                                        new THREE.Vector3((idx - (word.length-1)/2)*spacing, 0, 4).applyQuaternion(pb.mesh.quaternion)
                                    );
                                    // Lerp body towards target to "stand them up"
                                    const currentPos = l.body.position;
                                    l.body.position.x += (targetPos.x - currentPos.x) * 0.1 * timeScale;
                                    l.body.position.z += (targetPos.z - currentPos.z) * 0.1 * timeScale;
                                    l.body.velocity.y *= 0.9; // dampen
                                    // Align rotation to NPC
                                    const targetQuat = pb.body.quaternion;
                                    l.body.quaternion.x += (targetQuat.x - l.body.quaternion.x) * 0.1 * timeScale;
                                    l.body.quaternion.y += (targetQuat.y - l.body.quaternion.y) * 0.1 * timeScale;
                                    l.body.quaternion.z += (targetQuat.z - l.body.quaternion.z) * 0.1 * timeScale;
                                    l.body.quaternion.w += (targetQuat.w - l.body.quaternion.w) * 0.1 * timeScale;
                                    l.body.quaternion.normalize();
                                });
                            }
                            
                            // LLF-63: Throw entire word at once
                            const npcPosThrow = pb.body.position;
                            const backpackPos = new THREE.Vector3(npcPosThrow.x, npcPosThrow.y + 1, npcPosThrow.z).add(
                                new THREE.Vector3(0,0,-1).applyQuaternion(pb.mesh.quaternion)
                            );
                            
                            // Create a word group/container or just throw individual letters in a burst
                            for (let i = 0; i < word.length; i++) {
                                const char = word[i];
                                const letter = spawnLetter(char);
                                if (letter) {
                                    letter.body.position.set(backpackPos.x, backpackPos.y, backpackPos.z);
                                    
                                    // Fire shader / Glowing effect
                                    letter.mesh.material = new THREE.MeshStandardMaterial({
                                        color: 0xff4400,
                                        emissive: 0xff2200,
                                        emissiveIntensity: 5,
                                        metalness: 0.9,
                                        roughness: 0.1
                                    });
                                    letter.isFireWord = true;

                                    const targetPos = new THREE.Vector3(0, 0, 0);
                                    const throwDir = targetPos.clone().sub(letter.body.position).normalize();
                                    const speed = 25 + Math.random() * 10;
                                    // Spread them out slightly
                                    const spread = new THREE.Vector3((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3);
                                    
                                    // Calculate upward toss
                                    const upToss = 15 + Math.random() * 10;
                                    
                                    letter.body.velocity.set(
                                        throwDir.x * speed + spread.x, 
                                        upToss + spread.y, 
                                        throwDir.z * speed + spread.z
                                    );
                                    
                                    letter.isHeadingToScreen = false;
                                    letter.char = char;
                                }
                            }
                            
                            pb.presentingWord = null;
                            pb.postPresentingTimer = 5.0;
                            pb.wanderTimer = 2;
                        }
                        
                        if (!pb.presentingWord) {
                            // LLB-17: Tick post-presenting timer
                            if (pb.postPresentingTimer > 0) {
                                pb.postPresentingTimer -= (1/60) * timeScale;
                            }

                            // LLF-66: Dino wanders towards camera over 20 seconds
                            if (pb.wanderTowardCamera) {
                                const elapsed = (Date.now() - pb.wanderStartTime) / 1000;
                                const duration = 20; // 20 seconds
                                
                                // Target position: 50 units out from camera in the direction it's pointing
                                const cameraDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                                cameraDir.y = 0; // Keep it on the ground
                                cameraDir.normalize();
                                const targetPos = camera.position.clone().add(cameraDir.multiplyScalar(50));
                                targetPos.y = -5; // Ground level
                                
                                if (elapsed < duration) {
                                    // Mix wandering with camera attraction
                                    const cameraInfluence = elapsed / duration; // 0 to 1
                                    
                                    if (pb.wanderTimer <= 0 || !pb.wanderTarget) {
                                        pb.wanderTimer = 5 + Math.random() * 10;
                                        const randomWander = new CANNON.Vec3((Math.random()-0.5)*60, -5, (Math.random()-0.5)*60);
                                        
                                        // Blend random target with camera target
                                        pb.wanderTarget = new CANNON.Vec3(
                                            THREE.MathUtils.lerp(randomWander.x, targetPos.x, cameraInfluence),
                                            -5,
                                            THREE.MathUtils.lerp(randomWander.z, targetPos.z, cameraInfluence)
                                        );
                                    }
                                } else {
                                    // Fully locked on to camera direction
                                    pb.wanderTarget = new CANNON.Vec3(targetPos.x, -5, targetPos.z);
                                    if (pb.wanderTimer <= 0) pb.wanderTimer = 1.0;
                                }
                            }

                            // Normal Wandering
                            pb.wanderTimer -= (1/60) * timeScale;
                            if (pb.wanderTimer <= 0 || !pb.wanderTarget) {
                                pb.wanderTimer = 5 + Math.random() * 10;
                                pb.wanderTarget = new CANNON.Vec3((Math.random()-0.5)*60, -5, (Math.random()-0.5)*60);
                            }
                            const dir = pb.wanderTarget.vsub(pb.body.position);
                            dir.y = 0; dir.normalize();
                            pb.body.velocity.x = dir.x * 4 * timeScale;
                            pb.body.velocity.z = dir.z * 4 * timeScale;
                            
                            const angle = Math.atan2(dir.x, dir.z);
                            pb.body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle);
                        }
                    }
                });

                if (currentScene === 'coastal_city') {
                    const ocean = scene.children.find(m => m.geometry && m.geometry.type === 'PlaneGeometry' && m.position.y <= -15);
                    if (ocean) {
                        ocean.position.y = -15.5 + Math.sin(time * 0.5) * 0.2;
                        ocean.rotation.x = -Math.PI / 2 + Math.sin(time * 0.3) * 0.01;
                        ocean.rotation.y = Math.sin(time * 0.1) * 0.01;
                    }
                }
                if (currentScene === 'desert' && scene.userData.sparkles) {
                    const positions = scene.userData.sparkles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i+1] = -5.04 + Math.sin(time * 5 + i) * 0.05;
                    }
                    scene.userData.sparkles.geometry.attributes.position.needsUpdate = true;
                }
                if (currentScene === 'desert' && scene.userData.sparkles) {
                    const positions = scene.userData.sparkles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i+1] = -5.04 + Math.sin(time * 5 + i) * 0.05;
                    }
                    scene.userData.sparkles.geometry.attributes.position.needsUpdate = true;
                }

                if (currentScene === 'wild_west' && scene.userData.train) {
                    // LLB-15: Train travels backwards
                    scene.userData.trainProgress = (scene.userData.trainProgress || 0) - 0.0005 * timeScale;
                    if (scene.userData.trainProgress < 0) scene.userData.trainProgress = 1;
                    
                    const progress = scene.userData.trainProgress;
                    const segmentCount = 200;
                    const segmentLength = 5;
                    
                    let currentPos = new THREE.Vector3(0, -5.05, -500); 
                    let currentAngle = 0;
                    const targetIdx = Math.floor(progress * segmentCount);
                    for (let i = 0; i < targetIdx; i++) {
                        const forward = new THREE.Vector3(0, 0, segmentLength).applyAxisAngle(new THREE.Vector3(0, 1, 0), currentAngle);
                        currentPos.add(forward);
                        if (currentPos.z > -100 && currentPos.z < 200) {
                            currentAngle += 0.02;
                        }
                    }
                    scene.userData.train.position.copy(currentPos);
                    
                    // LLB-15: Face the direction of (reverse) travel, which is currentAngle + PI
                    scene.userData.train.rotation.y = currentAngle + Math.PI / 2;
                    
                    // Rotate wheels backwards
                    scene.userData.trainWheels.forEach(w => {
                        w.rotation.x -= 0.1 * timeScale;
                    });
                }

                // Firework Animation Logic
                if (scene.userData.activeFireworks) {
                    scene.userData.activeFireworks = scene.userData.activeFireworks.filter(p => {
                        p.mesh.position.x += p.velocity.x * timeScale;
                        p.mesh.position.y += p.velocity.y * timeScale;
                        p.mesh.position.z += p.velocity.z * timeScale;
                        p.velocity.y -= 0.001 * timeScale; // Gravity
                        p.life -= 0.02 * timeScale;
                        p.mesh.material.opacity = p.life;
                        p.mesh.material.transparent = true;
                        
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            return false;
                        }
                        return true;
                    });
                }

                // Rocket Fuse and Launch Logic
                if (scene.userData.pendingRockets) {
                    scene.userData.pendingRockets = scene.userData.pendingRockets.filter(rocket => {
                        if (rocket.fuse.length > 0) {
                            // LLF-16: Use a counter to slow down fuse burning
                            rocket.fuseCounter = (rocket.fuseCounter || 0) + timeScale;
                            if (rocket.fuseCounter >= 1.0) {
                                rocket.fuseCounter = 0;
                                const p = rocket.fuse.pop();
                                const dot = rocket.dots.pop();
                                if (dot) {
                                    spawnFirework(p);
                                    scene.remove(dot);
                                }
                            }
                            return true;
                        } else {
                            // Launching phase (LLF-41: Slow liftoff and exhaust)
                            if (!rocket.launchStartTime) {
                                rocket.launchStartTime = now;
                                rocket.launchElapsed = 0;
                                rocket.body.mass = 0.5; // Slightly lighter for lift
                                rocket.body.updateMassProperties();
                            }

                            rocket.launchElapsed += (now - (rocket.lastLaunchUpdate || now)) * timeScale;
                            rocket.lastLaunchUpdate = now;
                            const launchElapsed = rocket.launchElapsed;
                            
                            // Slow liftoff: apply increasing upward force
                            const liftForce = Math.min(launchElapsed / 20, 25) * timeScale; 
                            rocket.body.applyForce(new CANNON.Vec3(0, liftForce, 0), rocket.body.position);
                            
                            // Exhaust particles
                            if (Math.random() > (1.0 - 0.7 * timeScale)) {
                                spawnFirework(new THREE.Vector3(
                                    rocket.body.position.x + (Math.random()-0.5)*0.2,
                                    rocket.body.position.y - 0.5,
                                    rocket.body.position.z + (Math.random()-0.5)*0.2
                                ));
                            }

                            if (launchElapsed < 2500) { // Keep in launch phase for 2.5 seconds
                                return true;
                            }

                            // LLF-42: Stop applying lift force and let gravity take over
                            if (launchElapsed < 6000) { // Stay in simulation for 6 seconds total
                                // If the rocket has hit the ground (y < -4.5) and is falling
                                if (rocket.body.position.y < -4.5 && rocket.body.velocity.y < 0) {
                                    // Explode on impact
                                } else {
                                    return true;
                                }
                            }

                            // Final Explosion
                            for(let i=0; i<30; i++) {
                                spawnFirework(new THREE.Vector3(
                                    rocket.body.position.x + (Math.random()-0.5)*5,
                                    rocket.body.position.y + (Math.random()-0.5)*5,
                                    rocket.body.position.z + (Math.random()-0.5)*5
                                ));
                            }
                            // Remove rocket
                            scene.remove(rocket.mesh);
                            world.removeBody(rocket.body);
                            physicsBodies = physicsBodies.filter(pb => pb.body !== rocket.body);
                            return false;
                        }
                    });
                }
            }

            
            // LLF-62: Screen letters logic
            screenLetters = screenLetters.filter(sl => {
                if (sl.stuckTimer > 0) {
                    sl.stuckTimer -= (1/60) * timeScale;
                } else {
                    sl.vy += 0.2 * timeScale;
                    sl.y += sl.vy;
                    sl.life -= 0.01 * timeScale;
                    sl.el.style.top = sl.y + '%';
                    sl.el.style.opacity = sl.life;
                    sl.el.style.transform = 'scale(' + (1 + (1-sl.life)) + ')';
                }

                if (sl.y > 110 || sl.life <= 0) {
                    document.getElementById('waterMarkOverlay').removeChild(sl.el);
                    return false;
                }
                return true;
            });

            
            // Check 3D letters for screen collision
            const frustum = new THREE.Frustum();
            const projScreenMatrix = new THREE.Matrix4();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);

            physicsBodies.forEach(pb => {
                if (pb.isHeadingToScreen) {
                    const pos = pb.mesh.position.clone();
                    const distance = pos.distanceTo(camera.position);
                    
                    // If it's in front of camera and very close
                    if (distance < 5) {
                        // Project to screen coordinates to see if it's actually "on screen"
                        const vector = pos.project(camera);
                        const x = (vector.x + 1) / 2;
                        const y = -(vector.y - 1) / 2;
                        
                        // If within screen bounds (roughly)
                        if (x > -0.2 && x < 1.2 && y > -0.2 && y < 1.2) {
                            spawnScreenLetter(pb.char);
                            pb.isHeadingToScreen = false;
                            scene.remove(pb.mesh);
                            world.removeBody(pb.body);
                            physicsBodies = physicsBodies.filter(item => item !== pb);
                        }
                    }
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
